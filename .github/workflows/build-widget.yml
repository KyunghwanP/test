name: 위젯 exe 빌드/배포

# 위젯 코드가 바뀌면 윈도우에서 AutoHotkey로 exe를 자동 빌드해
# 'widget-latest' 릴리스에 올린다. 사용자는 ynhs-launcher.exe만 받아 실행하면
# 실행할 때마다 이 릴리스의 최신 ynhs-widget.exe 를 내려받아 쓴다(AutoHotkey 불필요).

on:
  push:
    branches: [main]
    paths:
      - 'widget/ynhs-widget.ahk'
      - 'widget/ynhs-launcher.ahk'
      - '.github/workflows/build-widget.yml'
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write      # 릴리스 생성/자산 업로드에 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AutoHotkey v2 + Ahk2Exe 준비(GitHub 릴리스에서 — autohotkey.com은 Cloudflare 차단)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'gh-actions'; 'Authorization' = "Bearer $env:GH_TOKEN" }

          # AutoHotkey v2 포터블 zip(베이스 파일 AutoHotkey64.exe 포함)
          $ahkRel = Invoke-RestMethod -Headers $headers 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest'
          $ahkZip = ($ahkRel.assets | Where-Object { $_.name -match '^AutoHotkey_.*\.zip$' -and $_.name -notmatch 'src|setup' } | Select-Object -First 1).browser_download_url
          if (-not $ahkZip) { throw 'AutoHotkey zip 자산을 찾지 못함' }
          Invoke-WebRequest -Headers $headers -Uri $ahkZip -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath tools/ahk -Force

          # Ahk2Exe 컴파일러 zip
          $a2eRel = Invoke-RestMethod -Headers $headers 'https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest'
          $a2eZip = ($a2eRel.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1).browser_download_url
          if (-not $a2eZip) { throw 'Ahk2Exe zip 자산을 찾지 못함' }
          Invoke-WebRequest -Headers $headers -Uri $a2eZip -OutFile a2e.zip
          Expand-Archive a2e.zip -DestinationPath tools/ahk2exe -Force

          # 실제 경로 탐색 후 다음 스텝으로 전달
          $base = (Get-ChildItem tools/ahk    -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1).FullName
          $a2e  = (Get-ChildItem tools/ahk2exe -Recurse -Filter Ahk2Exe.exe      | Select-Object -First 1).FullName
          if (-not $base) { throw 'AutoHotkey64.exe 없음' }
          if (-not $a2e)  { throw 'Ahk2Exe.exe 없음' }
          "AHK_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AHK2EXE=$a2e"   | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "base=$base"; Write-Host "a2e=$a2e"

      - name: WebView2 라이브러리(thqby/ahk2_lib) 준비
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/thqby/ahk2_lib.git lib
          Copy-Item lib/*.ahk widget/ -Force                       # ComVar.ahk · Promise.ahk 등
          Copy-Item lib/WebView2 widget/WebView2 -Recurse -Force    # WebView2\ 폴더 전체

      - name: WebView2Loader.dll 준비(NuGet, 64bit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2' -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2 -Force
          Copy-Item wv2/runtimes/win-x64/native/WebView2Loader.dll widget/WebView2Loader.dll -Force

      - name: 문법 검증(컴파일로 스크립트 오류만 확인 — 배포엔 미사용)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:AHK_BASE
          $a2e  = $env:AHK2EXE
          # Ahk2Exe는 GUI 앱이라 '&'로는 완료를 안 기다림 → Start-Process -Wait 로 대기.
          $chk = Join-Path $PWD '_syntaxcheck.exe'
          Start-Process -FilePath $a2e -Wait -NoNewWindow -ArgumentList @(
            '/in', (Resolve-Path widget/ynhs-widget.ahk).Path, '/out', $chk, '/base', $base)
          if (!(Test-Path $chk)) { throw '위젯 스크립트 컴파일(문법) 실패' }
          Remove-Item $chk -Force

      - name: 포터블 패키지 조립(서명된 AutoHotkey + 스크립트 + 라이브러리)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'YnhsWidget'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # WebView2 라이브러리(ComVar.ahk·Promise.ahk 등) + WebView2\ 폴더 + Loader.dll (widget/에 준비돼 있음)
          Copy-Item widget/*.ahk       $stage -Force
          Copy-Item widget/WebView2    (Join-Path $stage 'WebView2') -Recurse -Force
          Copy-Item widget/WebView2Loader.dll $stage -Force
          Remove-Item (Join-Path $stage 'ynhs-widgets.ahk') -ErrorAction SilentlyContinue   # 크롬앱 간편판 제외
          # 서명된 AutoHotkey64.exe를 'YnhsWidget.exe'로 → 같은 이름의 YnhsWidget.ahk를 자동 실행(서명 유지)
          Copy-Item $env:AHK_BASE (Join-Path $stage 'YnhsWidget.exe') -Force
          Copy-Item widget/ynhs-launcher.ahk (Join-Path $stage 'YnhsWidget.ahk') -Force
          Remove-Item (Join-Path $stage 'ynhs-launcher.ahk') -ErrorAction SilentlyContinue  # YnhsWidget.ahk로 대체
          # 사용 안내
          @"
          영남고 위젯 (무설치 포터블)

          1) 이 폴더를 원하는 위치(바탕화면/문서 등)에 통째로 둡니다.
          2) YnhsWidget.exe 를 더블클릭하면 위젯이 뜹니다. (최초 1회 구글 로그인)
             - YnhsWidget.exe 는 서명된 정품 AutoHotkey 이고, 같은 이름의 YnhsWidget.ahk 를 실행합니다.
             - 실행할 때마다 최신 위젯 스크립트를 자동으로 받아옵니다(오프라인이면 기존 것 사용).
          3) 부팅 시 자동 실행: Win+R -> shell:startup -> YnhsWidget.exe 의 바로가기를 넣기.

          ※ 폴더 안 파일(AutoHotkey·라이브러리)은 지우지 마세요. YnhsWidget.exe 만 실행하면 됩니다.
          "@ | Out-File -FilePath (Join-Path $stage '읽어주세요.txt') -Encoding utf8

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $PWD 'YnhsWidget-portable.zip') -Force
          "$env:GITHUB_SHA".Substring(0,7) | Out-File -FilePath version.txt -Encoding ascii -NoNewline

      - name: 릴리스 배포(widget-latest 롤링 태그)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: 위젯 최신 빌드
          body: |
            영남고 위젯 — 무설치 포터블 패키지(서명된 AutoHotkey로 구동).

            · YnhsWidget-portable.zip — 이걸 받아 압축을 풀고 폴더 안의 **YnhsWidget.exe**를 실행하세요.
              - 실제 실행 파일은 '서명된 정품 AutoHotkey'라 백신 평판 경고가 거의 없습니다.
              - 실행할 때마다 최신 위젯 스크립트를 자동으로 받아옵니다(자동 업데이트 유지).
          files: |
            YnhsWidget-portable.zip
            version.txt
