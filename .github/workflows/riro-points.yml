name: riro-points-scraper

# 밤 예약은 껐다 — 리로스쿨이 2026-10-14 부터 해외 접속을 막아 GitHub(미국) 서버로는 매일 실패한다.
# 이제 학교 PC 가 받는다 (riro/README.md). 손으로 돌리면 scrape-riro.js 가 각 단계의 상태·응답한
# 서버를 기록하므로, 리로스쿨이 해외 차단을 풀었는지 볼 때 쓴다.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: |
          cd scripts
          npm install

      - name: Playwright 브라우저 설치
        run: |
          cd scripts
          npx playwright install chromium --with-deps

      - name: 상벌점 스크래핑
        env:
          RIRO_ID: ${{ secrets.RIRO_ID }}
          RIRO_PW: ${{ secrets.RIRO_PW }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd scripts
          node scrape-riro.js
