name: riro-points-scraper

on:
  schedule:
    - cron: '0 17 * * *'  # 매일 KST 02:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: |
          cd scripts
          npm install

      - name: Playwright 브라우저 설치
        run: |
          cd scripts
          npx playwright install chromium --with-deps

      - name: 상벌점 스크래핑
        env:
          RIRO_ID: ${{ secrets.RIRO_ID }}
          RIRO_PW: ${{ secrets.RIRO_PW }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd scripts
          node scrape-riro.js
