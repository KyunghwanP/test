name: 주간교육활동 자동 스크래핑

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성 설치
        run: cd scripts && npm install
      - name: Playwright 설치
        run: cd scripts && npx playwright install chromium --with-deps
      - name: 스크래핑 실행
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: cd scripts && node scrape-weekly.js
