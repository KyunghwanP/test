name: 날씨 자동 갱신

on:
  schedule:
    # 30분마다 (UTC 기준, 지연 가능성 있음 — 클라이언트는 45분까지 신선으로 취급)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 수동 실행 버튼
  push:
    paths:
      - 'scripts/fetch-weather.js'
      - '.github/workflows/fetch-weather.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: firebase-admin 설치 (Playwright 등 무거운 의존성 제외)
        run: |
          mkdir -p /tmp/wxdeps
          cd /tmp/wxdeps
          npm init -y > /dev/null
          npm install firebase-admin@^12.0.0 --no-audit --no-fund

      - name: 날씨 수집 실행
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_PATH: /tmp/wxdeps/node_modules
        run: node scripts/fetch-weather.js
