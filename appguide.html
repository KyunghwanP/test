<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대학 모집요강 조회기</title>
    <!-- pdf.js 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        #pdfContainer { 
            width: 100%; 
            height: 80vh; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            background: #ddd; 
        }
        .page-canvas { 
            display: block; 
            margin: 10px auto; 
            box-shadow: 0 0 5px rgba(0,0,0,0.3); 
            background: white; 
        }
    </style>
</head>
<body>
    <h1>대학 수시 모집요강 조회기</h1>
    <select id="univSelect">
        <option>대학을 선택하세요</option>
    </select>
    <div id="pdfContainer"></div>

    <script>
        const PROXY_URL = "https://adiga-pdf-proxy.pkh910518.workers.dev/?url=";
        const select = document.getElementById('univSelect');
        const container = document.getElementById('pdfContainer');
        
        // pdf.js 워커 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 1. appguide.csv 파일 읽기
        fetch('appguide.csv')
            .then(res => res.text())
            .then(csv => {
                const rows = csv.split('\n').slice(1);
                rows.forEach(row => {
                    const columns = row.split(',');
                    // CSV 구조에 따라 인덱스 조정 필요 (대학명: 인덱스 1, 링크: 인덱스 4)
                    const name = columns[1]?.replace(/"/g, '');
                    const link = columns[4]?.replace(/"/g, '');
                    
                    if (link && link.includes('http')) {
                        const opt = document.createElement('option');
                        opt.value = link;
                        opt.textContent = name;
                        select.appendChild(opt);
                    }
                });
            });

        // 2. 대학 선택 시 비동기 렌더링
        select.addEventListener('change', async (e) => {
            const rawLink = e.target.value;
            if (!rawLink) return;

            const safeUrl = PROXY_URL + encodeURIComponent(rawLink);
            container.innerHTML = "PDF 문서를 불러오는 중입니다...";
            
            try {
                const pdf = await pdfjsLib.getDocument(safeUrl).promise;
                container.innerHTML = "";
                
                // 페이지별 순차적 렌더링
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const canvas = document.createElement('canvas');
                    canvas.className = 'page-canvas';
                    container.appendChild(canvas);
                    
                    const viewport = page.getViewport({ scale: 1.0 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ 
                        canvasContext: canvas.getContext('2d'), 
                        viewport: viewport 
                    }).promise;
                }
            } catch (err) {
                container.innerHTML = "파일을 불러올 수 없습니다. 프록시 서버 상태를 확인하세요.";
                console.error(err);
            }
        });
    </script>
</body>
</html>
