<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>접속 상태 기록기</title>
<!--
  접속이 간헐적으로 막히는 원인을 가리기 위한 도구. 앱과는 무관하며 앱을 건드리지 않는다.
  탭 하나에 띄워 두면 스스로 재고 남긴다. 막혔을 때 직접 재는 것은 현실적이지 않아서다.

  가리려는 것:
   · 작은 파일(1KB)도 같이 막히는가        → 그렇다면 파일 크기·앱·워커와 무관, 연결 문제
   · 큰 파일(index.html)만 막히는가        → 크기 문제, 쪼개면 해결된다
   · 시간을 어디서 먹는가(DNS·연결·다운로드) → 앞 둘이면 망, 마지막이면 크기

  기록은 localStorage 에 남아 새로고침해도 살아남는다. [복사] 로 통째로 가져갈 수 있다.
-->
<style>
  :root{
    --bg:#F8FAFC; --card:#fff; --ink:#0F172A; --ink2:#64748B; --line:#E2E8F0;
    --ok:#0F766E; --bad:#B91C1C; --warn:#B45309; --accent:#006BFF;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0B1220; --card:#111827; --ink:#E8EDF5; --ink2:#9AA7BC; --line:#26324A;
           --ok:#5EEAD4; --bad:#FCA5A5; --warn:#FCD34D; --accent:#5D8AB8; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:20px;
       font-family:'Noto Sans KR','맑은 고딕',sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--ink2);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{border:none;border-radius:6px;padding:9px 16px;cursor:pointer;
         font:600 13px/1 inherit;background:var(--accent);color:#fff}
  button.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
  .stat{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
  .stat div{font-size:13px;color:var(--ink2)}
  .stat b{display:block;font:700 22px/1.3 'IBM Plex Mono',monospace;color:var(--ink);
          font-variant-numeric:tabular-nums}
  .verdict{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:13.5px;
           background:var(--bg);border:1px solid var(--line)}
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:12.5px;
        font-variant-numeric:tabular-nums;min-width:640px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--ink2);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--card)}
  td.n{text-align:right;font-family:'IBM Plex Mono',monospace}
  .ok{color:var(--ok)} .bad{color:var(--bad);font-weight:700} .warn{color:var(--warn)}
  code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
<div class="wrap">
  <h1>접속 상태 기록기</h1>
  <p class="sub">이 탭을 열어 두면 스스로 재고 남깁니다. 막혔던 때를 나중에 그대로 볼 수 있습니다.</p>

  <div class="card">
    <div class="row">
      <button id="toggle">멈춤</button>
      <button class="ghost" id="now">지금 한 번</button>
      <button class="ghost" id="copy">기록 복사</button>
      <button class="ghost" id="clear">기록 지우기</button>
    </div>
    <div class="stat">
      <div>잰 횟수<b id="cTot">0</b></div>
      <div>작은 파일 실패<b id="cSmall" class="ok">0</b></div>
      <div>큰 파일 실패<b id="cBig" class="ok">0</b></div>
      <div>작은 파일 중앙값<b id="mSmall">–</b></div>
      <div>큰 파일 중앙값<b id="mBig">–</b></div>
    </div>
    <div class="verdict" id="verdict">아직 판단할 만큼 재지 않았습니다.</div>
  </div>

  <div class="card">
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th>시각</th><th>대상</th><th>결과</th>
          <th class="n">전체</th><th class="n">DNS</th><th class="n">연결</th>
          <th class="n">TLS</th><th class="n">응답까지</th><th class="n">받기</th><th class="n">크기</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <p class="sub">
    작은 파일 <code>manifest.json</code> 30초마다 · 큰 파일 <code>index.html</code> 5분마다.
    기록은 이 브라우저에만 남고 어디로도 보내지 않습니다.
  </p>
</div>

<script>
const SMALL = 'manifest.json', BIG = 'index.html';
const SMALL_EVERY = 30_000, BIG_EVERY = 300_000, KEEP = 500;
const KEY = 'ynhs-probe-v1';

let log = [];
try { log = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}
let running = true, tSmall = 0, tBig = 0;

const hm = t => new Date(t + 9*3600*1000).toISOString().slice(5,19).replace('T',' ');
const ms = v => (v == null ? '' : Math.round(v));
const med = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y);
                   return s[Math.floor(s.length/2)]; };

// 한 번 재기. 실패해도 던지지 않는다 — 기록이 목적이다.
async function probe(path, label){
  const url = new URL(path, location.href).href + '?probe=' + Date.now();
  const t0 = performance.now(), started = Date.now();
  const row = { at: started, target: label };
  try{
    const res = await fetch(url, { cache: 'no-store' });
    row.total = performance.now() - t0;
    row.status = res.status;
    const buf = await res.arrayBuffer();
    row.bytes = buf.byteLength;
    row.ok = res.ok;
    // 어디서 시간을 먹었는지 — 이게 망이냐 크기냐를 가른다
    const e = performance.getEntriesByName(url).pop();
    if(e){
      row.dns  = e.domainLookupEnd - e.domainLookupStart;
      row.conn = e.connectEnd - e.connectStart;
      row.tls  = e.secureConnectionStart ? e.connectEnd - e.secureConnectionStart : null;
      row.ttfb = e.responseStart - e.requestStart;
      row.dl   = e.responseEnd - e.responseStart;
    }
  }catch(err){
    row.total = performance.now() - t0;
    row.ok = false;
    row.err = err.name + (err.message ? ': ' + err.message.slice(0,60) : '');
  }
  if(!navigator.onLine) row.offline = true;
  log.push(row);
  if(log.length > KEEP) log = log.slice(-KEEP);
  try{ localStorage.setItem(KEY, JSON.stringify(log)); }catch(e){}
  render();
}

function render(){
  const small = log.filter(r => r.target === '작은');
  const big   = log.filter(r => r.target === '큰');
  const sFail = small.filter(r => !r.ok), bFail = big.filter(r => !r.ok);
  cTot.textContent   = log.length;
  cSmall.textContent = sFail.length; cSmall.className = sFail.length ? 'bad' : 'ok';
  cBig.textContent   = bFail.length; cBig.className   = bFail.length ? 'bad' : 'ok';
  const msS = med(small.filter(r=>r.ok).map(r=>r.total));
  const msB = med(big.filter(r=>r.ok).map(r=>r.total));
  mSmall.textContent = msS == null ? '–' : Math.round(msS) + 'ms';
  mBig.textContent   = msB == null ? '–' : Math.round(msB) + 'ms';

  // 판단 — 무엇이 원인인지 여기서 갈린다
  let v;
  if(log.length < 4){
    v = '아직 판단할 만큼 재지 않았습니다. 이 탭을 열어 두세요.';
  }else if(sFail.length){
    v = '<b>작은 파일(1KB)도 실패했습니다.</b> 파일 크기·앱·서비스워커와 무관합니다 — '
      + '연결 자체가 끊긴 것입니다. 학교망 또는 GitHub Pages 쪽을 봐야 합니다.';
  }else if(bFail.length){
    v = '<b>큰 파일만 실패했습니다.</b> 작은 파일은 멀쩡하니 연결은 살아 있고, '
      + '885KB를 받는 도중에 끊긴 것입니다. index.html 쪼개기가 실제 해결책이 됩니다.';
  }else if(msB && msB > 8000){
    v = '실패는 없지만 큰 파일이 <b>' + Math.round(msB/1000) + '초</b> 걸립니다. '
      + '느린 것이지 끊긴 것은 아닙니다 — 쪼개기로 줄일 수 있습니다.';
  }else{
    v = '지금까지는 실패가 없습니다. 막혔던 때가 기록에 남으면 그때 다시 봅니다.';
  }
  verdict.innerHTML = v;

  tb.innerHTML = log.slice(-60).reverse().map(r => {
    const cls = r.ok ? 'ok' : 'bad';
    const res = r.ok ? ('OK ' + (r.status||'')) : (r.err || ('HTTP ' + (r.status||'?')));
    const warn = r.ok && r.total > 8000 ? ' warn' : '';
    return `<tr>
      <td>${hm(r.at)}</td><td>${r.target}</td>
      <td class="${cls}">${res}${r.offline ? ' (오프라인)' : ''}</td>
      <td class="n${warn}">${ms(r.total)}</td>
      <td class="n">${ms(r.dns)}</td><td class="n">${ms(r.conn)}</td>
      <td class="n">${ms(r.tls)}</td><td class="n">${ms(r.ttfb)}</td>
      <td class="n">${ms(r.dl)}</td>
      <td class="n">${r.bytes != null ? (r.bytes/1024).toFixed(0)+'KB' : ''}</td>
    </tr>`;
  }).join('');
}

function tick(){
  if(!running) return;
  const t = Date.now();
  if(t - tSmall >= SMALL_EVERY){ tSmall = t; probe(SMALL, '작은'); }
  if(t - tBig   >= BIG_EVERY)  { tBig   = t; probe(BIG,   '큰');  }
}
setInterval(tick, 1000);

toggle.onclick = () => { running = !running; toggle.textContent = running ? '멈춤' : '다시 시작'; };
now.onclick    = () => { probe(SMALL, '작은'); probe(BIG, '큰'); };
clear.onclick  = () => { if(confirm('기록을 모두 지울까요?')){ log = []; localStorage.removeItem(KEY); render(); } };
copy.onclick   = async () => {
  const head = ['시각','대상','결과','전체','DNS','연결','TLS','응답까지','받기','크기'].join('\t');
  const body = log.map(r => [hm(r.at), r.target,
    r.ok ? 'OK '+(r.status||'') : (r.err || 'HTTP '+(r.status||'?')),
    ms(r.total), ms(r.dns), ms(r.conn), ms(r.tls), ms(r.ttfb), ms(r.dl),
    r.bytes != null ? Math.round(r.bytes/1024)+'KB' : ''].join('\t')).join('\n');
  const txt = location.href + '\n' + navigator.userAgent + '\n\n' + head + '\n' + body;
  try{ await navigator.clipboard.writeText(txt); copy.textContent = '복사됨'; }
  catch(e){ prompt('아래를 복사하세요', txt); }
  setTimeout(() => copy.textContent = '기록 복사', 1500);
};

render();
tick();
</script>
