<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>생기부 보조자료 — 영남고 교사 대시보드</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // 앱이 기억해 둔 다크모드를 그대로 따른다. 앱 안 iframe 으로 뜨므로 여기만 밝으면 튄다.
  try{ if(localStorage.getItem('ynhs-dark')==='1') document.documentElement.classList.add('dark'); }catch(e){}
  window.addEventListener('storage', e => {
    if (e.key === 'ynhs-dark') document.documentElement.classList.toggle('dark', e.newValue === '1');
  });
  if (/[?&]in=1/.test(location.search)) document.documentElement.classList.add('in-app');
  // 한 학생만 보기 — 앱의 학생 종합검색 「생기부 보조자료」 탭이 띄운다(?embed=1&k=학년-반-번호)
  if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');
  // 단독 개인별 조회 — 한 학생만 따로 띄운 창(?solo=1&k=학년-반-번호). 창 두 개를 띄워 놓고 작업할 때
  if (/[?&]solo=1/.test(location.search)) document.documentElement.classList.add('solo');
</script>
<style>
  /* 생기부 보조자료 — 부서·교과가 모아 낸 기재 문안 통합 엑셀을 학생별·활동별로 본다.
     엑셀 원본이 교원 전체에게 공유되는 자료라 읽기는 교사 전체(규칙), 올리기는 관리자만(규칙).
     탭을 누구에게 보일지는 index.html 이 정한다.
     모양은 앱의 「학생 종합검색」을 따른다 — 반 목록 | 명단 | 상세 세 칸, 같은 색·글꼴·크기.
     담임이 매일 여는 화면이라 글은 15px·줄 간격 넉넉히, 버튼은 손가락으로 누를 만큼. */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
  @import url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css');
  :root{
    --bg-base:#F1F5F9; --paper:#FFFFFF; --paper-soft:#F8FAFC;
    --ink:#0F172A; --ink-soft:#64748B; --rule:#E2E8F0;
    --mon:#3B82F6; --mon-deep:#2563EB; --warn:#EF4444; --today-tint:#EFF6FF; --sel:#EEF2FF;
    --g1:#2563EB; --g2:#0D9488; --g3:#D97706;
    --t-ja:#2563EB; --t-jin:#059669; --t-gae:#9333EA; --t-nu:#D97706; --t-haeng:#0E7490; --t-dong:#BE185D;
    --t-ja-bg:#EFF6FF; --t-jin-bg:#ECFDF5; --t-gae-bg:#FAF5FF; --t-nu-bg:#FFFBEB; --t-haeng-bg:#ECFEFF; --t-dong-bg:#FDF2F8;
    --shadow:0 4px 20px -8px rgba(0,0,0,.15);
  }
  html.dark{
    --bg-base:#0B1220; --paper:#151F33; --paper-soft:#1D2A44;
    --ink:#E2E8F0; --ink-soft:#8FA3BD; --rule:#26354F;
    --mon:#60A5FA; --mon-deep:#3B82F6; --warn:#F87171; --today-tint:#16263F; --sel:#26354F;
    --g1:#60A5FA; --g2:#2DD4BF; --g3:#FBBF24;
    --t-ja:#60A5FA; --t-jin:#34D399; --t-gae:#C084FC; --t-nu:#FBBF24; --t-haeng:#22D3EE; --t-dong:#F472B6;
    --t-ja-bg:#16263F; --t-jin-bg:#11291F; --t-gae-bg:#241A35; --t-nu-bg:#2B2210; --t-haeng-bg:#0B2830; --t-dong-bg:#2D1422;
    --shadow:none;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg-base);color:var(--ink);
    font-family:'Pretendard','Noto Sans KR',sans-serif;}
  body{display:flex;flex-direction:column;}
  button,select,input{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  :focus-visible{outline:2px solid var(--mon);outline-offset:2px;}

  /* ── 위쪽 줄 — 종합검색의 s360-top ── */
  .top{flex-shrink:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--rule);}
  .top .ttl{font-size:17px;font-weight:900;margin-right:2px;}
  html.in-app .top .ttl{display:none;}
  /* 밑줄 탭 — 고른 탭 아래 파란 줄(인디케이터)이 옆으로 미끄러져 옮겨 간다(줄은 inkify 가 그린다) */
  .seg{position:relative;display:flex;gap:2px;width:fit-content;border-bottom:1px solid var(--rule);}
  .seg button{font-weight:700;font-size:14.5px;border:none;background:transparent;padding:9px 14px 10px;border-radius:6px 6px 0 0;
    cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
  .seg button:hover{color:var(--ink);}   /* 회색 음영 없이 글자색만 */
  .seg button.on{color:var(--mon);}
  .seg .ink{position:absolute;bottom:-1px;left:0;width:0;height:3px;border-radius:3px 3px 0 0;background:var(--mon);
    transition:left .25s ease,width .25s ease;pointer-events:none;}
  @media (prefers-reduced-motion:reduce){ .seg .ink{transition:none;} }
  .search{flex:1;min-width:180px;max-width:420px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;
    font-size:16px;background:var(--paper);color:var(--ink);outline:none;}
  .search:focus{border-color:var(--mon);}
  .admin{display:flex;gap:6px;margin-left:auto;align-items:center;}
  .btn{background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:7px 12px;
    font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--mon);color:var(--mon);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.pri{background:var(--mon);border-color:var(--mon);color:#fff;}
  .btn.pri:hover{background:var(--mon-deep);color:#fff;}
  /* 위쪽 줄 오른쪽 끝 — 사용설명서 · 전체화면(켜져 있으면 파랗게). 폰은 그림 글자만 */
  .top-tools{display:flex;gap:6px;align-items:center;}
  .top-tools .btn{display:inline-flex;align-items:center;gap:5px;}
  #fullBtn[aria-pressed="true"]{background:var(--mon);border-color:var(--mon);color:#fff;}
  html.solo .top-tools,html.solo #manBtn{display:none !important;}
  #manBtn{display:inline-flex;align-items:center;gap:5px;}
  /* 폰·태블릿(손가락)은 보기만 — 올리기·양식·엑셀로 받기·관리 단추를 감춘다(선생님 2026-10-29). 좁은 PC 창은 그대로 */
  @media (max-width:900px) and (pointer:coarse){ .top .admin{display:none !important;} }
  /* 글자 크기 — 조회창은 보기 화면(.sheet)을 통째로 키우고, 작성창은 쓰는 글자만(칸 높이는 글에 맞춰 다시 잰다) */
  .sheet{zoom:var(--fs-view,1);}
  /* 「가− 가+」 — 학생 이름 옆(조회창) · 행특 가리기 옆(작성창). 100% 가 아니면 가운데 숫자가 보이고, 누르면 처음 크기 */
  .fs-ctl{display:inline-flex;align-items:center;gap:3px;flex:none;}
  .fs-ctl button{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 8px;
    font:inherit;font-size:13px;font-weight:800;line-height:1.4;cursor:pointer;white-space:nowrap;}
  .fs-ctl button:hover:not(:disabled){border-color:var(--mon);color:var(--mon);}
  .fs-ctl button:disabled{opacity:.35;cursor:default;}
  .fs-ctl .fs-n{border:none;background:none;padding:3px 2px;color:var(--mon);font-variant-numeric:tabular-nums;}
  .fs-ctl .fs-n[hidden]{display:none;}
  .btn.line{border-color:var(--mon);color:var(--mon);}
  .btn.line:hover{background:var(--mon);color:#fff;}
  /* 카드의 학생 글 접기(details{margin-top:10px})가 여기에도 걸려 단추가 아래로 처졌다 — 따로 0 */
  .form-dl{position:relative;display:flex;margin:0;}
  .form-dl > summary{list-style:none;cursor:pointer;display:block;}
  .form-dl > summary::-webkit-details-marker{display:none;}
  .form-dl-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:260px;background:var(--paper);border:1px solid var(--rule);
    border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;}
  .form-dl-menu a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:700;line-height:1.45;}
  .form-dl-menu a:hover{background:var(--paper-soft);}
  .form-dl-menu .d{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .form-dl-menu button{display:block;width:100%;text-align:left;padding:9px 10px;border:none;border-radius:8px;background:transparent;
    color:var(--ink);font:inherit;font-size:14.5px;font-weight:700;line-height:1.45;cursor:pointer;}
  .form-dl-menu button:hover{background:var(--paper-soft);}
  .form-dl-menu label{display:flex;align-items:center;gap:6px;padding:8px 10px;margin-top:2px;border-top:1px solid var(--rule);
    font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;}

  #main{flex:1;min-height:0;display:flex;flex-direction:column;}
  #upPanel{display:none;margin:12px 16px 0;}
  #admPanel{display:none;margin:12px 16px 0;}
  .adm-wrap{overflow-x:auto;margin-top:8px;border:1px solid var(--rule);border-radius:9px;}
  .adm-tb{border-collapse:collapse;width:100%;font-size:13.5px;}
  .adm-tb th,.adm-tb td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle;white-space:nowrap;}
  .adm-tb th{background:var(--paper-soft);font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .adm-tb td.n{text-align:right;}
  .adm-tb .btn{padding:3px 9px;font-size:12.5px;}
  .adm-tb .fixed{color:var(--mon);}
  .adm-form{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:8px 2px;white-space:normal;}
  .adm-form label{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-soft);}
  .adm-form input,.adm-form textarea{font:inherit;font-size:14px;color:var(--ink);padding:5px 8px;border:1px solid var(--rule);border-radius:7px;}
  .adm-form em{font-style:normal;font-size:12px;}
  .adm-form .adm-tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:13px;}
  .adm-form .adm-tags label{flex-direction:row;align-items:center;gap:4px;color:var(--ink);font-size:13px;}
  .adm-form .row{grid-column:1/-1;}
  @media (max-width:640px){ .adm-form{grid-template-columns:1fr;} }
  #body{flex:1;min-height:0;overflow:auto;}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:15.5px;font-weight:700;line-height:1.7;}
  .err{color:var(--warn);}

  /* ── 세 칸 — 종합검색의 s360-3pane ── */
  .pane3{display:flex;height:100%;min-height:0;}
  .pane3 > *{overflow-y:auto;min-height:0;}
  .p-classes{width:134px;flex-shrink:0;border-right:1px solid var(--rule);background:var(--paper-soft);padding:8px 6px 20px;}
  .p-roster{width:250px;flex-shrink:0;border-right:1px solid var(--rule);background:var(--paper);}
  .p-detail{flex:1;min-width:0;background:var(--bg-base);padding:16px 16px 40px;container:det / inline-size;}
  .cl-grade{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:16px;font-weight:900;padding:11px 8px 7px;
    border:none;background:transparent;border-radius:8px;cursor:pointer;text-align:left;}
  .cl-grade:hover{background:var(--paper);}
  .cl-caret{font-size:15px;opacity:.75;}
  .cl-grade[data-g="1"]{color:var(--g1);} .cl-grade[data-g="2"]{color:var(--g2);} .cl-grade[data-g="3"]{color:var(--g3);}
  .cl-item{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;padding:9px 10px;margin-bottom:3px;
    border:none;border-radius:9px;background:transparent;color:var(--ink);font-size:15px;font-weight:800;cursor:pointer;text-align:left;}
  .cl-item:hover{background:var(--paper);}
  .cl-item.on{background:var(--mon);color:#fff;}
  .cl-cnt{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .cl-item.on .cl-cnt{color:#fff;opacity:.85;}
  .roster-head{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;gap:8px;padding:12px 14px;
    background:var(--paper);border-bottom:1px solid var(--rule);font-size:15px;font-weight:900;}
  .roster-head small{font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .stu{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;border-bottom:1px solid var(--rule);
    background:transparent;color:var(--ink);cursor:pointer;text-align:left;}
  .stu:hover{background:var(--paper-soft);}
  .stu.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--mon);}
  .stu .num{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--ink-soft);min-width:40px;}
  .stu .nm{font-size:16px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stu .k{font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--paper-soft);border-radius:10px;padding:1px 8px;}

  /* ── 상세 카드 — 종합검색의 s360-card ── */
  .sheet{max-width:980px;margin:0 auto;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);
    border:1px solid var(--rule);padding:22px 26px 26px;}
  .s-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule);}
  /* 사진 — 종합검색처럼 3:4. 상세에만(명단에 넣으면 줄이 높아져 반 전체가 한눈에 안 보인다) */
  .s-photo{width:120px;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--rule);background:var(--paper-soft);cursor:zoom-in;flex-shrink:0;}
  /* 한 학생만 보기(종합검색 안) — 위쪽 줄·이동 줄·이름·사진은 종합검색 쪽에 이미 있다 */
  html.embed,html.embed body{height:auto;background:var(--paper);}
  html.embed .top,html.embed .m-nav,html.embed .s-name,html.embed .s-id,html.embed .s-photo{display:none !important;}
  html.embed #body{overflow:visible;}
  html.embed .p-detail,html.embed .embed-out{padding:0;background:transparent;}
  html.embed .sheet{max-width:none;border:none;box-shadow:none;padding:2px 0 8px;}
  html.embed .s-head{padding-bottom:10px;}
  .zoom{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.6);padding:16px;cursor:zoom-out;}
  .zoom.open{display:flex;}
  .zoom-box{background:var(--paper);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .zoom-box img{width:min(360px,76vw);aspect-ratio:3/4;object-fit:cover;border-radius:10px;}
  #zoomCap{font-size:15px;font-weight:800;}
  .s-name{font-size:26px;font-weight:900;letter-spacing:-.01em;}
  .s-id{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;color:var(--ink-soft);margin-top:9px;}
  .s-sum{display:flex;gap:6px;flex-wrap:wrap;width:100%;}
  .s-head .btn{margin-left:auto;}
  .s-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .s-btns .btn{margin-left:0;}
  .s-head{flex-wrap:nowrap;}
  .s-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .s-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  /* 참여한 활동 — 활동명 + 입력 영역(어디에 적을 수 있는지). 누르면 그 카드로.
     넓은 화면(FHD)에서는 카드 오른쪽 빈자리에 붙어서 내려도 따라온다 — 목차처럼 */
  .s-acts-h{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0 0 4px 8px;}
  .s-acts ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 10px;}
  .s-acts button{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;border:none;background:transparent;padding:5px 8px;
    border-radius:8px;font:inherit;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.45;}
  .s-acts button:hover{background:var(--paper-soft);}
  .s-acts .an{flex:1;min-width:0;}
  .s-acts .an .d{font-weight:600;color:var(--ink-soft);}
  .s-acts .tag{font-size:11.5px;padding:0 7px;flex-shrink:0;}
  .s-acts .fresh{margin-left:4px;}
  .card{scroll-margin-top:12px;}
  /* 좁은 칸(태블릿·노트북에서 작성 칸을 띄웠을 때 등) — 사진·이름·활동 목록이 위로 지나가면 이름·반 번호·참여한 활동을 위쪽에.
     활동은 잘리지 않게 다 보인다 — 많으면 줄을 바꾼다(선생님 요청 2026-10-28, 처음엔 한 줄로 옆으로 밀었다).
     폰·넓은 화면(오른쪽 목차)에는 없다. 높이 0 의 틀에 얹어 글이 밀리지 않게 */
  .s-mini{display:none;}
  .s-mini-in{position:absolute;left:-16px;right:-16px;top:0;display:flex;align-items:baseline;gap:12px;padding:7px 16px;
    background:var(--paper);border-bottom:1px solid var(--rule);box-shadow:0 6px 12px -10px rgba(15,23,42,.35);
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .15s,transform .15s;}
  .s-mini.on .s-mini-in{opacity:1;transform:none;pointer-events:auto;}
  .s-mini-who{display:flex;align-items:baseline;gap:6px;flex-shrink:0;white-space:nowrap;}
  .s-mini-who b{font-size:16px;font-weight:900;}
  .s-mini-who span{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .s-mini-acts{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;}
  .s-mini-acts button{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 10px;border:1px solid var(--rule);border-radius:14px;
    background:var(--paper);color:var(--ink);font:inherit;font-size:13px;font-weight:700;line-height:1.4;cursor:pointer;text-align:left;}
  .s-mini-acts button:hover{border-color:var(--mon);color:var(--mon);}
  .s-mini-acts .d{font-weight:600;color:var(--ink-soft);}
  .s-mini-acts .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--ink-soft);}
  .s-mini-acts .dot.ja{background:var(--t-ja);} .s-mini-acts .dot.jin{background:var(--t-jin);} .s-mini-acts .dot.gae{background:var(--t-gae);}
  .s-mini-acts .dot.nu{background:var(--t-nu);} .s-mini-acts .dot.haeng{background:var(--t-haeng);} .s-mini-acts .dot.dong{background:var(--t-dong);}
  @media (min-width:901px){
    @container det (max-width:1309px){
      html:not(.embed) .s-mini{display:block;position:sticky;top:calc(var(--navH, 0px) - 16px);z-index:4;height:0;}
      html:not(.embed) .card{scroll-margin-top:calc(var(--navH, 0px) + var(--miniH, 44px) + 14px);}   /* 위쪽 줄이 몇 줄이든 그 아래로 */
    }
  }
  /* 학번·이름이 편성표와 어긋난 자료 — 누락 없게 보이되 눈에 띄게 */
  .s-warn{font-size:14px;line-height:1.6;color:#9A3412;background:#FFF7ED;border:1px solid #FDBA74;border-radius:10px;padding:8px 12px;}
  .s-warn ul{margin:4px 0 0;padding-left:18px;}
  .mis-note{margin-top:8px;font-size:14px;font-weight:700;line-height:1.6;color:#9A3412;background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:6px 10px;}
  html.dark .s-warn,html.dark .mis-note{color:#FDBA74;background:#2B1A0E;border-color:#9A3412;}
  .stu .w{font-size:13px;color:#C2410C;}
  .mis-note .nw,.s-warn .nw,.row-mis .nw{white-space:nowrap;}
  table.neis tr.mis-row td{background:#FFF7ED;}
  html.dark table.neis tr.mis-row td{background:#2B1A0E;}
  .row-mis{margin-top:3px;font-size:13px;font-weight:800;color:#9A3412;line-height:1.5;}
  html.dark .row-mis{color:#FDBA74;}
  .card.hit{box-shadow:0 0 0 3px var(--sel);transition:box-shadow .2s;}
  @container det (min-width:1310px){
    html:not(.embed) .sheet{position:relative;margin-left:max(0px,calc((100% - 1300px) / 2));}
    html:not(.embed) .s-acts{position:absolute;top:0;bottom:0;left:calc(100% + 16px);width:304px;}
    html:not(.embed) .s-acts-in{position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto;background:var(--paper);
      border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:12px 8px 10px;}
    html:not(.embed) .s-acts ul{grid-template-columns:minmax(0,1fr);}
  }
  .tag{display:inline-flex;align-items:center;font-size:13px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5;}
  .tag.ja{color:var(--t-ja);background:var(--t-ja-bg);} .tag.jin{color:var(--t-jin);background:var(--t-jin-bg);}
  .tag.gae{color:var(--t-gae);background:var(--t-gae-bg);} .tag.nu{color:var(--t-nu);background:var(--t-nu-bg);}
  .tag.haeng{color:var(--t-haeng);background:var(--t-haeng-bg);} .tag.dong{color:var(--t-dong);background:var(--t-dong-bg);}
  .grp{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-size:14px;font-weight:800;color:var(--ink-soft);}
  .grp::after{content:'';flex:1;height:1px;background:var(--rule);}
  .card{border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--paper);}
  .card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  /* 추가·수정 꼬리표 — '상태' 라 '분류'(영역 칩: 연한 바탕 + 색 글씨, 파랑·초록·보라·주황)와 한눈에 달라야 한다.
     꽉 찬 색 + 흰 글씨, 영역 칩에 없는 색(빨강 · 남색), 덜 둥근 모서리. */
  .fresh{display:inline-block;font-size:11px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:6px;
    vertical-align:2px;line-height:1.45;color:#fff;letter-spacing:.02em;}
  .fresh.new{background:#E11D48;}
  .fresh.mod{background:#4338CA;}
  .fresh-tg{margin-top:6px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:3px 10px;font:inherit;font-size:13px;font-weight:700;color:#E11D48;cursor:pointer;}
  .fresh-tg.on{background:#E11D48;border-color:#E11D48;color:#fff;}
  .card-h .t{font-size:17px;font-weight:800;}
  .card-h .d{font-size:14px;font-weight:600;color:var(--ink-soft);}
  .where{font-size:13.5px;color:var(--ink-soft);margin-top:5px;line-height:1.6;}
  /* 유의 사항 — 상자 없이 굵은 주황 글씨로만(칸을 덜 먹게). 길면 몇 줄에서 자르고 「더보기」 */
  .note{margin-top:8px;font-size:14.5px;font-weight:800;color:#C2410C;line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
  .note b{font-weight:900;margin-right:6px;}
  .note.clamp:not(.open) .nt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow:hidden;}
  .note-more{background:none;border:0;color:var(--mon);font-weight:800;font-size:13px;cursor:pointer;padding:2px 0;font-family:inherit;}
  html.dark .note{color:#FDBA74;}
  .body{margin-top:12px;font-size:16px;line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
    background:var(--paper-soft);border-radius:10px;padding:13px 15px;cursor:copy;border:1px solid transparent;}
  .body:hover{border-color:var(--mon);background:var(--today-tint);}
  .tools{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13.5px;color:var(--ink-soft);font-weight:600;}
  .tools .btn{padding:5px 12px;font-size:13.5px;}
  .grp .gb{font-weight:700;}
  .grp .gb.over{color:var(--warn);font-weight:800;}
  details{margin-top:10px;}
  details summary{cursor:pointer;color:var(--ink-soft);font-weight:700;font-size:14px;padding:2px 0;}
  details summary:hover{color:var(--ink);}
  details .txt{white-space:pre-wrap;font-size:15px;line-height:1.8;padding:8px 2px 2px;word-break:keep-all;overflow-wrap:anywhere;}
  .ex{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:15px;margin-top:12px;}
  .ex dt{color:var(--ink-soft);font-weight:700;}
  .ex dd{white-space:pre-wrap;overflow-wrap:anywhere;}
  /* 회차 표 — 프로젝트 봉사처럼 한 칸에 여러 회차가 줄바꿈으로 들어 있는 것을 풀어 보인다 */
  .sess-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--rule);border-radius:10px;}
  .sess{border-collapse:collapse;width:100%;font-size:15px;}
  .sess th{background:var(--paper-soft);color:var(--ink-soft);font-weight:800;font-size:13.5px;padding:8px 10px;
    border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap;}
  .sess td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;}
  .sess tr:last-child td{border-bottom:none;}
  .sess td.n{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;color:var(--ink-soft);}
  .who{display:flex;align-items:baseline;gap:8px;}
  .who .num{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--ink-soft);}
  .who .nm{font-size:17px;font-weight:800;}
  .who{flex-wrap:wrap;}
  .mis{font-size:13.5px;font-weight:800;color:#C2410C;background:#FFF7ED;border:1px solid #FDBA74;border-radius:999px;padding:2px 10px;}
  html.dark .mis{color:#FDBA74;background:#2B1A0E;border-color:#9A3412;}
  #chkTab{color:#C2410C;}
  .moved-tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:var(--ink-soft);background:var(--paper-soft);
    border:1px solid var(--rule);border-radius:999px;padding:0 8px;vertical-align:middle;}
  .stu.gone .nm{color:var(--ink-soft);}
  .moved-list{line-height:1.9;}
  html.dark #chkTab{color:#FDBA74;}
  table.chk td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* 봉사활동 누가기록 — 나이스와 같은 칸 차례의 표(모양은 앱의 다른 표와 같게) */
  .neis-wrap{overflow-x:auto;margin:12px 0 10px;border:1px solid var(--rule);border-radius:10px;}
  /* 칸 너비는 비율로 고정 — PC 상세 폭에 한 번에 들어오게. 더 좁으면(폰) 가로로 밀어 본다 */
  table.neis{border-collapse:collapse;width:100%;min-width:720px;table-layout:fixed;font-size:15px;}
  table.neis th{background:var(--paper-soft);color:var(--ink-soft);font-weight:800;font-size:13.5px;padding:9px 8px;
    border-bottom:1px solid var(--rule);text-align:left;line-height:1.35;word-break:keep-all;}
  table.neis td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.6;
    word-break:keep-all;overflow-wrap:anywhere;}
  table.neis tr:last-child td{border-bottom:none;}
  table.neis td[data-cp]{cursor:copy;}
  table.neis td[data-cp]:hover{background:var(--today-tint);}
  table.neis col.c-start,table.neis col.c-end{width:12%;}
  table.neis col.c-area{width:12.5%;}
  table.neis col.c-content{width:27.5%;}
  table.neis col.c-type{width:8%;}
  table.neis col.c-place{width:15%;}
  table.neis col.c-hours{width:6%;}
  table.neis col.c-total{width:7%;}
  table.neis td.c-start,table.neis td.c-end{white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.neis th.r,table.neis td.c-hours,table.neis td.c-total{text-align:right;font-variant-numeric:tabular-nums;}
  table.neis td.c-total{color:var(--ink-soft);font-weight:700;}
  /* 활동별 봉사 표 — 앞에 학번·이름 */
  table.neis.with-who{min-width:860px;}
  table.neis.with-who col.c-hak{width:8%;} table.neis.with-who col.c-nm{width:9.5%;}
  table.neis.with-who col.c-start,table.neis.with-who col.c-end{width:9.5%;}
  table.neis.with-who col.c-area{width:10%;} table.neis.with-who col.c-content{width:28.5%;}
  table.neis.with-who col.c-type{width:7%;} table.neis.with-who col.c-place{width:12.5%;}
  table.neis.with-who col.c-hours{width:5.5%;}
  table.neis td.c-hak,table.neis td.c-nm{white-space:nowrap;}   /* 학번·이름은 꺾이지 않게 */
  table.neis td.c-hak{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:700;}
  table.neis td.c-nm{font-weight:800;}
  table.neis td.c-hak,table.neis td.c-nm{border-right:1px solid var(--rule);background:var(--paper);}
  table.neis.with-who tr.who-first:not(:first-child) td{border-top:2px solid var(--rule);}
  table.neis td.c-nm .mis{color:var(--warn);}
  .vol-split{margin-top:12px;}
  .vol-split .card{background:var(--paper-soft);}

  /* ── 활동별 ── */
  .p-acts{width:330px;flex-shrink:0;border-right:1px solid var(--rule);background:var(--paper);}
  .acts-q{position:sticky;top:0;z-index:1;background:var(--paper);padding:10px 12px;border-bottom:1px solid var(--rule);}
  .acts-q input{width:100%;padding:8px 11px;border:1.5px solid var(--rule);border-radius:9px;font-size:15px;background:var(--paper);color:var(--ink);outline:none;}
  .acts-q input:focus{border-color:var(--mon);}
  .acts-grp{font-size:13.5px;font-weight:900;color:var(--ink-soft);padding:14px 14px 6px;}
  .act{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;
    border-bottom:1px solid var(--rule);padding:11px 14px;cursor:pointer;color:var(--ink);}
  .act:hover{background:var(--paper-soft);}
  .act.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--mon);}
  .act .t{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.4;}
  .act .t small{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:2px;}
  .act .n{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 10px;}
  .counts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;}
  .chip{font-size:14px;font-weight:700;background:var(--paper);border:1px solid var(--rule);border-radius:999px;
    padding:5px 12px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;}
  .chip b{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);margin-left:4px;font-weight:700;}
  .chip:hover{border-color:var(--mon);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .chip.on b{color:var(--paper);opacity:.8;}

  /* ── 창체 일정 ── */
  .sch-wrap{max-width:1180px;margin:0 auto;padding:16px;}
  .tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:12px;margin-top:14px;}
  table.sch{border-collapse:collapse;width:100%;font-size:15px;}
  table.sch th{background:var(--paper-soft);text-align:center;color:var(--ink-soft);font-size:13.5px;font-weight:800;
    border-bottom:1px solid var(--rule);padding:9px 10px;white-space:nowrap;position:sticky;top:0;}
  table.sch td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:center;font-variant-numeric:tabular-nums;}
  table.sch td.long,table.sch th.long{text-align:left;}
  table.sch td.long{min-width:120px;}
  table.sch tr.sum td{background:var(--paper-soft);font-weight:800;}
  .sch-sum{font-size:14px;font-weight:800;color:var(--ink-soft);}

  /* ── 올리기 (관리자) ── */
  .up{background:var(--paper);border:1px solid var(--mon);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.7;}
  .up h3{font-size:16px;margin-bottom:6px;}
  .up ul{padding-left:18px;}
  .up .acts-sum{max-height:220px;overflow:auto;margin:6px 0;border-top:1px solid var(--rule);padding-top:6px;}
  .up .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .up .sec{margin-top:10px;}
  .up .sec.miss{border:1px solid var(--warn);border-radius:9px;padding:8px 10px;}
  .up .up-cols{font-size:12.5px;color:var(--ink-soft);margin:1px 0 4px 1.2em;}
  .up .pick{display:block;margin:2px 0 8px 1.2em;font-size:13px;}
  .up .pick.warn{color:var(--warn);font-weight:700;}
  .up .pick select{font-size:13px;padding:2px 4px;margin-left:6px;border:1px solid var(--rule);border-radius:6px;font-weight:400;}
  .up .up-mode{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;}
  .up .up-mode label{font-size:13.5px;}
  .up .miss-row{display:flex;align-items:baseline;gap:8px;padding:2px 0;}
  .up .miss-row select{font-size:13.5px;padding:2px 4px;border:1px solid var(--rule);border-radius:6px;
    background:var(--paper);color:var(--ink);flex-shrink:0;}
  .up .d{color:var(--ink-soft);}

  .gate{position:fixed;inset:0;background:var(--bg-base);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .gate .box{background:var(--paper);border:1px solid var(--rule);border-radius:16px;max-width:380px;width:100%;
    text-align:center;padding:30px 26px;box-shadow:var(--shadow);}
  .gate h1{font-size:21px;margin-bottom:9px;}
  .gate p{font-size:14.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:16px;}
  .gate .err{font-size:13.5px;margin-top:12px;white-space:pre-line;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:9px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;}
  .toast.on{opacity:.95;}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }

  /* ── 생기부 작성(담임·관리자) — 학생별 화면에서 「✏️ 작성」 으로 오른쪽에 띄우는 칸.
     보조자료 카드의 「→ 자율」 로 붙이고 줄인다. 닫으면 칸째로 비운다(행특이 화면에 남지 않게) ── */
  .p-draft{display:none;padding:0 16px;border-left:1px solid var(--rule);background:var(--paper);}   /* 옆 칸(보조자료)과 같은 안쪽 여백 — 그래야 정말 반반 */
  /* 반반 — 띄우면 보조자료 칸과 남은 폭을 똑같이 나눈다(선생님: 반반 느낌). 「참여한 활동」 은 좁아진 보조자료 칸에서 사진 옆 이름 아래로 */
  .pane3.dr-open .p-detail{flex:var(--drL,1) 1 0;min-width:0;}
  .pane3.dr-open .p-draft{flex:var(--drR,1) 1 0;min-width:0;}
  /* 사이 막대 — 끌어서 작성 칸 넓이를(30%~70%), 두 번 누르면 반반 */
  .dr-split{display:none;flex:none;width:9px;margin:0 -5px 0 -4px;position:relative;z-index:3;overflow:visible;cursor:col-resize;touch-action:none;}
  .dr-split::after{content:'';position:absolute;top:0;bottom:0;left:4px;width:1px;background:transparent;transition:background .15s,width .15s,left .15s;}
  .dr-split:hover::after,.dr-split:focus-visible::after,.dr-split.drag::after{left:3px;width:3px;background:var(--mon);}
  .dr-split:focus-visible{outline:none;}
  /* 손잡이 — 끌어서 넓이를 바꿀 수 있다는 표시(선생님 요청). 높이 가운데에 작게 ‹ › */
  .dr-grip{position:absolute;z-index:1;top:50%;left:calc(50% + 1px);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;   /* 막대 위 파란 줄(::after)보다 위에 */
    width:20px;height:40px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink-soft);
    box-shadow:0 1px 4px rgba(15,23,42,.12);transition:border-color .15s,color .15s;}
  .dr-grip svg{width:14px;height:11px;}
  .dr-split:hover .dr-grip,.dr-split:focus-visible .dr-grip,.dr-split.drag .dr-grip{border-color:var(--mon);color:var(--mon);}
  .pane3.dr-open .dr-split{display:block;}
  .pane3.dr-open .p-draft{display:block;}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:8px;}
  .drp{padding:14px 2px 40px;}
  .drp .d{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .drp-top{display:flex;align-items:flex-start;gap:10px;}
  .drp-who{display:flex;flex-direction:column;gap:3px;margin-right:auto;min-width:0;}
  .drp-who b{font-size:16px;font-weight:900;}
  .drp-who span{font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .drp-x{width:32px;height:32px;flex-shrink:0;border:none;border-radius:8px;background:transparent;color:var(--ink-soft);font-size:17px;cursor:pointer;}
  .drp-x:hover{background:var(--paper-soft);color:var(--ink);}
  .drp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
  .drp-nav{display:flex;align-items:center;gap:4px;}
  .drp-pos{min-width:46px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .drp-sw{display:inline-flex;align-items:center;gap:5px;margin-left:auto;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .drp-saved{margin-top:8px;min-height:17px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .drp-saved.err{color:var(--warn);cursor:pointer;text-decoration:underline;}
  .drp-area{margin-top:16px;}
  .drp-ah{display:flex;align-items:center;gap:8px;}
  .drp-b{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .drp-b.over{color:var(--warn);}
  /* 한도까지 얼마나 찼는지 — 영역 색, 넘으면 빨강 */
  .drp-meter{height:3px;margin:7px 0 8px;border-radius:2px;background:var(--rule);overflow:hidden;}
  .drp-meter i{display:block;height:100%;width:0;background:var(--mon);transition:width .2s;}
  .drp-area[data-k="ja"] .drp-meter i{background:var(--t-ja);} .drp-area[data-k="jin"] .drp-meter i{background:var(--t-jin);}
  .drp-area[data-k="gae"] .drp-meter i{background:var(--t-gae);} .drp-area[data-k="haeng"] .drp-meter i{background:var(--t-haeng);}
  .drp-meter.over i{background:var(--warn) !important;}
  @media (prefers-reduced-motion:reduce){ .drp-meter i{transition:none;} }
  .drp-t{display:block;width:100%;min-height:88px;resize:none;overflow:hidden;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;
    background:var(--paper-soft);color:var(--ink);font:inherit;font-size:calc(14.5px * var(--fs-draft,1));line-height:1.7;}
  .drp-t[hidden]{display:none;}               /* display:block 이 hidden 을 이기지 않게 */
  .drp-t:focus{outline:none;background:var(--paper);border-color:var(--mon);box-shadow:0 0 0 3px var(--sel);}
  .drp-t.over{border-color:var(--warn);}
  .drp-t.hit{box-shadow:0 0 0 3px var(--sel);}
  .drp-links{display:flex;gap:14px;margin-top:6px;}
  .drp-link{padding:0;border:none;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .drp-link:hover,.drp-link[aria-expanded="true"]{color:var(--mon);}
  /* 기재요령 점검 — 바이트 옆 「⚠ 2」(가장 높은 단계 색: 🔴 빨강 · 🟠 주황 · 🔵 파랑), 누르면 칸 아래 목록 */
  .drp-ck{padding:1px 9px;border:1px solid transparent;border-radius:999px;font:inherit;font-size:12.5px;font-weight:800;line-height:1.5;cursor:pointer;white-space:nowrap;}
  .drp-ck[hidden]{display:none;}
  .drp-ck.r{background:#FEE4E2;color:#B42318;border-color:#FECDCA;} .drp-ck.o{background:#FEF0C7;color:#B54708;border-color:#FEDF89;}
  .drp-ck.b{background:#EFF8FF;color:#175CD3;border-color:#B2DDFF;}
  html.dark .drp-ck.r{background:#3B1513;color:#FDA29B;border-color:#7A271A;} html.dark .drp-ck.o{background:#3A2A0D;color:#FEC84B;border-color:#7A4D0B;}
  html.dark .drp-ck.b{background:#102A43;color:#84CAFF;border-color:#1E4F7A;}
  .drp-ckp{margin:8px 0 4px;padding:8px 12px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-soft);font-size:13px;}
  .drp-ckp[hidden]{display:none;}
  .ck-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 6px;font-weight:800;color:var(--ink-soft);}
  .ck-head .d{font-weight:600;}
  .ck-head .btn{margin-left:auto;}
  .ck-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--rule);}
  .ck-lv{flex-shrink:0;width:18px;text-align:center;line-height:1.55;}
  .ck-body{flex:1;min-width:0;line-height:1.55;color:var(--ink);}
  .ck-t{font-weight:800;word-break:break-all;}
  .ck-cat{margin-left:6px;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .ck-alt{font-size:12.5px;color:var(--ink-soft);} .ck-alt b{color:var(--ink);}
  .ck-acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .ck-acts button{padding:3px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);font:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .ck-acts button:hover{color:var(--mon);border-color:var(--mon);}
  @media (max-width:520px){ .ck-row{flex-wrap:wrap;} .ck-acts{flex-basis:100%;justify-content:flex-start;padding-left:26px;} }   /* 폰 — 단추는 글 아래로(글이 좁게 접히지 않게) */
  /* 우리 반 생기부 한눈에 — 점검 칸 */
  .cls-all td.ck{text-align:right;white-space:nowrap;font-size:12.5px;font-weight:800;}
  .ck-n{margin-left:4px;} .ck-n.r{color:#B42318;} .ck-n.o{color:#B54708;} .ck-n.b{color:#175CD3;}
  html.dark .ck-n.r{color:#FDA29B;} html.dark .ck-n.o{color:#FEC84B;} html.dark .ck-n.b{color:#84CAFF;}
  /* 맞춤법 — 부산대 검사기에서 고친 글을 붙여 넣으면 바뀐 곳(∨ 띄움 · ⌒ 붙임)과 바이트 변화를 보여 주고 반영 */
  .drp-spell{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-soft);}
  .drp-spell[hidden]{display:none;}
  .drp-spell-in{width:100%;min-height:60px;padding:8px 10px;border:1px dashed var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);
    font:inherit;font-size:14px;line-height:1.6;resize:vertical;}
  .drp-spell-sum{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .drp-spell-sum .err{color:var(--warn);}
  .drp-spell-diff{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:14.5px;line-height:1.8;
    white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
  .drp-spell-diff:empty{display:none;}
  .drp-spell-diff del{color:#B42318;background:#FDECEA;text-decoration:line-through;}
  .drp-spell-diff ins{color:#067647;background:#E3F6EA;text-decoration:none;font-weight:800;}
  .drp-spell-diff .ws{text-decoration:none;font-weight:900;}
  html.dark .drp-spell-diff del{color:#FCA5A5;background:#3B1414;} html.dark .drp-spell-diff ins{color:#86EFAC;background:#0F2E1B;}
  .drp-spell-btns{display:flex;gap:6px;}
  /* 다른 창과 같은 칸을 고쳤을 때 — 칸은 잠그고 위에 「다른 창에서 이 칸이 수정되었습니다.」, 다른 곳과 두 단추 */
  .drp-conf{display:flex;flex-direction:column;gap:7px;margin:0 0 8px;padding:10px 12px;border:1px solid #F79009;border-radius:10px;background:#FFFAEB;font-size:13px;line-height:1.55;}
  .drp-conf-h{font-weight:800;color:#93370D;}
  .drp-conf-diff{max-height:180px;overflow:auto;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:14px;line-height:1.75;
    white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
  .drp-conf del{color:#B42318;background:#FDECEA;} .drp-conf ins{color:#067647;background:#E3F6EA;text-decoration:none;font-weight:800;}
  .drp-conf-btns{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .drp-conf-btns .d{margin-left:auto;font-size:12px;}
  .drp-t.conf{border-color:#F79009;background:var(--paper-soft);opacity:.85;cursor:not-allowed;}
  html.dark .drp-conf{background:#2B1A0E;border-color:#9A3412;} html.dark .drp-conf-h{color:#FDBA74;}
  html.dark .drp-conf del{color:#FCA5A5;background:#3B1414;} html.dark .drp-conf ins{color:#86EFAC;background:#0F2E1B;}
  .drp-spell-steps{font-size:13.5px;line-height:1.6;color:var(--ink);}
  .drp-spell-in[hidden]{display:none;}
  .drp-hold{margin-top:6px;min-height:60px;border-style:dashed;background:transparent;font-size:calc(13.5px * var(--fs-draft,1));}
  .drp-hist{margin-top:6px;padding:4px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-soft);}
  .drp-hist button{display:block;width:100%;padding:7px 9px;border:none;border-radius:7px;background:transparent;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer;}
  .drp-hist button:hover{background:var(--paper);}
  .drp-hist .when{font-weight:800;margin-right:6px;}
  .drp-hist .pv{display:block;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drp-off{margin-top:16px;padding:9px 12px;border-radius:10px;background:var(--paper-soft);font-size:13px;font-weight:700;color:var(--ink-soft);}
  .drp-memo{margin-top:20px;padding-top:14px;border-top:1px dashed var(--rule);}
  .drp-memo .drp-ah{margin-bottom:8px;}
  .drp-memo .drp-ah b{font-size:14px;font-weight:800;}
  .drp-mt{min-height:64px;font-size:14px;}
  .drp-print .form-dl-menu{min-width:240px;}
  /* 보조자료 카드의 「→ 자율」 — 작성 칸을 띄웠을 때만 */
  .to-btns{display:none;}
  .pane3.dr-open .to-btns{display:inline-flex;gap:6px;flex-wrap:wrap;}
  .to-btns .btn{padding:4px 10px;font-size:13px;}
  /* 그 문안이 작성 칸에 들어갔는지 — ✓ 거의 다(초록) · ◐ 일부(주황) */
  .used-mark{align-self:center;font-size:12.5px;font-weight:800;white-space:nowrap;}
  .used-mark[hidden]{display:none;}
  .used-mark.full{color:#067647;} .used-mark.part{color:#B54708;} .used-mark.dup{color:#B42318;}
  html.dark .used-mark.full{color:#86EFAC;} html.dark .used-mark.part{color:#FDBA74;} html.dark .used-mark.dup{color:#FDA29B;}
  .cl-me{font-size:11px;margin-left:3px;}
  /* 반·명단 숨기기(「« 숨기기」) · 단독 개인별 조회 — 목록 대신 위쪽 줄(☰ 반 · ◀ 이전 · 다음 ▶) */
  .list-off-btn{margin-left:auto;padding:2px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);color:var(--ink-soft);
    font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .list-off-btn:hover{color:var(--mon);border-color:var(--mon);}
  .pane3.list-off .p-classes,.pane3.list-off .p-roster,html.solo .p-classes,html.solo .p-roster{display:none;}
  .pane3.list-off .m-nav,html.solo .m-nav{display:flex;gap:6px;align-items:center;position:sticky;top:-16px;z-index:5;margin:-16px -16px 14px;
    padding:9px 16px;background:var(--paper);border-bottom:1px solid var(--rule);}
  .pane3.list-off .m-nav .btn,html.solo .m-nav .btn{padding:6px 12px;font-size:13.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;}
  html.solo #mBack{display:none;}
  html.solo .top #views,html.solo .top .admin{display:none !important;}
  .ic-ph{display:none;}
  @media (min-width:901px) and (max-width:1179px){
    .pane3.dr-open .m-nav{display:flex;gap:6px;align-items:center;position:sticky;top:-16px;z-index:5;margin:-16px -16px 14px;
      padding:9px 16px;background:var(--paper);border-bottom:1px solid var(--rule);}
    .pane3.dr-open .m-nav .btn{padding:6px 12px;font-size:13.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
  }
  /* 작성 칸을 띄우면 — 노트북은 반 칸, 더 좁으면 명단 칸까지 접는다(학생은 작성 칸의 ◀ ▶ 로) */
  @media (min-width:901px) and (max-width:1439px){ .pane3.dr-open .p-classes{display:none;} }
  @media (min-width:901px) and (max-width:1179px){ .pane3.dr-open .p-roster{display:none;} }
  /* 인쇄 — 화면은 감추고 #printArea 만. 학생마다 한 장.
     쪽 여백을 0 으로 둬야 브라우저 머리말·꼬리말(주소·날짜·쪽 번호)이 안 찍힌다 — 위아래 여백은 표의 머리·꼬리 칸으로 준다 */
  #printArea{display:none;}
  @page{size:A4;margin:0;}
  @media print{
    html,body{height:auto;background:#fff;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block;--ac:#1E3A5F;--hair:#D5DAE1;--mute:#858B95;color:#1F2328;font-family:'Noto Sans KR',sans-serif;font-size:10pt;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    /* 문서처럼 — 색은 남색 하나, 가는 줄, 본문은 명조(칩·막대·카드 없이). 학생 하나가 표 하나:
       두 장을 넘기면 표 머리(이름·학번)가 다음 장에도 찍히고, 영역은 쪽 사이에서 갈라지지 않는다 */
    .pr-page{padding:0 17mm;break-after:page;page-break-after:always;}
    .pr-page:last-child{break-after:auto;page-break-after:auto;}
    table.pr-frame{width:100%;border-collapse:collapse;}
    .pr-frame td,.pr-frame th{padding:0;vertical-align:top;}
    .pr-frame > thead > tr:first-child > td{padding-top:15mm;}
    .pr-frame > tfoot > tr > td{padding-bottom:11mm;}
    .pr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8mm;padding-bottom:3.2mm;border-bottom:1.4pt solid var(--ac);}
    .pr-nm{font-family:'Noto Serif KR','Nanum Myeongjo','Batang',serif;font-size:19pt;font-weight:700;color:#111;letter-spacing:.03em;}
    .pr-id{margin-left:3mm;font-size:10.5pt;font-weight:500;color:#555;}
    .pr-doc{text-align:right;line-height:1.35;}
    .pr-doc b{display:block;font-size:9.5pt;font-weight:700;color:var(--ac);letter-spacing:.04em;}
    .pr-doc span{display:block;margin-top:.6mm;font-size:8pt;color:var(--mute);}
    tr.pr-sec{break-inside:avoid;}
    tr.pr-sec > td{padding:3.8mm 0 4.2mm;border-bottom:.5pt solid var(--hair);}
    .pr-sh{display:flex;align-items:baseline;justify-content:space-between;gap:6mm;margin-bottom:1.5mm;}
    .pr-sh b{font-size:10.2pt;font-weight:700;color:var(--ac);}
    .pr-bytes{font-size:7.8pt;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .pr-sec.over .pr-bytes,.pr-row.over .c-b{color:#B42318;font-weight:700;}
    .pr-t{font-family:'Noto Serif KR','Nanum Myeongjo','Batang',serif;font-size:9.8pt;line-height:1.72;color:#202428;
      white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
    .pr-empty{font-family:'Noto Sans KR',sans-serif;color:#A0A6AF;}
    .pr-foot{display:flex;justify-content:space-between;padding-top:2.6mm;font-size:7.8pt;color:var(--mute);}
    /* 참여한 활동 — 기재안에 들어갔는지(✓ 들어감 · ◐ 일부 · □ 아직), 아직인 것은 굵게. 봉사활동 기록은 뺀다(선생님 2026-10-30) */
    tr.pr-acts{break-inside:avoid;}
    tr.pr-acts > td{padding:3.4mm 0 3.6mm;border-bottom:.5pt solid var(--hair);}
    .pr-ash{display:flex;align-items:baseline;justify-content:space-between;gap:6mm;margin-bottom:1.4mm;}
    .pr-ash b{font-size:10.2pt;font-weight:700;color:var(--ac);}
    .pr-ash span{font-size:7.8pt;color:var(--mute);white-space:nowrap;}
    .pr-al{display:grid;grid-template-columns:1fr 1fr;gap:.9mm 8mm;margin:0;padding:0;list-style:none;font-size:9pt;}
    .pr-al li{display:flex;align-items:baseline;gap:1.6mm;line-height:1.45;min-width:0;}
    .pr-al i{flex-shrink:0;width:3.6mm;font-style:normal;text-align:center;color:var(--ac);}
    .pr-al .pr-an{min-width:0;}
    .pr-al .pr-aw{margin-left:auto;padding-left:2mm;flex-shrink:0;font-size:7.6pt;font-weight:500;color:var(--mute);white-space:nowrap;}
    .pr-al li.full,.pr-al li.part,.pr-al li.nob{color:#4A5058;}
    .pr-al li.none,.pr-al li.none i{font-weight:700;color:#111;}
    .pr-legend{margin-top:1.5mm;font-size:7.3pt;color:var(--mute);}
    /* 영역 인쇄 — 반 전체를 한 표로(자율만, 진로만 …). 쪽마다 제목·머리줄을 다시 */
    table.pr-list{table-layout:fixed;}
    .pr-list col.c-n{width:11mm;} .pr-list col.c-nm{width:19mm;} .pr-list col.c-b{width:16mm;}
    .pr-list .pr-head{margin-bottom:1.5mm;}
    .pr-list .pr-nm{font-size:16pt;}
    .pr-cols th{padding:2.2mm 2mm 1.8mm;border-bottom:.9pt solid var(--ac);font-size:8.3pt;font-weight:700;color:var(--ac);text-align:left;white-space:nowrap;}
    .pr-list tbody td{padding:2.6mm 2mm 2.8mm;border-bottom:.5pt solid var(--hair);}
    .pr-list .c-n{text-align:center;} .pr-list .c-b{text-align:right;}
    .pr-list td.c-n{color:#555;font-variant-numeric:tabular-nums;}
    .pr-list td.c-nm{font-weight:700;white-space:nowrap;}
    .pr-list td.c-b{font-size:7.8pt;color:var(--mute);font-variant-numeric:tabular-nums;}
    .pr-list td.pr-t{font-size:9.5pt;line-height:1.66;}
    .pr-list tbody tr{break-inside:avoid;}
  }
  /* ── 우리 반 생기부(담임) — 반 전체를 한 페이지에. 한눈에(학생 × 영역) · 영역별 표. 이름을 누르면 그 학생 작성 칸으로 ── */
  .cls-wrap{height:100%;overflow-y:auto;padding:16px 16px 48px;}
  .cls-sheet{max-width:1180px;}
  .cls-head{display:flex;align-items:flex-start;gap:10px 14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule);}
  .cls-ttl{display:flex;flex-direction:column;gap:3px;margin-right:auto;}
  .cls-ttl b{font-size:22px;font-weight:900;}
  .cls-ttl .d{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .cls-pick{display:flex;gap:6px;align-items:center;}
  .cls-pick select{padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:700;}
  .cls-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .cls-sheet .seg{margin-top:12px;}
  .cls-sum{margin:12px 0 6px;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .cls-sum .err{color:var(--warn);}
  table.cls-t{width:100%;border-collapse:collapse;font-size:14px;}
  .cls-t th{padding:8px;border-bottom:1px solid var(--rule);background:var(--paper-soft);text-align:left;font-size:12.5px;font-weight:800;color:var(--ink-soft);}
  .cls-t th.r,.cls-t td.r{text-align:right;}
  .cls-t td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:top;}
  .cls-t td.n{width:44px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .cls-t td.nm{width:92px;white-space:nowrap;}
  .cls-t td.nm button{padding:0;border:none;background:none;font:inherit;font-weight:800;color:var(--ink);cursor:pointer;
    text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;}
  .cls-t td.nm button:hover{color:var(--mon);text-decoration-color:var(--mon);}
  .cls-t td.tx{line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
  .cls-t td.tx.none{color:var(--ink-soft);}
  .cls-t td.b{width:118px;text-align:right;white-space:nowrap;font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .cls-t tr.over td.b{color:var(--warn);}
  .cls-t tr.over td.tx{box-shadow:inset 3px 0 0 var(--warn);padding-left:11px;}
  .cls-t td.cp{width:64px;text-align:right;}
  /* 한눈에 — 영역마다 바이트(빈 칸 · 씀 · 넘음) */
  .cls-all td.bx{text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cls-all td.bx.none{color:var(--ink-soft);font-weight:600;}
  .cls-all td.bx.ok{color:var(--ink);}
  .cls-all td.bx.over{color:var(--warn);}
