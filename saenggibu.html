<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>생기부 보조자료 — 영남고 교사 대시보드</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  // 앱이 기억해 둔 다크모드를 그대로 따른다. 앱 안 iframe 으로 뜨므로 여기만 밝으면 튄다.
  try{ if(localStorage.getItem('ynhs-dark')==='1') document.documentElement.classList.add('dark'); }catch(e){}
  window.addEventListener('storage', e => {
    if (e.key === 'ynhs-dark') document.documentElement.classList.toggle('dark', e.newValue === '1');
  });
  if (/[?&]in=1/.test(location.search)) document.documentElement.classList.add('in-app');
</script>
<style>
  /* 생기부 보조자료 — 부서·교과가 모아 낸 기재 문안 통합 엑셀을 학생별·활동별로 본다.
     엑셀 원본이 교원 전체에게 공유되는 자료라 읽기는 교사 전체(규칙),
     올리기는 관리자만(규칙). 탭을 누구에게 보일지는 index.html 이 정한다. */
  :root{
    --bg-base:#F1F5F9; --paper:#FFFFFF; --paper-soft:#F8FAFC;
    --ink:#0F172A; --ink-soft:#64748B; --rule:#E2E8F0;
    --warn:#EF4444; --accent:#3B82F6; --today-tint:#EFF6FF;
    --t-ja:#2563EB; --t-jin:#059669; --t-gae:#9333EA; --t-nu:#D97706;
  }
  html.dark{
    --bg-base:#0B1220; --paper:#151F33; --paper-soft:#1D2A44;
    --ink:#E2E8F0; --ink-soft:#8FA3BD; --rule:#26354F;
    --warn:#F87171; --accent:#60A5FA; --today-tint:#16263F;
    --t-ja:#60A5FA; --t-jin:#34D399; --t-gae:#C084FC; --t-nu:#FBBF24;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;background:var(--bg-base);
    font-family:'Noto Sans KR',sans-serif;color:var(--ink);}
  button,select,input{font-family:inherit;}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:20;}
  .head .ttl{font-size:14px;font-weight:800;margin-right:4px;}
  html.in-app .head .ttl{display:none;}
  .views{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
  .views button{background:var(--paper);border:0;border-right:1px solid var(--rule);
    padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .views button:last-child{border-right:0;}
  .views button.on{background:var(--accent);color:#fff;}
  .btn{background:var(--paper-soft);border:1px solid var(--rule);border-radius:9px;
    padding:6px 11px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--rule);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .btn:focus-visible,.views button:focus-visible,.stu:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #fileNote{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}
  #main{padding:14px 16px 28px;max-width:1180px;}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;}
  .bar select,.bar input[type=search]{font-size:13px;padding:5px 8px;border:1px solid var(--rule);
    border-radius:8px;background:var(--paper);color:var(--ink);}
  .bar input[type=search]{min-width:140px;flex:1;max-width:260px;}
  .empty{font-size:13px;color:var(--ink-soft);padding:18px 2px;line-height:1.7;}
  .err{color:var(--warn);}

  /* 학생 목록 */
  .stus{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .stu{background:var(--paper);border:1px solid var(--rule);border-radius:8px;
    padding:4px 9px;font-size:12px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;}
  .stu b{color:var(--ink-soft);font-weight:700;margin-right:3px;}
  .stu.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stu.on b{color:#fff;}

  /* 묶음(입력 영역) */
  .grp{margin:18px 0 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .grp small{font-weight:600;color:var(--ink-soft);}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;
    border:1px solid currentColor;line-height:1.6;white-space:nowrap;}
  .tag.ja{color:var(--t-ja);} .tag.jin{color:var(--t-jin);} .tag.gae{color:var(--t-gae);} .tag.nu{color:var(--t-nu);}
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:9px;}
  .card-h{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
  .card-h .t{font-size:13.5px;font-weight:800;}
  .card-h .d{font-size:11.5px;color:var(--ink-soft);}
  .where{font-size:11.5px;color:var(--ink-soft);margin-bottom:7px;line-height:1.6;}
  .body{font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
    background:var(--paper-soft);border-radius:8px;padding:9px 11px;}
  .tools{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--ink-soft);}
  .tools .btn{padding:3px 9px;font-size:11.5px;}
  details{margin-top:7px;font-size:12.5px;}
  details summary{cursor:pointer;color:var(--ink-soft);font-weight:700;font-size:12px;}
  details .txt{white-space:pre-wrap;line-height:1.7;padding:7px 2px 2px;word-break:keep-all;overflow-wrap:anywhere;}
  .ex{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 10px;font-size:12.5px;margin-top:6px;}
  .ex dt{color:var(--ink-soft);font-weight:700;}
  .ex dd{white-space:pre-wrap;overflow-wrap:anywhere;}

  /* 활동별 */
  .acts{display:flex;flex-direction:column;gap:4px;}
  .act{display:flex;align-items:center;gap:7px;text-align:left;background:var(--paper);
    border:1px solid var(--rule);border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--ink);font-size:12.5px;}
  .act .n{margin-left:auto;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:11.5px;}
  .act.on{border-color:var(--accent);background:var(--today-tint);}
  .two{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;align-items:start;}
  @media (max-width:820px){ .two{grid-template-columns:1fr;} }
  .counts{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px;}
  .counts span{font-size:11px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;
    padding:2px 7px;font-variant-numeric:tabular-nums;}
  .who{font-size:12.5px;font-weight:800;margin-bottom:5px;font-variant-numeric:tabular-nums;}
  .who span{color:var(--ink-soft);font-weight:600;margin-right:6px;}

  /* 창체 일정 표 */
  .tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th{text-align:left;color:var(--ink-soft);font-size:11px;border-bottom:1px solid var(--rule);padding:6px 8px;white-space:nowrap;}
  td{padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:top;font-variant-numeric:tabular-nums;}
  td.long{min-width:180px;}

  /* 올리기 (관리자) */
  #upPanel{display:none;background:var(--paper);border:1px solid var(--accent);border-radius:12px;
    padding:13px 15px;margin-bottom:14px;font-size:12.5px;line-height:1.7;}
  #upPanel h3{font-size:13.5px;margin-bottom:6px;}
  #upPanel ul{padding-left:18px;}
  #upPanel .acts-sum{max-height:220px;overflow:auto;margin:6px 0;border-top:1px solid var(--rule);padding-top:6px;}
  #upPanel .row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  #upPanel .sec{margin-top:10px;}
  #upPanel .sec.miss{border:1px solid var(--warn);border-radius:9px;padding:8px 10px;}
  #upPanel .miss-row{display:flex;align-items:baseline;gap:8px;padding:2px 0;}
  #upPanel .miss-row select{font-size:12px;padding:2px 4px;border:1px solid var(--rule);border-radius:6px;
    background:var(--paper);color:var(--ink);flex-shrink:0;}

  .gate{position:fixed;inset:0;background:var(--bg-base);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50;}
  .gate .card{max-width:380px;width:100%;text-align:center;padding:30px 26px;}
  .gate h1{font-size:18px;margin-bottom:9px;}
  .gate p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:16px;}
  .gate .err{font-size:12.5px;margin-top:12px;white-space:pre-line;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:8px 15px;border-radius:9px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;}
  .toast.on{opacity:.95;}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none;} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h1>📑 생기부 보조자료</h1>
    <p>학교 구글 계정으로 로그인해야 볼 수 있습니다.</p>
    <button class="btn pri" id="loginBtn" type="button">구글 계정으로 로그인</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="head">
  <span class="ttl">📑 생기부 보조자료</span>
  <div class="views" id="views">
    <button type="button" data-view="stu" class="on">학생별</button>
    <button type="button" data-view="act">활동별</button>
    <button type="button" data-view="sch">창체 일정</button>
  </div>
  <button class="btn" id="upBtn" type="button" style="display:none;">📤 엑셀 올리기</button>
  <button class="btn" id="dlBtn" type="button" style="display:none;" title="목차 + 활동마다 시트 하나 — 내부결재용">📥 엑셀로 받기</button>
  <input type="file" id="upFile" accept=".xlsx,.xlsm,.xls" style="display:none;">
  <span id="fileNote"></span>
</div>
<div id="main">
  <div id="upPanel"></div>
  <div id="body"><div class="empty">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>

<!-- 엑셀 → 자료. 순수 함수만 둔다(XLSX·Firebase 없이 시트 이름·숨김 여부·행 배열만 받는다).
     tests/saenggibu.test.mjs 가 이 블록을 그대로 떼어 돌린다. -->
<script id="sgbParser">
// 시트 이름 앞 꼬리표 — 엑셀이 쓰는 약속: <자> 자율, <진> 진로, <개> 개인별, <누> 누가기록, <자or진> 둘 중 고름
const SGB_TAGS = { '자':'자율', '진':'진로', '개':'개인별', '누':'누가기록' };
const SGB_TAG_CLS = { '자':'ja', '진':'jin', '개':'gae', '누':'nu' };
const SGB_TAG_ORDER = ['자','진','개','누'];
// 한 문서에 담을 크기(바이트). Firestore 한도는 1MiB — 여유를 두고 자른다.
const SGB_PART_BYTES = 600000;

function sgbNorm(v){ return String(v ?? '').replace(/\s+/g, ''); }
function sgbText(v){ return String(v ?? '').replace(/\r\n?/g, '\n').replace(/[ \t\u00a0]+\n/g, '\n').trim(); }
// 짧은 지문(FNV-1a). 시트 이름 → 활동 id, 문서 내용 → 바뀌었는지
function sgbHash(s){
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}

// '<자or진>과중(로봇공학)-2차' → 꼬리표 [자,진], 차수 [2], 괄호 속 이름, 앞쪽 부서 줄임말
function sgbSheetInfo(name){
  const m = String(name).match(/^\s*<([^>]+)>\s*(.*)$/);
  if (!m) return null;
  const tags = m[1].split(/or/i).map(s => s.trim()).filter(Boolean);
  const rest = m[2].trim();
  // 괄호 안의 숫자(예: '수학대중화강연 1,2차')는 차수가 아니다
  const rounds = [...rest.replace(/\([^)]*\)/g, '').matchAll(/(\d+)\s*차/g)].map(x => +x[1]);
  const paren = rest.match(/\(([^)]*)\)/);
  return { tags, rest, rounds, short: paren ? paren[1].trim() : rest, deptAbbr: rest.split('(')[0].replace(/-\d+차.*$/, '').trim() };
}

// 머리 줄 위의 안내: '⊙ 활  동  명:' 칸의 오른쪽 첫 값. 같은 줄 왼쪽의 '⊙' 없는 첫 칸은 부서.
// (수학과 시트는 A열에 '00⊙ 활 동 명:' 이 한 번 더 있다 — 그래서 '마지막' ⊙ 칸을 본다)
function sgbHead(rows, h){
  const out = {};
  for (let i = 0; i < h; i++){
    const r = rows[i] || [];
    let last = -1;
    for (let j = 0; j < r.length; j++) if (String(r[j] ?? '').includes('⊙')) last = j;
    if (last < 0) continue;
    const key = sgbNorm(r[last]).replace(/^[^⊙]*⊙/, '').replace(/[:：]$/, '');
    let val = '';
    for (let j = last + 1; j < r.length; j++){ const t = sgbText(r[j]); if (t){ val = t; break; } }
    if (key && !(key in out)) out[key] = val;
    if (!out._dept) for (let j = 0; j < last; j++){
      const t = sgbText(r[j]);
      if (t && !t.includes('⊙')){ out._dept = t; break; }
    }
  }
  return out;
}

function sgbFindHeader(rows){
  for (let i = 0; i < Math.min(rows.length, 25); i++){
    const s = (rows[i] || []).map(sgbNorm);
    if (s.includes('학년') && s.includes('반') && s.includes('번호')) return { i, kind: 'student', s };
    if (s.includes('월') && s.includes('일') && (s.includes('교시') || s.some(x => x.includes('활동내용'))))
      return { i, kind: 'schedule', s };
  }
  return null;
}

const SGB_WEEKDAY = /^[월화수목금토일](\s*\n\s*[월화수목금토일])*$/;
function sgbNameBlankCols(s, labels, sample){
  const width = Math.max(s.length, ...sample.map(r => (r || []).length));
  for (let j = 0; j < width; j++){
    if (s[j]) continue;
    const vals = sample.map(r => sgbText((r || [])[j])).filter(Boolean);
    if (vals.length && vals.every(v => SGB_WEEKDAY.test(v))){ s[j] = '요일'; labels[j] = '요일'; }
  }
}

// 칸의 쓰임: 기재 문안(body) · 학생이 쓴 글(self) · 나머지 정보(extra) · 버림(skip)
function sgbRole(h){
  if (!h || /^(순번|연번|학년반번호|학번)$/.test(h) || /^[a-z]+=/i.test(h)) return 'skip';
  if (h.includes('기재내용') || h.includes('기재예시') || h === '특기사항') return 'body';
  if (h.includes('평가서') || h.includes('보고서')) return 'self';
  return 'extra';
}

// 엑셀 → sgbParseBook 이 받는 모양. 꼬리표(<…>) 없는 시트는 읽지도 않는다(개인별 조회 시트가 6천 줄이다).
function sgbBookToSheets(XLSX, wb){
  return wb.SheetNames.map((name, i) => {
    const hidden = !!(wb.Workbook?.Sheets?.[i]?.Hidden);
    if (hidden || !/^\s*</.test(name)) return { name, hidden, rows: [] };
    return { name, hidden, rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' }) };
  });
}

// sheets: [{ name, hidden, rows: [[칸…]…] }] → 활동·창체 일정·학생별·활동별 자료
function sgbParseBook(sheets){
  const activities = [], schedules = [], skipped = [];
  const actRows = new Map(), ids = new Set();
  let pos = -1;
  for (const sh of sheets){
    pos++;                                   // 파일 안 시트 차례 — 내려받을 때 원본 순서대로
    const name = String(sh.name || '').trim();
    if (sh.hidden){ skipped.push({ name, why: '숨긴 시트' }); continue; }
    const info = sgbSheetInfo(name);
    if (!info){ skipped.push({ name, why: '이름이 <자>·<진>·<누> 같은 꼬리표로 시작하지 않음' }); continue; }
    const rows = sh.rows || [];
    const hd = sgbFindHeader(rows);
    if (!hd){ skipped.push({ name, why: '학년·반·번호(또는 월·일) 머리 줄을 못 찾음' }); continue; }
    const head = sgbHead(rows, hd.i);
    let id = 'a' + sgbHash(name);
    while (ids.has(id)) id += 'x';
    ids.add(id);
    const base = { id, pos, sheet: name, tags: info.tags, rounds: info.rounds,
      // 부서 칸에 활동명이 그대로 들어간 시트가 있다 — 그럴 땐 시트 이름 앞쪽(예: 연구부)을 쓴다
      title: head['활동명'] || info.short, short: info.short,
      dept: head._dept && head._dept !== head['활동명'] ? head._dept : info.deptAbbr,
      area: head['입력영역'] || '', path: head['입력경로'] || '', note: head['유의사항'] || '' };
    const labels = (rows[hd.i] || []).map(v => sgbText(v).replace(/\s+/g, ' '));
    // 머리 이름이 빈 칸 중 요일 글자(월~일)로만 찬 칸은 '요일' — 프로젝트 봉사 시트의 J열
    if (hd.kind === 'student') sgbNameBlankCols(hd.s, labels, rows.slice(hd.i + 1, hd.i + 41));

    if (hd.kind === 'schedule'){
      const keep = hd.s.map((h, j) => h ? j : -1).filter(j => j >= 0);
      // 표 중간의 빈 줄도 남긴다(월 사이 띄운 줄) — 내려받을 때 원본 줄 자리 그대로. 끝의 빈 줄만 뗀다.
      const out = [];
      for (const r of rows.slice(hd.i + 1)) out.push({ v: keep.map(j => sgbText((r || [])[j])) });   // Firestore 는 배열 안 배열을 못 담는다
      while (out.length && !out.at(-1).v.some(Boolean)) out.pop();
      const g = +(((name + ' ' + base.title).match(/([1-3])\s*학년/) || [])[1] || 0);
      const cols = keep.map(j => labels[j]);
      schedules.push({ ...base, grade: g, cols, rows: out,
        hash: sgbHash(JSON.stringify([base.title, base.area, base.path, base.note, cols, out])) + '.' + out.length });
      continue;
    }

    const s = hd.s, gi = s.indexOf('학년'), ci = s.indexOf('반'), ni = s.indexOf('번호');
    const nmi = s.findIndex(h => h === '성명' || h === '이름');
    let bi = -1, si = -1;
    const xi = [];
    s.forEach((h, j) => {
      if ([gi, ci, ni, nmi].includes(j)) return;
      const role = sgbRole(h);
      if (role === 'body' && bi < 0) bi = j;
      else if (role === 'self' && si < 0) si = j;
      else if (role !== 'skip') xi.push(j);
    });
    const rowsOut = [], byClass = {};
    for (const r0 of rows.slice(hd.i + 1)){
      const r = r0 || [];
      const g = parseInt(r[gi], 10), c = parseInt(r[ci], 10), n = parseInt(r[ni], 10);
      if (!(g >= 1 && g <= 3) || !(c >= 1) || !(n >= 1)) continue;
      const b = bi >= 0 ? sgbText(r[bi]) : '';
      const sv = si >= 0 ? sgbText(r[si]) : '';
      const x = xi.map(j => sgbText(r[j]));
      if (!b && !sv && !x.some(Boolean)) continue;
      const nm = nmi >= 0 ? sgbText(r[nmi]) : '';
      const item = { a: id };
      if (b) item.b = b;
      if (sv) item.s = sv;
      if (x.some(Boolean)) item.x = x;
      rowsOut.push({ g, c, n, nm, ...item, i: rowsOut.length });   // i: 시트 안 줄 차례(내려받을 때 원본 순서)
      const ck = g + '-' + c;
      byClass[ck] = (byClass[ck] || 0) + 1;
    }
    actRows.set(id, rowsOut);
    const a = { ...base, body: bi >= 0 ? labels[bi] : '', self: si >= 0 ? labels[si] : '',
      extra: xi.map(j => labels[j] || ''), count: rowsOut.length, byClass };
    // 다시 올렸을 때 '바뀐 시트' 를 가르는 지문 — 학생 줄과 안내 칸까지
    a.hash = sgbHash(JSON.stringify([a.title, a.dept, a.area, a.path, a.note, a.tags, a.body, a.self, a.extra, rowsOut])) + '.' + rowsOut.length;
    activities.push(a);
  }
  return { activities, schedules, skipped, students: sgbStudents(activities, actRows), actRows };
}

// 활동별 줄 → 학생별 묶음. 활동 순서대로 쌓는다.
function sgbStudents(activities, actRows){
  const stu = new Map();
  for (const a of activities) for (const r of actRows.get(a.id) || []){
    const key = r.g + '-' + r.c + '-' + r.n;
    if (!stu.has(key)) stu.set(key, { g: r.g, c: r.c, n: r.n, nm: r.nm || '', items: [] });
    const st = stu.get(key);
    if (!st.nm && r.nm) st.nm = r.nm;
    const it = { a: r.a };
    if (r.b) it.b = r.b;
    if (r.s) it.s = r.s;
    if (r.x) it.x = r.x;
    st.items.push(it);
  }
  return [...stu.values()].sort((a, b) => a.g - b.g || a.c - b.c || a.n - b.n);
}

// 이번 파일과 이미 올라가 있는 것(saenggibu/meta)을 시트 단위로 맞대 본다.
// 같은 시트 = 같은 시트 이름(id). 지문이 없는 옛 기록은 '바뀜' 으로 본다.
function sgbCompare(oldMeta, parsed){
  const out = { added: [], changed: [], same: [], missing: [], old: oldMeta };
  const sides = [['act', oldMeta?.activities, parsed.activities], ['sch', oldMeta?.schedules, parsed.schedules]];
  for (const [kind, olds, curs] of sides){
    const left = new Map((olds || []).map(o => [o.id, o]));
    for (const cur of curs || []){
      const old = left.get(cur.id);
      left.delete(cur.id);
      if (!old) out.added.push({ kind, cur });
      else if (old.hash && old.hash === cur.hash) out.same.push({ kind, cur, old });
      else out.changed.push({ kind, cur, old });
    }
    for (const old of left.values()) out.missing.push({ kind, old });
  }
  return out;
}

// 이번 파일 + 남기기로 한 옛 활동(줄은 saenggibuAct 에서 읽어 온 것)·옛 창체 일정 → 하나로.
// 순서는 이미 올라가 있던 순서(order: 옛 목록의 id 차례)를 지키고 새 시트는 뒤에 —
// 그래야 다시 올릴 때 화면 순서가 흔들리지 않고, 안 바뀐 학생 문서를 다시 쓰지 않는다.
function sgbMerge(parsed, keepActs, keepScheds, order = []){
  let activities = [...parsed.activities];
  const actRows = new Map(parsed.actRows);
  for (const { a, rows } of keepActs){
    const { parts, ...rest } = a;
    activities.push(rest);
    actRows.set(a.id, rows);
  }
  const rank = new Map(order.map((id, i) => [id, i]));
  const byOrder = list => list.map((x, i) => [x, rank.has(x.id) ? rank.get(x.id) : order.length + i])
    .sort((p, q) => p[1] - q[1]).map(p => p[0]);
  activities = byOrder(activities);
  const schedules = byOrder([...parsed.schedules, ...keepScheds]);
  // 활동·창체 일정을 섞은 시트 차례 — 이미 있던 것은 옛 차례, 새 시트는 파일 안 차례로 뒤에
  const all = byOrder([...activities, ...schedules].sort((p, q) => (p.pos ?? 999) - (q.pos ?? 999)));
  return { ...parsed, activities, schedules, actRows, order: all.map(x => x.id), students: sgbStudents(activities, actRows) };
}

// ── 원본 양식 ── 올릴 때 시트마다 위쪽 안내 칸·머리줄·병합·열 너비·인쇄 설정과 본문 칸 서식을
// 떠 둔다(saenggibu/fmt-{id}). 내려받을 때 그 틀에 문안을 다시 채운다. 본문 글꼴만은 하나로
// 맞춘다 — 여러 사람이 손대 시트마다 글꼴·크기가 섞여 있다(돋움 10 이 원래 양식의 기본).
const SGB_BODY_FONT = { name: '돋움', size: 10 };
const SGB_BLUE = 'FF0066FF';            // 원래 양식의 머리줄 파랑
const sgbClone = o => o == null ? null : JSON.parse(JSON.stringify(o));
function sgbCellText(v){
  if (v == null) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'object'){
    if (Array.isArray(v.richText)) return v.richText.map(t => t.text || '').join('');
    if ('result' in v) return sgbCellText(v.result);
    if ('text' in v) return String(v.text ?? '');
    return '';
  }
  return String(v);
}
// 머리 줄 칸 이름 → 그 칸에 들어갈 값의 이름. 활동: g c n nm seq key b s x{j}, 창체 일정: v{j}
function sgbRoles(labels, a, kind){
  const used = new Set();
  const take = r => { if (used.has(r)) return ''; used.add(r); return r; };
  return labels.map(l => {
    if (!l) return '';
    if (kind === 'sch'){ const j = (a.cols || []).findIndex((c, k) => sgbNorm(c) === l && !used.has('v' + k)); return j >= 0 ? take('v' + j) : ''; }
    if (l === '학년') return take('g');
    if (l === '반') return take('c');
    if (l === '번호') return take('n');
    if (l === '성명' || l === '이름') return take('nm');
    if (l === '순번' || l === '연번') return take('seq');
    if (l === '학년반번호' || l === '학번') return take('key');
    if (a.body && l === sgbNorm(a.body) && !used.has('b')) return take('b');
    if (a.self && l === sgbNorm(a.self) && !used.has('s')) return take('s');
    const j = (a.extra || []).findIndex((x, k) => sgbNorm(x) === l && !used.has('x' + k));
    return j >= 0 ? take('x' + j) : '';
  });
}
// ws: ExcelJS 시트. 머리 줄을 못 찾으면 null(그 시트는 단순 표로 나간다)
function sgbFormOf(ws, a, kind){
  const maxCol = Math.min(Math.max(ws.columnCount || 0, 1), 40);
  const labelsOf = r => { const out = [''];
    for (let c = 1; c <= maxCol; c++) out.push(sgbNorm(sgbCellText(ws.getRow(r).getCell(c).value))); return out; };
  let h = 0;
  for (let r = 1; r <= Math.min(ws.rowCount || 0, 25) && !h; r++){
    const s = labelsOf(r);
    if ((s.includes('학년') && s.includes('반') && s.includes('번호'))
      || (s.includes('월') && s.includes('일') && (s.includes('교시') || s.some(x => x.includes('활동내용'))))) h = r;
  }
  if (!h) return null;
  const rows = [];
  for (let r = 1; r <= h; r++){
    const R = ws.getRow(r), cells = [];
    for (let c = 1; c <= maxCol; c++){
      const C = R.getCell(c);
      // 병합된 칸의 나머지 칸은 값이 으뜸 칸 것으로 읽힌다 — 값은 버리고 테두리 같은 서식만
      const slave = C.isMerged && C.master && C.master.address !== C.address;
      const t = slave ? '' : sgbCellText(C.value);
      const st = sgbClone(C.style) || {};
      if (!t && !st.border && !st.fill && !st.font) continue;
      cells.push({ c, t, s: st });
    }
    rows.push({ r, ht: R.height || null, cells });
  }
  const merges = (ws.model?.merges || []).filter(m => +(String(m).match(/^[A-Z]+(\d+)/) || [])[1] <= h);
  const cols = [null];
  // 너비 0 은 숨긴 열(원본의 학번 열) — 0 을 빈 값으로 보면 다시 드러난다
  for (let c = 1; c <= maxCol; c++){ const C = ws.getColumn(c); cols.push({ w: C.width ?? null, hidden: !!C.hidden || C.width === 0 }); }
  const roles = sgbRoles(labelsOf(h), a, kind);
  // 이름 없는 머리 칸 — 값이 학번(30101)이면 key, 요일이면 그 활동의 '요일' 칸.
  // 학생 줄만 본다(표 아래 빈 줄의 수식이 '0000' 같은 값을 내는 시트가 있다)
  const gcol = roles.indexOf('g');
  for (let c = 1; c <= maxCol; c++){
    if (roles[c]) continue;
    const vals = [];
    for (let r = h + 1; r <= Math.min(ws.rowCount || 0, h + 40); r++){
      if (gcol > 0 && !/^[1-3]$/.test(sgbCellText(ws.getRow(r).getCell(gcol).value).trim())) continue;
      const t = sgbCellText(ws.getRow(r).getCell(c).value).trim();
      if (t) vals.push(t);
    }
    if (!vals.length) continue;
    if (kind !== 'sch' && !roles.includes('key') && vals.every(v => /^[1-3]\d{4}$/.test(v))) roles[c] = 'key';
    else if (kind !== 'sch' && vals.every(v => SGB_WEEKDAY.test(v))){
      const j = (a.extra || []).indexOf('요일');
      if (j >= 0 && !roles.includes('x' + j)) roles[c] = 'x' + j;
    }
  }
  // 본문 칸 서식은 첫 자료 줄에서 — 글꼴은 버린다(나중에 하나로)
  const data = [null];
  let d = 0;
  for (let r = h + 1; r <= Math.min(ws.rowCount || 0, h + 40) && !d; r++){
    const vals = labelsOf(r);
    if (kind === 'sch' ? vals.some(Boolean) : /^[1-3]$/.test(vals[roles.indexOf('g')] || '')) d = r;
  }
  // 칸마다 원본 값의 형식 — 숫자로 적혀 있던 칸은 숫자로, 글자였던 칸은 글자로 되돌린다
  const types = [''];
  for (let c = 1; c <= maxCol; c++){
    const st = d ? sgbClone(ws.getRow(d).getCell(c).style) || {} : {};
    delete st.font;
    data.push(st);
    // 그 열의 값들로 정한다(첫 줄이 빈 칸이거나 한두 칸만 글자로 적힌 열이 있다): 숫자가 많으면 숫자,
    // 앞에 0 을 붙여 적은 값(반 '01')이 하나라도 있으면 'z', 아니면 글자
    let nNum = 0, nStr = 0, zero = false;
    for (let r = h + 1; r <= Math.min(ws.rowCount || 0, h + 60); r++){
      if (gcol > 0 && !/^[1-3]$/.test(sgbCellText(ws.getRow(r).getCell(gcol).value).trim())) continue;   // 학생 줄만
      let v = ws.getRow(r).getCell(c).value;
      if (v && typeof v === 'object' && 'result' in v) v = v.result;
      if (typeof v === 'number') nNum++;
      else if (typeof v === 'string' && v.trim()){ nStr++; if (/^0\d$/.test(v.trim())) zero = true; }
    }
    types.push(zero ? 'z' : nNum && nNum >= nStr ? 'n' : nStr ? 's' : '');
  }
  const page = sgbClone(ws.pageSetup) || {};
  delete page.printArea;
  // 원본 줄 높이 — 학생(같은 학생이 여러 줄이면 몇 번째인지)으로, 창체 일정은 자료 줄 차례로.
  // 내려받을 때 원본에 있던 줄은 원본 높이를 그대로 쓴다.
  const hts = {};
  const gi = roles.indexOf('g'), ci = roles.indexOf('c'), ni = roles.indexOf('n');
  const content = roles.map((r, k) => /^(b|s|x\d+|v\d+)$/.test(r) ? k : -1).filter(k => k > 0);
  const seen = {};
  for (let r = h + 1; r <= (ws.rowCount || 0); r++){
    const R = ws.getRow(r);
    const t = k => sgbCellText(R.getCell(k).value).trim();
    if (!content.some(k => t(k))) continue;
    let key;
    if (kind === 'sch') key = String(r - h - 1);       // 창체 일정은 빈 줄까지 원본 줄 자리 그대로
    else {
      const g = parseInt(t(gi), 10), c = parseInt(t(ci), 10), n = parseInt(t(ni), 10);
      if (!(g >= 1 && g <= 3) || !(c >= 1) || !(n >= 1)) continue;
      const b = `${g}-${c}-${n}`;
      key = `${b}#${seen[b] = (seen[b] ?? -1) + 1}`;
    }
    if (R.height) hts[key] = R.height;
  }
  const tab = sgbClone(ws.properties?.tabColor);
  return { v: 1, h, rows, merges, cols, roles, data, types, page, views: sgbClone(ws.views) || [], hts,
    tab: tab && (tab.argb || tab.theme != null) ? tab : null,
    defH: ws.properties?.defaultRowHeight || null, hf: sgbClone(ws.headerFooter) || null };
}
// 양식이 없을 때(못 읽었거나 옛 기록) 쓰는 단순한 틀 — 원래 양식과 같은 파랑 머리줄
function sgbPlainForm(a, kind){
  const thin = { style: 'thin', color: { argb: 'FF999999' } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const info = [['부서', a.dept], ['활동명', a.title], ['입력 영역', a.area], ['입력 경로', a.path], ['유의 사항', a.note]]
    .filter(([, v]) => v);
  const labels = kind === 'sch' ? (a.cols || [])
    : ['학년', '반', '번호', '성명', ...(a.extra || []), ...(a.self ? [a.self] : []), ...(a.body ? [a.body] : [])];
  const rows = info.map(([k, v], i) => ({ r: i + 1, ht: null, cells: [
    { c: 1, t: k, s: { font: { name: '돋움', size: 10, bold: true } } },
    { c: 2, t: v, s: { font: { name: i === 1 ? 'HY헤드라인M' : '돋움', size: i === 1 ? 14 : 10 }, alignment: { wrapText: true, vertical: 'top' } } }] }));
  const h = info.length + 2;
  rows.push({ r: h, ht: null, cells: labels.map((t, k) => ({ c: k + 1, t, s: {
    font: { name: '돋움', size: 10, bold: true, color: { argb: 'FFFFFFFF' } },
    fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: SGB_BLUE } },
    alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }, border: box } })) });
  const merges = info.map((_, i) => `B${i + 1}:${String.fromCharCode(64 + Math.max(2, labels.length))}${i + 1}`);
  const roles = [''].concat(sgbRoles(labels.map(sgbNorm), a, kind));
  const cols = [null].concat(labels.map((l, k) => ({ w: kind === 'sch' ? (k >= labels.length - 2 ? 30 : 7)
    : k < 3 ? 5 : k === 3 ? 9 : /^(b|s)$/.test(roles[k + 1]) ? 70 : 16, hidden: false })));
  const data = [null].concat(labels.map(() => ({ border: box, alignment: { vertical: 'top', wrapText: true } })));
  return { v: 1, h, rows, merges: labels.length > 1 ? merges : [], cols, roles, data,
    page: { orientation: kind === 'sch' ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 },
    views: [{ state: 'frozen', ySplit: h }] };
}
// 줄바꿈 — 기재 문안·학생 글 칸은 늘, 나머지는 원본 칸이 줄바꿈이었을 때만(봉사 시트처럼 한 줄로 쓰는 표가 있다)
function sgbWraps(form, col){
  const role = (form.roles || [])[col] || '';
  return role === 'b' || role === 's' || !!(((form.data || [])[col] || {}).alignment || {}).wrapText;
}
// 줄 높이 — 긴 문안이 잘려 보이지 않게 미리 잰다(엑셀이 열 때 늘려 준다고 믿지 않는다).
// 한글 한 자는 숫자 1.6칸쯤, 돋움 10 한 줄은 12.75pt — 원본 시트의 높이에 맞춰 잡은 값
function sgbRowHeight(form, vals){
  let lines = 1;
  vals.forEach((v, col) => {
    if (!col || v === '' || v == null || !sgbWraps(form, col)) return;
    const c = (form.cols || [])[col];
    if (c && (c.hidden || c.w === 0)) return;
    const w = Math.max(4, (c && c.w ? c.w : 9) - 1);
    let n = 0;
    for (const para of String(v).split('\n')){
      let u = 0;
      for (const ch of para) u += ch.charCodeAt(0) > 0x2e80 ? 1.6 : 1;
      n += Math.max(1, Math.ceil(u / w));
    }
    lines = Math.max(lines, n);
  });
  return Math.min(409, Math.max(15, Math.ceil(lines * 12.75 + 3)));   // 엑셀 한 줄 높이 한도 409pt
}
function sgbTyped(form, col, v){
  const t = (form.types || [])[col];
  if (t === 'n' && typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v.trim())) return Number(v);
  if (t === 's' && typeof v === 'number') return String(v);
  if (t === 'z' && /^\d$/.test(String(v))) return '0' + v;
  return v;
}
function sgbDataStyle(form, col){
  const base = sgbClone((form.data || [])[col]) || {};
  const st = { ...base, font: { ...SGB_BODY_FONT } };
  if (sgbWraps(form, col))
    st.alignment = { ...(base.alignment || {}), wrapText: true, vertical: (base.alignment || {}).vertical || 'top' };
  return st;
}
// 한 줄의 값 — 원본 칸 차례대로(roles). seq 는 차례 번호, key 는 학년반번호(30101)
function sgbRowValues(roles, r, i){
  const p2 = n => String(n).padStart(2, '0');
  return roles.map(role => {
    if (!role) return '';
    if (role === 'g' || role === 'c' || role === 'n') return r[role];
    if (role === 'nm') return r.nm || '';
    if (role === 'seq') return i + 1;
    if (role === 'key') return `${r.g}${p2(r.c)}${p2(r.n)}`;
    if (role === 'b' || role === 's') return r[role] || '';
    if (role[0] === 'x') return (r.x || [])[+role.slice(1)] || '';
    if (role[0] === 'v') return (r.v || [])[+role.slice(1)] || '';
    return '';
  });
}
// 내부결재용 내려받기 — 목차 + 활동마다 시트 하나(원래 시트 이름) + 창체 일정.
// rowsById: 활동 id → 저장된 줄들, forms: id → 양식(없으면 단순한 틀).
// 엑셀 시트 이름 규칙(31자, : \ / ? * [ ] 금지, 겹치면 안 됨)을 맞춘다.
function sgbExportPlan(meta, rowsById, forms = {}){
  const used = new Set();
  const sheetName = raw => {
    const base = String(raw || '시트').replace(/[:\\/?*\[\]]/g, '_').trim().slice(0, 31) || '시트';
    let name = base, k = 2;
    while (used.has(name.toLowerCase())){ const tail = `~${k++}`; name = base.slice(0, 31 - tail.length) + tail; }
    used.add(name.toLowerCase());
    return name;
  };
  const toc = [];
  const out = [];
  const byId = new Map([...(meta.activities || []).map(a => [a.id, ['act', a]]), ...(meta.schedules || []).map(x => [x.id, ['sch', x]])]);
  const ids = [...(meta.order || []).filter(id => byId.has(id)), ...[...byId.keys()].filter(id => !(meta.order || []).includes(id))];
  for (const id of ids){
    const [kind, a] = byId.get(id);
    const name = sheetName(a.sheet);
    const form = forms[a.id] || sgbPlainForm(a, kind);
    // 줄 차례: 원본 시트 차례(i). 옛 기록이라 i 가 없으면 반·번호 순
    const list = kind === 'sch' ? (a.rows || []) : [...(rowsById[a.id] || [])].sort((x, y) =>
      (x.i != null && y.i != null) ? x.i - y.i : (x.g - y.g || x.c - y.c || x.n - y.n));
    const seen = {};
    const heights = list.map((r, k) => {
      if (kind === 'sch') return (form.hts || {})[String(k)] || null;
      const b = `${r.g}-${r.c}-${r.n}`;
      return (form.hts || {})[`${b}#${seen[b] = (seen[b] ?? -1) + 1}`] || null;
    });
    out.push({ name, form, rows: list.map((r, k) => sgbRowValues(form.roles, r, k)), heights, styled: !!forms[a.id] });
    const cnt = kind === 'sch' ? list.filter(r => (r.v || []).some(Boolean)).length : list.length;
    toc.push([kind === 'sch' ? '창체 일정' : (a.tags || []).map(t => SGB_TAGS[t] || t).join(' 또는 '), a.title, a.dept, a.area, cnt, name, a.file || '']);
  }
  const tocName = sheetName('목차');
  const tocForm = sgbPlainForm({ title: '생기부 보조자료 — 목차', cols: ['구분', '활동명', '부서', '입력 영역', '건수', '시트', '파일'] }, 'sch');
  tocForm.cols = [null, ...[14, 40, 14, 30, 7, 34, 26].map(w => ({ w, hidden: false }))];
  // 목차는 맨 뒤 — 원본 시트 차례를 흐트러뜨리지 않게
  return [...out, { name: tocName, form: tocForm, rows: toc.map(v => ['', ...v]), heights: [], styled: false }];
}

// 저장할 문서들. 학생 하나 = 문서 하나(학생별 보기 = 읽기 1번),
// 활동 하나 × 학년 = 문서 하나(활동별 보기 = 학년마다 읽기 1번) — 크면 여러 조각으로.
function sgbBuildDocs(parsed, partBytes = SGB_PART_BYTES){
  const enc = new TextEncoder();
  const size = o => enc.encode(JSON.stringify(o)).length;
  const docs = new Map();
  for (const st of parsed.students) docs.set(`saenggibuStu/${st.g}-${st.c}-${st.n}`, st);
  const activities = parsed.activities.map(a => {
    const byG = {};
    for (const r of parsed.actRows.get(a.id) || []) (byG[r.g] = byG[r.g] || []).push(r);
    const parts = {};
    for (const [g, list] of Object.entries(byG)){
      let chunk = [], bytes = 0, k = 0;
      const flush = () => { docs.set(`saenggibuAct/${a.id}-${g}-${k}`, { a: a.id, g: +g, k, rows: chunk }); k++; chunk = []; bytes = 0; };
      for (const r of list){
        const sz = size(r);
        if (chunk.length && bytes + sz > partBytes) flush();
        chunk.push(r); bytes += sz;
      }
      if (chunk.length) flush();
      parts[g] = k;
    }
    return { ...a, parts };
  });
  const roster = {};
  for (const st of parsed.students) (roster[st.g + '-' + st.c] = roster[st.g + '-' + st.c] || []).push({ n: st.n, nm: st.nm });
  // 시트 차례(활동·창체 일정 섞어서) — 합친 것이면 sgbMerge 가 정한 것, 아니면 파일 안 차례
  const order = parsed.order || [...parsed.activities, ...parsed.schedules]
    .map((x, i) => [x.id, (x.pos ?? 999) + i / 1e4]).sort((p, q) => p[1] - q[1]).map(p => p[0]);
  return { docs, meta: { v: 1, activities, schedules: parsed.schedules, roster, order } };
}
</script>

const $ = id => document.getElementById(id);
const esc = v => v == null ? '' : String(v)

let META = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1600);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
  toast('복사했습니다');
}
const tagHtml = tags => (tags || []).map(t => `<span class="tag ${SGB_TAG_CLS[t] || ''}">${esc(SGB_TAGS[t] || t)}</span>`).join('');
// 활동명 칸이 다른 시트에서 복사돼 온 경우가 있다(학급 임원 시트에 '학생회 임원') —
// 활동명이 겹칠 때만 시트 이름을 붙여 가른다. 늘 붙이면 목록이 시끄럽다.
const titleHtml = a => {
  const dup = (META?.activities || []).filter(x => x.title === a.title).length > 1;
  return esc(a.title) + (dup && a.short ? ` <span class="d">[${esc(a.short)}]</span>` : '');
};
const roundTxt = a => (a.rounds || []).length ? a.rounds.join('·') + '차' : '';
const fmtAt = iso => { try { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } catch (e) { return ''; } };

// ── 읽기 ──
async function loadMeta(){
  const s = await getDoc(doc(fbDb, 'saenggibu', 'meta'));
  const next = s.exists() ? s.data() : null;
  const changed = !META || !next || META.at !== next.at;
  META = next;
  if (changed){ stuCache.clear(); actCache.clear(); }
  return changed;
  $('fileNote').textContent = META ? `${META.file || ''}${META.at ? ' · ' + fmtAt(META.at) + ' 올림' : ''}` : '';
}
async function loadStudent(key){
  if (stuCache.has(key)) return stuCache.get(key);
  const s = await getDoc(doc(fbDb, 'saenggibuStu', key));
  const d = s.exists() ? s.data() : null;
  stuCache.set(key, d);
  return d;
}
async function loadActGrade(a, g){
  const key = a.id + '-' + g;
  if (actCache.has(key)) return actCache.get(key);
  const n = (a.parts || {})[g] || 0, rows = [];
  for (let k = 0; k < n; k++){
    const s = await getDoc(doc(fbDb, 'saenggibuAct', `${a.id}-${g}-${k}`));
    if (s.exists()) rows.push(...(s.data().rows || []));
  }
  actCache.set(key, rows);
  return rows;
}

// ── 그리기 ──
function itemCard(a, it, { showWho = null } = {}){
  const self = it.s ? `<details><summary>${esc(a.self || '학생 글')}</summary><div class="txt">${esc(it.s)}</div></details>` : '';
  const ex = (it.x || []).map((v, j) => v ? `<dt>${esc((a.extra || [])[j] || '')}</dt><dd>${esc(v)}</dd>` : '').join('');
  const body = it.b ? `<div class="body">${esc(it.b)}</div>
    <div class="tools"><button type="button" class="btn" data-copy>복사</button><span>${it.b.length.toLocaleString()}자</span></div>` : '';
  const head = showWho
    ? `<div class="who"><span>${esc(showWho.g)}-${esc(showWho.c)}-${esc(showWho.n)}</span>${esc(showWho.nm)}</div>`
    : `<div class="card-h">${tagHtml(a.tags)}<span class="t">${titleHtml(a)}</span>
         <span class="d">${esc(a.dept)}${roundTxt(a) ? ' · ' + roundTxt(a) : ''}</span></div>
       ${a.area || a.path ? `<div class="where">${esc(a.area)}${a.path ? '<br>' + esc(a.path) : ''}</div>` : ''}`;
  return `<div class="card" data-b="${it.b ? esc(it.b) : ''}">${head}${body}${ex ? `<dl class="ex">${ex}</dl>` : ''}${self}</div>`;
}
function groupKey(a){ return (a.tags || []).join('|'); }
function groupRank(a){
  const t = a.tags || [];
  return (t.length ? SGB_TAG_ORDER.indexOf(t[0]) : 9) * 10 + t.length;
}

function classes(){
  return Object.keys(META?.roster || {}).sort((x, y) => { const [a1, b1] = x.split('-').map(Number), [a2, b2] = y.split('-').map(Number); return a1 - a2 || b1 - b2; });
}

async function renderStu(){
  const body = $('body');
  const cls = classes();
  const grades = [...new Set(cls.map(k => k.split('-')[0]))];
  if (!grades.includes(st.g)) st.g = grades[0] || '';
  const inG = cls.filter(k => k.split('-')[0] === st.g);
  if (!inG.includes(st.g + '-' + st.c)) st.c = inG[0] ? inG[0].split('-')[1] : '';
  const roster = (META.roster || {})[st.g + '-' + st.c] || [];
  if (!roster.some(r => String(r.n) === String(st.n))) st.n = '';
  save();
  body.innerHTML = `
    <div class="bar">
      <select id="selG" aria-label="학년">${grades.map(g => `<option value="${g}"${g === st.g ? ' selected' : ''}>${g}학년</option>`).join('')}</select>
      <select id="selC" aria-label="반">${inG.map(k => { const c = k.split('-')[1]; return `<option value="${c}"${c === st.c ? ' selected' : ''}>${c}반</option>`; }).join('')}</select>
      <input type="search" id="hakbun" placeholder="학번 (예: 30101)" inputmode="numeric" aria-label="학번으로 찾기">
    </div>
    <div class="stus" id="stus">${roster.map(r => `<button type="button" class="stu${String(r.n) === String(st.n) ? ' on' : ''}" data-n="${r.n}"><b>${r.n}</b>${esc(r.nm)}</button>`).join('')
      || '<div class="empty">이 반에는 올라온 자료가 없습니다.</div>'}</div>
    <div id="stuOut">${st.n ? '<div class="empty">불러오는 중…</div>' : '<div class="empty">학생을 고르세요.</div>'}</div>`;
  $('selG').onchange = e => { st.g = e.target.value; st.c = ''; st.n = ''; renderStu(); };
  $('selC').onchange = e => { st.c = e.target.value; st.n = ''; renderStu(); };
  $('hakbun').onkeydown = e => {
    if (e.key !== 'Enter') return;
    const m = e.target.value.trim().match(/^([1-3])(\d{2})(\d{2})$/);
    if (!m) { toast('학번 다섯 자리로 넣어 주세요'); return; }
    st.g = m[1]; st.c = String(+m[2]); st.n = String(+m[3]); renderStu();
  };
  $('stus').onclick = e => { const b = e.target.closest('.stu'); if (!b) return; st.n = b.dataset.n; renderStu(); };
  if (st.n) await renderStuOut();
}
async function renderStuOut(){
  const out = $('stuOut');
  const key = `${st.g}-${st.c}-${st.n}`;
  let d;
  try { d = await loadStudent(key); }
  catch (e) { out.innerHTML = `<div class="empty err">불러오지 못했습니다: ${esc(e.message || e)}</div>`; return; }
  if (key !== `${st.g}-${st.c}-${st.n}`) return;   // 그사이 다른 학생을 골랐다
  if (!d || !(d.items || []).length){ out.innerHTML = '<div class="empty">이 학생의 자료가 없습니다.</div>'; return; }
  const groups = new Map();
  for (const it of d.items){
    const a = actById(it.a);
    if (!a) continue;
    const k = groupKey(a);
    if (!groups.has(k)) groups.set(k, { a, list: [] });
    groups.get(k).list.push(it);
  }
  const ordered = [...groups.values()].sort((x, y) => groupRank(x.a) - groupRank(y.a));
  out.innerHTML = `<div class="who"><span>${esc(key)}</span>${esc(d.nm)} <small style="font-weight:600;color:var(--ink-soft);">· ${d.items.length}건</small></div>`
    + ordered.map(gr => `<div class="grp">${tagHtml(gr.a.tags)}<small>${gr.list.length}건</small></div>`
      + gr.list.map(it => itemCard(actById(it.a), it)).join('')).join('');
}

async function renderAct(){
  const body = $('body');
  const acts = [...(META.activities || [])].sort((x, y) => groupRank(x) - groupRank(y) || x.sheet.localeCompare(y.sheet, 'ko'));
  if (!acts.some(a => a.id === st.act)) st.act = acts[0]?.id || '';
  const q = (st.q || '').trim();
  const shown = acts.filter(a => !q || (a.title + a.dept + a.sheet).includes(q));
  const a = actById(st.act);
  const grades = a ? Object.keys(a.parts || {}).sort() : [];
  if (!grades.includes(st.ag)) st.ag = grades[0] || '';
  save();
  body.innerHTML = `<div class="two">
    <div>
      <div class="bar"><input type="search" id="actQ" placeholder="활동·부서 찾기" value="${esc(q)}" aria-label="활동 찾기"></div>
      <div class="acts" id="acts">${shown.map(x => `<button type="button" class="act${x.id === st.act ? ' on' : ''}" data-id="${x.id}">
        ${tagHtml(x.tags)}<span>${titleHtml(x)}</span><span class="n">${esc(x.dept)} · ${x.count}</span></button>`).join('')
        || '<div class="empty">맞는 활동이 없습니다.</div>'}</div>
    </div>
    <div id="actOut">${a ? '' : '<div class="empty">활동을 고르세요.</div>'}</div>
  </div>`;
  $('actQ').oninput = e => { st.q = e.target.value; const pos = e.target.selectionStart; renderAct().then(() => { const i = $('actQ'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (e2) {} }); };
  $('acts').onclick = e => { const b = e.target.closest('.act'); if (!b) return; st.act = b.dataset.id; st.ac = ''; renderAct(); };
  if (a) await renderActOut(a, grades);
}
async function renderActOut(a, grades){
  const out = $('actOut');
  const counts = Object.entries(a.byClass || {}).filter(([k]) => k.split('-')[0] === st.ag)
    .sort((x, y) => +x[0].split('-')[1] - +y[0].split('-')[1]);
  out.innerHTML = `<div class="card">
      <div class="card-h">${tagHtml(a.tags)}<span class="t">${titleHtml(a)}</span><span class="d">${esc(a.dept)}${roundTxt(a) ? ' · ' + roundTxt(a) : ''}</span></div>
      ${a.area || a.path ? `<div class="where">${esc(a.area)}${a.path ? '<br>' + esc(a.path) : ''}</div>` : ''}
      ${a.note ? `<details><summary>유의 사항</summary><div class="txt">${esc(a.note)}</div></details>` : ''}
      <div class="where" style="margin:6px 0 0;">시트: ${esc(a.sheet)}${a.file ? ' · 파일: ' + esc(a.file) : ''}</div>
    </div>
    <div class="bar">
      <select id="selAG" aria-label="학년">${grades.map(g => `<option value="${g}"${g === st.ag ? ' selected' : ''}>${g}학년</option>`).join('')}</select>
      <select id="selAC" aria-label="반"><option value="">전체 반</option>${counts.map(([k]) => { const c = k.split('-')[1]; return `<option value="${c}"${c === st.ac ? ' selected' : ''}>${c}반</option>`; }).join('')}</select>
    </div>
    <div class="counts">${counts.map(([k, n]) => `<span>${esc(k.split('-')[1])}반 ${n}</span>`).join('')}</div>
    <div id="actRows"><div class="empty">불러오는 중…</div></div>`;
  $('selAG').onchange = e => { st.ag = e.target.value; st.ac = ''; save(); renderActOut(a, grades); };
  $('selAC').onchange = e => { st.ac = e.target.value; save(); drawRows(); };
  let rows;
  try { rows = await loadActGrade(a, st.ag); }
  catch (e) { $('actRows').innerHTML = `<div class="empty err">불러오지 못했습니다: ${esc(e.message || e)}</div>`; return; }
  function drawRows(){
    const list = rows.filter(r => !st.ac || String(r.c) === st.ac).sort((x, y) => x.c - y.c || x.n - y.n);
    $('actRows').innerHTML = list.map(r => itemCard(a, r, { showWho: r })).join('') || '<div class="empty">이 반에는 없습니다.</div>';
  }
  drawRows();
}

function renderSch(){
  const body = $('body');
  const list = [...(META.schedules || [])].sort((x, y) => x.grade - y.grade);
  if (!list.length){ body.innerHTML = '<div class="empty">창체 일정 시트가 없습니다.</div>'; return; }
  if (!list.some(s => s.id === st.sg)) st.sg = list[0].id;
  save();
  const s = list.find(x => x.id === st.sg);
  body.innerHTML = `<div class="bar"><div class="views" id="schTabs">${list.map(x =>
      `<button type="button" data-id="${x.id}" class="${x.id === st.sg ? 'on' : ''}">${x.grade ? x.grade + '학년' : esc(x.title)}</button>`).join('')}</div></div>
    <div class="card"><div class="card-h">${tagHtml(s.tags)}<span class="t">${esc(s.title)}</span><span class="d">${esc(s.dept)}</span></div>
      ${s.area || s.path ? `<div class="where">${esc(s.area)}</div>` : ''}
      ${s.path ? `<details><summary>입력 경로·안내</summary><div class="txt">${esc(s.path)}</div></details>` : ''}
      ${s.note ? `<details><summary>유의 사항</summary><div class="txt">${esc(s.note)}</div></details>` : ''}
    </div>
    <div class="tblwrap"><table><thead><tr>${(s.cols || []).map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${(s.rows || []).filter(r => (r.v || []).some(Boolean)).map(r => `<tr>${(r.v || []).map(v => `<td${v.length > 14 ? ' class="long"' : ''}>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  $('schTabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.sg = b.dataset.id; renderSch(); };
}

async function render(){
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === st.view));
  if (!META){
    $('body').innerHTML = `<div class="empty">아직 올라온 자료가 없습니다.${isAdmin() ? '<br>위의 「📤 엑셀 올리기」로 통합 엑셀을 올려 주세요.' : ''}</div>`;
    return;
  }
  if (st.view === 'act') return renderAct();
  if (st.view === 'sch') return renderSch();
  return renderStu();
}
$('views').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.view = b.dataset.view; save(); render(); };
document.body.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b) copyText(b.closest('.card').dataset.b);
});

// ── 올리기 (관리자) ──
const isAdmin = () => fbAuth.currentUser?.email === ADMIN_EMAIL;
function loadScript(src){
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => { s.remove(); no(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function loadExcelJS(){
  for (const src of EXCELJS_SRC){
    if (window.ExcelJS) break;
    try { await loadScript(src); } catch (e) {}
  }
  if (!window.ExcelJS) throw new Error('서식 도구(ExcelJS)를 못 받았습니다');
  return window.ExcelJS;
}
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = XLSX_SRC; s.onload = () => ok(window.XLSX); s.onerror = () => no(new Error('엑셀 읽기 도구를 못 받았습니다'));
    document.head.appendChild(s);
  });
}
let _pending = null;
$('upBtn').onclick = () => $('upFile').click();

const kindTxt = k => k === 'sch' ? '창체 일정' : '';
const cntOf = x => x ? (x.count ?? (x.rows || []).filter(r => (r.v || []).some(Boolean)).length) : 0;
function upItem(x, extra = ''){
  return `<div>${tagHtml(x.tags)} ${kindTxt(x.kind) ? `<span class="d">[${kindTxt(x.kind)}]</span> ` : ''}${esc(x.title)}
    <span style="color:var(--ink-soft)">· ${esc(x.dept)} · ${extra || cntOf(x) + '건'} · ${esc(x.sheet)}</span></div>`;
}
$('upFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const p = $('upPanel'); p.style.display = 'block'; p.innerHTML = '읽는 중…';
  try {
    const XLSX = await loadXlsx();
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const parsed = sgbParseBook(sgbBookToSheets(XLSX, wb));
    // 원본 양식 — 못 읽어도 올리기는 된다(내려받을 때 그 시트만 단순한 틀)
    const forms = {};
    let formErr = '';
    try {
      p.innerHTML = '서식 읽는 중…';
      const EJ = await loadExcelJS();
      const ewb = new EJ.Workbook();
      await ewb.xlsx.load(buf);
      for (const [kind, list] of [['act', parsed.activities], ['sch', parsed.schedules]]) for (const a of list){
        const ws = ewb.getWorksheet(a.sheet);
        const fm = ws ? sgbFormOf(ws, a, kind) : null;
        if (fm) forms[a.id] = fm;
      }
    } catch (err) { formErr = err.message || String(err); }
    // 어느 파일에서 온 시트인지 남긴다(여러 파일을 더해 가며 올릴 수 있다). 지문에는 안 넣는다.
    [...parsed.activities, ...parsed.schedules].forEach(a => { a.file = f.name; });
    // 맞대 볼 기준은 지금 올라가 있는 목록 — 화면이 들고 있는 것 말고 새로 읽는다
    const oldMeta = (await getDoc(doc(fbDb, 'saenggibu', 'meta'))).data() || null;
    const cmp = sgbCompare(oldMeta, parsed);
    const tagKind = (list, side) => list.map(x => ({ ...x[side], kind: x.kind }));
    _pending = { parsed, cmp, file: f.name, forms };
    const nForms = Object.keys(forms).length, nAll = parsed.activities.length + parsed.schedules.length;
    p.innerHTML = `<h3>${esc(f.name)}</h3>
      <ul>
        <li>이 파일: 활동 시트 <b>${parsed.activities.length}</b>개 · 창체 일정 <b>${parsed.schedules.length}</b>개 · 학생 <b>${parsed.students.length}</b>명 · 기재 <b>${parsed.activities.reduce((n, a) => n + a.count, 0).toLocaleString()}</b>건</li>
        <li>${formErr ? `<span class="err">서식을 못 읽었습니다(${esc(formErr)}) — 자료는 올라가고, 내려받을 때 단순한 표로 나옵니다.</span>`
          : `원본 양식 ${nForms}/${nAll}개 시트 함께 저장 (내려받을 때 그 틀에 채웁니다)`}</li>
        ${parsed.skipped.length ? `<li>건너뛴 시트: ${parsed.skipped.map(x => `${esc(x.name)} <span style="color:var(--ink-soft)">(${esc(x.why)})</span>`).join(', ')}</li>` : ''}
      </ul>
      ${cmp.added.length ? `<div class="sec" id="upAdded"><b>새로 추가 ${cmp.added.length}</b>
        <div class="acts-sum">${tagKind(cmp.added, 'cur').map(x => upItem(x)).join('')}</div></div>` : ''}
      ${cmp.changed.length ? `<div class="sec" id="upChanged"><b>내용이 바뀜 ${cmp.changed.length}</b> <span style="color:var(--ink-soft)">— 이 파일 것으로 바꿉니다</span>
        <div class="acts-sum">${cmp.changed.map(x => upItem({ ...x.cur, kind: x.kind }, `${cntOf(x.old)}건 → ${cntOf(x.cur)}건`)).join('')}</div></div>` : ''}
      ${cmp.same.length ? `<div class="sec" style="color:var(--ink-soft)">그대로 ${cmp.same.length}</div>` : ''}
      ${cmp.missing.length ? `<div class="sec miss" id="upMissing"><b>이 파일에 없는 기존 자료 ${cmp.missing.length}</b>
          <span style="color:var(--ink-soft)">— 하나씩 남길지 지울지 고르세요</span>
          <div class="row"><button type="button" class="btn" id="missKeepAll">모두 남기기 (더하기)</button>
            <button type="button" class="btn" id="missDelAll">모두 지우기 (합본으로 바꾸기)</button></div>
          <div class="acts-sum">${cmp.missing.map(x => `<label class="miss-row">
              <select data-miss="${x.kind}:${esc(x.old.id)}" aria-label="${esc(x.old.title)} 남길지 지울지">
                <option value="keep">남기기</option><option value="del">지우기</option></select>
              ${upItem({ ...x.old, kind: x.kind })}</label>`).join('')}</div>
        </div>` : ''}
      ${!cmp.added.length && !cmp.changed.length && !cmp.missing.length ? '<div class="sec">올라가 있는 것과 같습니다 — 바뀌는 것이 없습니다.</div>' : ''}
      <div class="row"><button type="button" class="btn pri" id="upGo">올리기</button>
        <button type="button" class="btn" id="upCancel">취소</button><span id="upMsg"></span></div>`;
    const setAll = v => p.querySelectorAll('select[data-miss]').forEach(sel => { sel.value = v; });
    if ($('missKeepAll')) $('missKeepAll').onclick = () => setAll('keep');
    if ($('missDelAll')) $('missDelAll').onclick = () => setAll('del');
    $('upCancel').onclick = () => { _pending = null; p.style.display = 'none'; };
    $('upGo').onclick = doUpload;
  } catch (err) {
    p.innerHTML = `<span class="err">읽지 못했습니다: ${esc(err.message || err)}</span> <button type="button" class="btn" onclick="this.parentNode.style.display='none'">닫기</button>`;
  }
};

// ── 엑셀로 받기 (관리자) ── 활동 문서를 전부 읽어(조각 수만큼) 원본 양식에 채워 한 파일로
async function buildWorkbook(EJ, plan){
  const wb = new EJ.Workbook();
  wb.creator = '영남고 교사 대시보드';
  for (const sh of plan){
    const f = sh.form;
    const props = {};
    if (f.tab) props.tabColor = f.tab;                     // 아래 시트 탭 색
    if (f.defH) props.defaultRowHeight = f.defH;
    const ws = wb.addWorksheet(sh.name, { views: f.views || [], pageSetup: f.page || {}, properties: props,
      ...(f.hf ? { headerFooter: f.hf } : {}) });
    (f.cols || []).forEach((c, i) => {
      if (!i || !c) return;
      const col = ws.getColumn(i);
      if (c.w) col.width = c.w;
      if (c.hidden || c.w === 0) col.hidden = true;
    });
    for (const row of f.rows || []){
      const R = ws.getRow(row.r);
      if (row.ht) R.height = row.ht;
      for (const cell of row.cells || []){
        const C = R.getCell(cell.c);
        if (cell.t !== '') C.value = cell.t;
        if (cell.s) C.style = sgbClone(cell.s);
      }
    }
    for (const m of f.merges || []) { try { ws.mergeCells(m); } catch (e) {} }
    sh.rows.forEach((vals, i) => {
      const R = ws.getRow(f.h + 1 + i);
      R.height = (sh.heights || [])[i] || sgbRowHeight(f, vals);   // 원본에 있던 줄은 원본 높이
      for (let col = 1; col < vals.length; col++){
        if (!(f.roles || [])[col] && !(f.data || [])[col]) continue;
        const C = R.getCell(col);
        if (vals[col] !== '' && vals[col] != null) C.value = sgbTyped(f, col, vals[col]);
        C.style = sgbDataStyle(f, col);
      }
    });
  }
  return wb.xlsx.writeBuffer();
}
$('dlBtn').onclick = async () => {
  const btn = $('dlBtn');
  if (!META){ toast('올라온 자료가 없습니다'); return; }
  btn.disabled = true;
  const label = btn.textContent;
  try {
    await loadMeta();
    const EJ = await loadExcelJS();
    const rowsById = {}, forms = {};
    const all = [...(META.activities || []), ...(META.schedules || [])];
    for (let i = 0; i < all.length; i++){
      const a = all[i];
      btn.textContent = `📥 모으는 중… ${i + 1}/${all.length}`;
      if ((META.activities || []).includes(a)) rowsById[a.id] = await loadAllRows(a);
      const fm = await getDoc(doc(fbDb, 'saenggibu', `fmt-${a.id}`));
      if (fm.exists()) forms[a.id] = fm.data();
    }
    btn.textContent = '📥 만드는 중…';
    const buf = await buildWorkbook(EJ, sgbExportPlan(META, rowsById, forms));
    const d = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const link = document.createElement('a');
    link.href = url; link.download = `생기부 보조자료_${d}.xlsx`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('엑셀 파일을 만들었습니다');
  } catch (err) {
    toast('만들지 못했습니다: ' + (err.message || err));
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
};

// 남기기로 한 옛 활동의 줄을 저장된 조각에서 모은다. 하나라도 못 읽으면 멈춘다 —
// 그대로 올리면 그 활동이 조용히 비어 버린다.
async function loadAllRows(a){
  const rows = [];
  for (const [g, n] of Object.entries(a.parts || {})) for (let k = 0; k < n; k++){
    const snap = await getDoc(doc(fbDb, 'saenggibuAct', `${a.id}-${g}-${k}`));
    if (!snap.exists()) throw new Error(`남길 자료(${a.title})의 일부를 못 읽었습니다`);
    rows.push(...(snap.data().rows || []));
  }
  return rows;
}

// 이 파일 + 남기기로 한 옛 자료를 합쳐 다시 짠 뒤, 바뀐 문서만 쓰고 이제 없는 문서는 지운다.
// 무엇을 썼는지는 saenggibu/manifest 에 문서마다 지문으로 남긴다.
async function doUpload(){
  if (!_pending) return;
  const { parsed, cmp, file, forms } = _pending;
  const msg = $('upMsg'), go = $('upGo');
  go.disabled = true;
  try {
    const pick = {};
    $('upPanel').querySelectorAll('select[data-miss]').forEach(sel => { pick[sel.dataset.miss] = sel.value; });
    const keep = cmp.missing.filter(x => pick[x.kind + ':' + x.old.id] !== 'del');
    msg.textContent = keep.some(x => x.kind === 'act') ? '남길 자료 읽는 중…' : '이전 기록 확인 중…';
    const keepActs = [];
    for (const x of keep.filter(x => x.kind === 'act')) keepActs.push({ a: x.old, rows: await loadAllRows(x.old) });
    const order = cmp.old?.order || [...(cmp.old?.activities || []), ...(cmp.old?.schedules || [])].map(a => a.id);
    const merged = sgbMerge(parsed, keepActs, keep.filter(x => x.kind === 'sch').map(x => x.old), order);
    const built = sgbBuildDocs(merged);
    // 양식 문서 — 이번 파일 시트는 새로 뜬 것, 남긴 시트는 저장돼 있던 것을 그대로(안 넣으면 지워진다)
    for (const [id, fm] of Object.entries(forms || {})) built.docs.set(`saenggibu/fmt-${id}`, fm);
    for (const x of keep){
      const snap = await getDoc(doc(fbDb, 'saenggibu', `fmt-${x.old.id}`));
      if (snap.exists()) built.docs.set(`saenggibu/fmt-${x.old.id}`, snap.data());
    }
    const metaBytes = new TextEncoder().encode(JSON.stringify(built.meta)).length;
    if (metaBytes > 900000) throw new Error(`목록 문서가 너무 큽니다(${Math.round(metaBytes / 1024)}KB) — 나눠 저장하도록 고쳐야 합니다`);
    const old = (await getDoc(doc(fbDb, 'saenggibu', 'manifest'))).data()?.h || {};
    const now = {};
    const writes = [];
    for (const [path, data] of built.docs){
      const json = JSON.stringify(data);
      const key = path.replace('/', ':');
      now[key] = sgbHash(json) + '.' + json.length;
      if (old[key] !== now[key]) writes.push([path, data, json.length]);
    }
    const dels = Object.keys(old).filter(k => !(k in now));
    let done = 0, batch = writeBatch(fbDb), ops = 0, bytes = 0;
    const flush = async () => { if (!ops) return; await batch.commit(); batch = writeBatch(fbDb); ops = 0; bytes = 0; };
    for (const [path, data, len] of writes){
      if (ops >= 200 || bytes + len > 3000000) await flush();
      const [c, id] = path.split('/');
      batch.set(doc(fbDb, c, id), data); ops++; bytes += len; done++;
      if (done % 50 === 0) msg.textContent = `쓰는 중… ${done}/${writes.length}`;
    }
    for (const k of dels){
      if (ops >= 200) await flush();
      const [c, id] = k.split(':');
      batch.delete(doc(fbDb, c, id)); ops++;
    }
    await flush();
    msg.textContent = '목록 저장 중…';
    await setDoc(doc(fbDb, 'saenggibu', 'meta'), { ...built.meta, file, at: new Date().toISOString(), by: fbAuth.currentUser.email });
    await setDoc(doc(fbDb, 'saenggibu', 'manifest'), { h: now });
    _pending = null;
    const removed = cmp.missing.length - keep.length;
    $('upPanel').innerHTML = `✅ 올렸습니다 — 추가 ${cmp.added.length} · 바뀜 ${cmp.changed.length} · 남김 ${keep.length} · 지움 ${removed}
      <span style="color:var(--ink-soft)">(문서 ${writes.length}개 쓰고 ${dels.length}개 지움)</span>
      <button type="button" class="btn" onclick="this.parentNode.style.display='none'">닫기</button>`;
    await loadMeta();
    render();
  } catch (err) {
    msg.innerHTML = `<span class="err">실패: ${esc(err.message || err)}</span>`;
    go.disabled = false;
  }
}

// ── 시작 ──
$('loginBtn').onclick = () => signInWithPopup(fbAuth, new GoogleAuthProvider())
  .catch(e => { $('gateErr').textContent = e.message || String(e); });
onAuthStateChanged(fbAuth, async user => {
  const gate = $('gate');
  if (!user){ gate.style.display = 'flex'; return; }
  if (!/@yeungnam\.hs\.kr$/.test(user.email || '') || /^\d{7}@/.test(user.email || '')){
    $('gateErr').textContent = '학교 교사 계정이 아닙니다.\n현재: ' + (user.email || '알 수 없음');
    gate.style.display = 'flex';
    return;
  }
  gate.style.display = 'none';
  $('upBtn').style.display = isAdmin() ? '' : 'none';
  // 전교생 문안이 한 파일에 담긴다 — 받기는 지금은 관리자만
  $('dlBtn').style.display = isAdmin() ? '' : 'none';
  try { await loadMeta(); }
  catch (e) { $('body').innerHTML = `<div class="empty err">불러오지 못했습니다: ${esc(e.message || e)}</div>`; return; }
  render();
});
// 앱이 탭에 다시 들어올 때 보내는 신호 — 그사이 새로 올라왔을 수 있다
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.type !== 'sgb-refresh' || !fbAuth.currentUser) return;
  loadMeta().then(changed => { if (changed) render(); }).catch(() => {});
});
