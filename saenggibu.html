<!-- 엑셀 → 자료. 순수 함수만 둔다(XLSX·Firebase 없이 시트 이름·숨김 여부·행 배열만 받는다).
     tests/saenggibu.test.mjs 가 이 블록을 그대로 떼어 돌린다. -->
<script id="sgbParser">
// 시트 이름 앞 꼬리표 — 엑셀이 쓰는 약속: <자> 자율, <진> 진로, <개> 개인별, <누> 누가기록,
// <행> 행동특성 및 종합의견, <동> 동아리, <자or진> 둘 중 고름. 꼬리표가 없으면 ⊙ 입력 영역 칸으로 알아낸다(sgbAreaTags)
const SGB_TAGS = { '자':'자율', '동':'동아리', '진':'진로', '개':'개인별', '누':'누가기록', '행':'행특' };
const SGB_TAG_CLS = { '자':'ja', '동':'dong', '진':'jin', '개':'gae', '누':'nu', '행':'haeng' };
const SGB_TAG_ORDER = ['자','동','진','개','누','행'];
// 한 문서에 담을 크기(바이트). Firestore 한도는 1MiB — 여유를 두고 자른다.
const SGB_PART_BYTES = 600000;

function sgbNorm(v){ return String(v ?? '').replace(/\s+/g, ''); }
function sgbText(v){ return String(v ?? '').replace(/\r\n?/g, '\n').replace(/[ \t\u00a0]+\n/g, '\n').trim(); }
// 짧은 지문(FNV-1a). 시트 이름 → 활동 id, 문서 내용 → 바뀌었는지
function sgbHash(s){
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}

// '<자or진>과중(로봇공학)-2차' → 꼬리표 [자,진], 차수 [2], 괄호 속 이름, 앞쪽 부서 줄임말
function sgbSheetInfo(name){
  const m = String(name).match(/^\s*<([^>]+)>\s*(.*)$/);
  if (!m) return null;
  return { tags: m[1].split(/or/i).map(s => s.trim()).filter(Boolean), ...sgbNameInfo(m[2]) };
}
// 꼬리표 뒤 이름 — 차수·괄호 속 짧은 이름·부서 약칭
function sgbNameInfo(rest0){
  const rest = String(rest0 ?? '').trim();
  // 괄호 안의 숫자(예: '수학대중화강연 1,2차')는 차수가 아니다
  const rounds = [...rest.replace(/\([^)]*\)/g, '').matchAll(/(\d+)\s*차/g)].map(x => +x[1]);
  const paren = rest.match(/\(([^)]*)\)/);
  return { rest, rounds, short: paren ? paren[1].trim() : rest, deptAbbr: rest.split('(')[0].replace(/-\d+차.*$/, '').trim() };
}
// 나이스 바이트 — 한글 3, 영문·숫자·공백·문장부호 1, 줄바꿈(엔터) 1(선생님이 나이스에서 확인 2026-10-29 — 처음엔 2 로 셌다).
// 그 밖의 비 ASCII(·, ○ 등)도 넉넉히 3. 윈도에서 붙여 넣은 줄바꿈(\r\n)도 엔터 하나
function sgbNeisBytes(s){
  let n = 0;
  for (const ch of String(s ?? '').replace(/\r\n?/g, '\n')){ const c = ch.codePointAt(0); n += c < 0x80 ? 1 : c < 0x10000 ? 3 : 4; }
  return n;
}
// 두 글의 차이 — 글자 단위(공통 앞뒤를 떼고 가운데만 LCS). [[0 같음 | -1 지움 | 1 넣음, 글], …].
// 맞춤법 검사기에서 고친 글을 붙여 넣을 때 바뀐 곳을 보여 준다. 띄어쓰기만 바뀐 곳은 그대로 두고(할∨수∨있다),
// 글자가 바뀐 곳 사이에 낀 한두 글자는 한 덩어리로 묶어 읽기 쉽게(되서 → 돼서)
function sgbDiff(a, b){
  a = [...String(a ?? '')]; b = [...String(b ?? '')];
  let s = 0; while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let e = 0; while (e < a.length - s && e < b.length - s && a[a.length - 1 - e] === b[b.length - 1 - e]) e++;
  const A = a.slice(s, a.length - e), B = b.slice(s, b.length - e), n = A.length, m = B.length;
  let ops = [];
  const push = (op, t) => { if (!t) return; const l = ops[ops.length - 1]; if (l && l[0] === op) l[1] += t; else ops.push([op, t]); };
  push(0, a.slice(0, s).join(''));
  if (n * m > 4e6){ push(-1, A.join('')); push(1, B.join('')); }      // 통째로 다른 글 — 비교하지 않는다
  else {
    const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m){
      if (A[i] === B[j]){ push(0, A[i]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) push(-1, A[i++]);
      else push(1, B[j++]);
    }
    push(-1, A.slice(i).join('')); push(1, B.slice(j).join(''));
  }
  push(0, a.slice(a.length - e).join(''));
  // 묶기 — 글자가 바뀐 덩어리 사이에 낀 한두 글자(공백 아닌)는 지움+넣음으로 합친다
  const word = t => /\S/.test(t);
  for (let k = 1; k < ops.length - 1; k++){
    const [op, t] = ops[k], l = ops[k - 1], r = ops[k + 1];
    if (op !== 0 || [...t].length > 2 || /\s/.test(t) || !l[0] || !r[0] || !word(l[1]) || !word(r[1])) continue;
    ops[k] = [-1, t]; ops.splice(k + 1, 0, [1, t]);
  }
  // 같은 종류끼리 잇고, 한 덩어리 안에서는 지움을 넣음보다 앞에
  const out = [];
  for (let k = 0; k < ops.length;){
    if (ops[k][0] === 0){ out.push(ops[k]); k++; continue; }
    let del = '', ins = '';
    while (k < ops.length && ops[k][0] !== 0){ if (ops[k][0] < 0) del += ops[k][1]; else ins += ops[k][1]; k++; }
    if (del) out.push([-1, del]); if (ins) out.push([1, ins]);
  }
  return out;
}
// 보조자료 문안이 작성 글에 얼마나 들어갔나(0~1) — 「→ 자율」 로 붙였든, 복사해 붙여 넣고 고쳤든.
// 문장마다(공백을 빼고 6자 이상, 다 짧으면 통째로) 세 글자 조각의 60% 이상이 작성 글에 있으면 들어간 문장, 문장 길이로 가중해 합친다.
// 맞춰 본 값(2026-10-29): 그대로 1 · 낱말 몇 개 고침 1 · 반만 0.47 · 요약해 다시 씀 0 · 다른 글 0
let sgbTriLast = ['', null];                  // 같은 작성 글로 카드 여러 장을 잴 때 조각표를 한 번만 만든다
function sgbUsed(src, draft){
  const clean = t => String(t ?? '').replace(/\s+/g, '');
  let sents = String(src ?? '').replace(/([.!?。])/g, '$1\n').split(/\n+/).map(clean).filter(s => s.length >= 6);
  if (!sents.length){ const w = clean(src); if (w.length >= 4) sents = [w]; }
  const D = clean(draft);
  if (!sents.length || D.length < 3) return 0;
  if (sgbTriLast[0] !== D){
    const m = new Map();
    for (let i = 0; i + 3 <= D.length; i++){ const g = D.slice(i, i + 3); m.set(g, (m.get(g) || 0) + 1); }
    sgbTriLast = [D, m];
  }
  const tri = sgbTriLast[1];
  let used = 0, total = 0;
  for (const s of sents){
    const seen = new Map(); let hit = 0, n = 0;
    for (let i = 0; i + 3 <= s.length; i++){ const g = s.slice(i, i + 3), c = seen.get(g) || 0; n++; if (c < (tri.get(g) || 0)) hit++; seen.set(g, c + 1); }
    total += s.length; if (n && hit / n >= .6) used += s.length;
  }
  return total ? used / total : 0;
}
// 영역별 나이스 한도(바이트) — 기재요령의 글자 수 × 3. 영역이 하나로 정해질 때만(<자or진>·누가기록은 없음).
// 진로는 2026학년도부터 700자 → 500자(1500바이트)
const SGB_NEIS_LIMIT = { '자': 1500, '동': 1500, '진': 1500, '개': 1500, '행': 1500 };
const sgbNeisLimit = tags => (tags || []).length === 1 ? SGB_NEIS_LIMIT[tags[0]] ?? null : null;
// ⊙ 입력 영역 칸 → 꼬리표. 꼬리표를 빼먹은 시트를 읽을 때 쓴다. 모르면 [] (그 시트는 건너뛴다)
function sgbAreaTags(area){
  const s = sgbNorm(area);
  if (!s) return [];
  if (/누가|봉사/.test(s)) return ['누'];
  if (/행동특성|행특|종합의견/.test(s)) return ['행'];
  const t = [];
  if (/자율|자치/.test(s)) t.push('자');
  if (/동아리/.test(s)) t.push('동');
  if (/진로/.test(s)) t.push('진');
  if (/세부능력|세특|개인별/.test(s)) t.push('개');
  return t;
}

// ── 활동을 알아보는 이름 ── 시트 이름에서 꼬리표와 맨 끝의 배포 차수·(수정)을 뗀다. 다시 올릴 때
// 같은 활동인지 이걸로 맞대 본다(id 는 시트 이름 그대로 — 저장된 문서 이름이 바뀌지 않게).
// 배포 차수는 합본을 나눠 줄 때 '뭐가 새로 들어왔나' 를 알아보려고 붙이던 것이라, 붙든 안 붙든 같은 활동이다.
// 꼬리표를 고쳐 낸 판(<자> → <자or진>)도 같은 활동. 괄호 안의 차수는 활동 회차라 남긴다:
// '<자>수학과(강연(1차))-3차' → 수학과(강연(1차)).
function sgbActKey(name){
  let s = String(name ?? '').replace(/^\s*<[^>]*>\s*/, '');
  for (let prev = null; prev !== s; ){
    prev = s;
    s = s.replace(/\s*[-_]\s*\d+\s*차\s*$/, '').replace(/\s*[(（]\s*(?:수정|최종|추가|보완|재배포)\s*[)）]\s*$/, '');
  }
  return sgbNorm(s);
}
// 맞대 볼 열쇠 — 같은 목록 안에서 열쇠가 겹치면(괄호 없이 회차를 쓴 '강연-1차'·'강연-2차', 꼬리표만 다른 두 시트)
// 하나로 묶을 수 없으니 그 시트들은 시트 이름 그대로 쓴다('=' 를 붙여 차수 뗀 열쇠와 섞이지 않게).
function sgbMatchKeys(list){
  const keyOf = a => a.key || sgbActKey(a.sheet);
  const n = new Map();
  for (const a of list || []) n.set(keyOf(a), (n.get(keyOf(a)) || 0) + 1);
  return (list || []).map(a => n.get(keyOf(a)) > 1 ? '=' + sgbNorm(a.sheet) : keyOf(a));
}

// 머리 줄 위의 안내: '⊙ 활  동  명:' 칸의 오른쪽 첫 값. 같은 줄 왼쪽의 '⊙' 없는 첫 칸은 부서.
// (수학과 시트는 A열에 '00⊙ 활 동 명:' 이 한 번 더 있다 — 그래서 '마지막' ⊙ 칸을 본다)
function sgbHead(rows, h){
  const out = {};
  for (let i = 0; i < h; i++){
    const r = rows[i] || [];
    let last = -1;
    for (let j = 0; j < r.length; j++) if (String(r[j] ?? '').includes('⊙')) last = j;
    if (last < 0) continue;
    const key = sgbInfoKey(sgbNorm(r[last]).replace(/^[^⊙]*⊙/, '').replace(/[:：]$/, ''));
    let val = '';
    for (let j = last + 1; j < r.length; j++){ const t = sgbText(r[j]); if (t){ val = t; break; } }
    if (key && !(key in out)) out[key] = val;
    if (!out._dept) for (let j = 0; j < last; j++){
      const t = sgbText(r[j]);
      if (t && !t.includes('⊙')){ out._dept = t; break; }
    }
  }
  return out;
}

// ── 머리 칸 이름 ── 행·열 자리가 아니라 칸 이름으로 찾는다. 부서마다 양식을 조금씩 바꿔 내므로
// (띄어쓰기·괄호·다른 낱말) 같은 뜻의 이름을 한 표에 모은다. 해석·양식 뜨기·내려받기가 모두 이 표를 쓴다 —
// 따로 적어 두면 한쪽만 고쳐져 '읽기는 되는데 받으면 빈 칸' 같은 어긋남이 생긴다.
const SGB_COLS = {
  g:   ['학년'],
  c:   ['반', '학급'],
  n:   ['번호', '번', '출석번호'],
  nm:  ['성명', '이름', '학생명', '학생이름', '학생성명'],
  seq: ['순번', '연번'],
  key: ['학년반번호', '학번'],
};
// 기재 문안 칸·학생 글 칸 — 이 낱말이 들어 있으면. '내용' 하나로는 안 된다(봉사활동내용·활동 내용은 기타 칸).
// 앞에 있을수록 센 이름 — 여러 칸이 맞으면 센 쪽을 고른다('진로 특기사항 메모 | 기재 내용' 이면 기재 내용)
const SGB_BODY_WORDS = ['기재내용', '기재문안', '기재예시', '입력내용', '특기사항', '문안', '세특'];
const SGB_SELF_WORDS = ['평가서', '보고서', '소감문', '자기평가', '활동소감'];
// ⊙ 안내 칸 — 같은 뜻의 다른 이름
const SGB_INFO = {
  활동명:   ['활동명', '활동이름', '활동제목', '활동주제', '프로그램명'],
  입력영역: ['입력영역', '기재영역', '입력항목', '기재항목', '영역'],
  입력경로: ['입력경로', '기재경로', '입력위치', '기재위치', '경로'],
  유의사항: ['유의사항', '주의사항', '유의점', '참고사항', '안내사항', '기재유의사항'],
};
const SGB_HEAD_ROWS = 40;          // 안내 줄이 늘어도 이 안에서 머리 줄을 찾는다
// 괄호 속은 덧붙임으로 보고 뗀다: '번호(출석)' → 번호, '유의사항(필독)' → 유의사항
const sgbBare = h => sgbNorm(h).replace(/[(（\[［][^)）\]］]*[)）\]］]/g, '');
// 머리 칸 → g·c·n·nm·seq·key 또는 ''
function sgbColKey(h){
  const k = sgbBare(h);
  for (const [key, names] of Object.entries(SGB_COLS)) if (names.includes(k)) return key;
  return '';
}
function sgbInfoKey(k){
  const b = sgbBare(k);
  for (const [key, names] of Object.entries(SGB_INFO)) if (names.includes(b)) return key;
  return k;
}
// 칸 이름(sgbNorm) 줄이 머리 줄인가 — 'student' · 'schedule' · ''
function sgbHeadKind(s){
  const keys = s.map(sgbColKey);
  if (keys.includes('g') && keys.includes('c') && keys.includes('n')) return 'student';
  if (s.includes('월') && s.includes('일') && (s.includes('교시') || s.some(x => x.includes('활동내용')))) return 'schedule';
  return '';
}
function sgbFindHeader(rows){
  for (let i = 0; i < Math.min(rows.length, SGB_HEAD_ROWS); i++){
    const s = (rows[i] || []).map(sgbNorm);
    const kind = sgbHeadKind(s);
    if (kind) return { i, kind, s };
  }
  return null;
}
// 두 줄 머리를 한 줄로. 병합된 칸은 으뜸 칸(위·왼쪽)에만 값이 있어, 그대로 두면 이름 없는 칸으로 버려진다.
//  - 위 줄이 묶음 이름 줄(예: '학적' 이 학년·반·번호 위에 병합)이면, 머리 줄의 빈 칸은 위 줄 이름을 빌린다
//    (두 줄에 걸쳐 세로로 병합된 '기재 내용' 은 위 줄에만 글자가 있다)
//  - 아래 줄이 갈래 이름 줄(예: '활동 정보' 아래 '장소'·'시간')이면 갈래 이름으로 — 학년·반·번호·성명 같은
//    칸 이름과 기재 문안·학생 글 칸은 그대로 둔다
// 묶음·갈래 줄로 보려면: ⊙ 안내 줄이 아니고, 글자 칸 하나라도 머리 줄의 이름 있는 칸과 겹쳐야 한다
// (머리 바로 위 '※ 500자 이내' 같은 메모 한 칸을 칸 이름으로 착각하지 않게). 갈래 줄은 거기에 더해
// 학생 줄이 아니고(학년·반·번호가 숫자 아님), 이름 없는 칸을 채우는 글자가 있어야 한다(머리 아래 예시 줄 거름).
// 돌려줌: { labels, sub } — sub: 갈래 줄을 썼으면 true(그 줄까지가 머리)
function sgbHeadLabels(up, top, dn){
  const txt = r => (r || []).map(v => sgbText(v));
  const T = txt(top), U = txt(up), D = txt(dn);
  const labels = Array.from({ length: Math.max(T.length, U.length, D.length) }, (_, j) => T[j] || '');
  const sun = r => (r || []).some(v => String(v ?? '').includes('⊙'));
  const overlaps = X => X.some((t, j) => t && labels[j]);
  if (up && !sun(up) && overlaps(U)) U.forEach((t, j) => { if (t && !labels[j]) labels[j] = t; });
  let sub = false;
  if (dn && !sun(dn)){
    const keys = labels.map(sgbColKey);
    const num = k => { const j = keys.indexOf(k); return j >= 0 && parseInt(D[j], 10) >= 1; };   // 해석과 같은 잣대
    if (!num('g') && !num('c') && !num('n') && overlaps(D) && D.some((t, j) => t && !labels[j])){
      sub = true;
      D.forEach((t, j) => {
        if (!t) return;
        const l = labels[j];
        if (!l || (!sgbColKey(l) && sgbRole(sgbNorm(l)) === 'extra')) labels[j] = t;
      });
    }
  }
  return { labels, sub };
}

const SGB_WEEKDAY = /^[월화수목금토일](\s*\n\s*[월화수목금토일])*$/;
function sgbNameBlankCols(s, labels, sample){
  const width = Math.max(s.length, ...sample.map(r => (r || []).length));
  for (let j = 0; j < width; j++){
    if (s[j]) continue;
    const vals = sample.map(r => sgbText((r || [])[j])).filter(Boolean);
    if (vals.length && vals.every(v => SGB_WEEKDAY.test(v))){ s[j] = '요일'; labels[j] = '요일'; }
  }
}

// 칸의 쓰임: 기재 문안(body) · 학생이 쓴 글(self) · 나머지 정보(extra) · 버림(skip)
function sgbRole(h){
  if (!h || /^[a-z]+=/i.test(h)) return 'skip';
  const k = sgbColKey(h);
  if (k === 'seq' || k === 'key') return 'skip';
  if (SGB_BODY_WORDS.some(w => h.includes(w))) return 'body';
  if (SGB_SELF_WORDS.some(w => h.includes(w))) return 'self';
  return 'extra';
}

// 엑셀 → sgbParseBook 이 받는 모양. 꼬리표(<…>) 없는 시트는 위쪽(SGB_HEAD_ROWS 줄)만 보고 ⊙ 안내 칸이 없으면
// 통째로 읽지 않는다(개인별 조회 시트가 6천 줄이다). ⊙ 가 있으면 꼬리표를 빼먹은 활동 시트일 수 있어 다 읽는다.
function sgbBookToSheets(XLSX, wb){
  return wb.SheetNames.map((name, i) => {
    const hidden = !!(wb.Workbook?.Sheets?.[i]?.Hidden);
    const ws = wb.Sheets[name];
    if (hidden || !ws) return { name, hidden, rows: [] };
    if (!/^\s*</.test(name)){
      if (!ws['!ref']) return { name, hidden, rows: [] };
      const r = XLSX.utils.decode_range(ws['!ref']);
      const top = XLSX.utils.encode_range({ s: r.s, e: { r: Math.min(r.e.r, r.s.r + SGB_HEAD_ROWS), c: r.e.c } });
      const peek = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', range: top });
      if (!peek.some(row => (row || []).some(v => String(v).includes('⊙')))) return { name, hidden, rows: [] };
    }
    return { name, hidden, rows: XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }) };
  });
}

// sheets: [{ name, hidden, rows: [[칸…]…] }] → 활동·창체 일정·학생별·활동별 자료
function sgbParseBook(sheets){
  const activities = [], schedules = [], skipped = [];
  const actRows = new Map(), ids = new Set();
  let pos = -1;
  for (const sh of sheets){
    pos++;                                   // 파일 안 시트 차례 — 내려받을 때 원본 순서대로
    const name = String(sh.name || '').trim();
    if (sh.hidden){ skipped.push({ name, why: '숨긴 시트' }); continue; }
    let info = sgbSheetInfo(name), tagGuess = false;
    const rows = sh.rows || [];
    const hd = sgbFindHeader(rows);
    const head = hd ? sgbHead(rows, hd.i) : {};
    if (!info){
      // 꼬리표를 빼먹은 활동 시트 — ⊙ 활동명이 있고 ⊙ 입력 영역으로 영역을 알 수 있으면 읽는다(창체 일정은 영역 없이도)
      const tags = sgbAreaTags(head['입력영역']);
      if (!hd || !head['활동명']){ skipped.push({ name, why: '이름이 <자>·<진>·<개>·<누>·<행> 같은 꼬리표로 시작하지 않고 ⊙ 활동명 칸도 없음' }); continue; }
      if (!tags.length && hd.kind !== 'schedule'){ skipped.push({ name, why: `꼬리표가 없고 ⊙ 입력 영역 칸(${head['입력영역'] || '비어 있음'})으로도 영역을 알 수 없음` }); continue; }
      info = { tags, ...sgbNameInfo(name) };
      tagGuess = true;
    }
    if (!hd){ skipped.push({ name, why: '학년·반·번호(또는 월·일) 머리 줄을 못 찾음' }); continue; }
    // 양식 그대로(○○)인 칸은 빈 칸으로 본다. 시트 이름이 양식 그대로면 여러 부서가 같은 이름으로 올려
    // 서로 덮게 된다 — 그때는 부서(활동명)으로 활동을 알아본다(label). 시트 이름(sheet)은 서식을 찾느라 그대로 둔다
    const dept0 = head._dept && head._dept !== head['활동명'] ? head._dept : info.deptAbbr;
    const dept = /○/.test(dept0 || '') ? '' : dept0;
    const ph = /○/.test(name);
    if (ph && (!head['활동명'] || /○/.test(head['활동명']))){ skipped.push({ name, why: '시트 이름과 ⊙ 활동명이 양식 그대로(○○)라 무슨 활동인지 알 수 없음' }); continue; }
    const label = ph ? (dept ? `${dept}(${head['활동명']})` : head['활동명']) : '';
    const ident = ph ? (name.match(/^\s*<[^>]*>/) || [''])[0] + label : name;
    let id = 'a' + sgbHash(ident);
    while (ids.has(id)) id += 'x';
    ids.add(id);
    const base = { id, key: sgbActKey(ident), pos, sheet: name, tags: info.tags, rounds: ph ? [] : info.rounds,
      ...(tagGuess ? { tagGuess } : {}), ...(label ? { label } : {}),
      // 부서 칸에 활동명이 그대로 들어간 시트가 있다 — 그럴 땐 시트 이름 앞쪽(예: 연구부)을 쓴다
      title: head['활동명'] || info.short, short: ph ? head['활동명'] : info.short,
      dept,
      area: head['입력영역'] || '', path: head['입력경로'] || '', note: head['유의사항'] || '' };
    let labels, s = hd.s;
    if (hd.kind === 'student'){
      // 두 줄 머리(병합)는 한 줄로 — 자료 줄은 학년·반·번호가 숫자인 줄만 읽으니 갈래 줄은 저절로 빠진다
      const L = sgbHeadLabels(rows[hd.i - 1], rows[hd.i], rows[hd.i + 1]).labels;
      labels = L.map(v => v.replace(/\s+/g, ' '));
      s = L.map(sgbNorm);
      // 머리 이름이 빈 칸 중 요일 글자(월~일)로만 찬 칸은 '요일' — 프로젝트 봉사 시트의 J열
      sgbNameBlankCols(s, labels, rows.slice(hd.i + 1, hd.i + 41));
      // 학생 표 오른쪽의 딴 표(숨긴 참고 표 — 드롭다운 목록·VLOOKUP 범위) — 학년·반·번호·성명 칸 뒤에서
      // 머리도 비고 학생 줄에도 값이 없는 열을 만나면 거기서 끊는다. 딴 표가 머리·학생 줄과 같은 줄에 걸쳐 있어도 섞이지 않게
      const k0 = s.map(sgbColKey), g0 = k0.indexOf('g');
      const from = Math.max(...['g', 'c', 'n', 'nm'].map(k => k0.indexOf(k))) + 1;
      const stuRows = g0 < 0 ? [] : rows.slice(hd.i + 1).filter(r => /^[1-3]$/.test(String((r || [])[g0] ?? '').trim()));
      for (let j = from; from > 0 && j < s.length; j++)
        if (!s[j] && stuRows.every(r => !String((r || [])[j] ?? '').trim())){ s = s.slice(0, j); labels = labels.slice(0, j); break; }
    } else labels = (rows[hd.i] || []).map(v => sgbText(v).replace(/\s+/g, ' '));

    if (hd.kind === 'schedule'){
      const keep = hd.s.map((h, j) => h ? j : -1).filter(j => j >= 0);
      // 표 중간의 빈 줄도 남긴다(월 사이 띄운 줄) — 내려받을 때 원본 줄 자리 그대로. 끝의 빈 줄만 뗀다.
      const out = [];
      for (const r of rows.slice(hd.i + 1)) out.push({ v: keep.map(j => sgbText((r || [])[j])) });   // Firestore 는 배열 안 배열을 못 담는다
      while (out.length && !out.at(-1).v.some(Boolean)) out.pop();
      const g = +(((name + ' ' + base.title).match(/([1-3])\s*학년/) || [])[1] || 0);
      const cols = keep.map(j => labels[j]);
      schedules.push({ ...base, grade: g, cols, rows: out,
        hash: sgbHash(JSON.stringify([base.title, base.area, base.path, base.note, cols, out])) + '.' + out.length });
      continue;
    }

    const keys = s.map(sgbColKey);
    const gi = keys.indexOf('g'), ci = keys.indexOf('c'), ni = keys.indexOf('n'), nmi = keys.indexOf('nm');
    // 기재 문안·학생 글 칸은 센 낱말 차례로 고른다(같으면 왼쪽). 못 고른 후보는 기타 칸.
    const rank = (h, words) => { const k = words.findIndex(w => h.includes(w)); return k < 0 ? 99 : k; };
    let bi = -1, si = -1;
    s.forEach((h, j) => {
      if ([gi, ci, ni, nmi].includes(j)) return;
      const role = sgbRole(h);
      if (role === 'body' && (bi < 0 || rank(h, SGB_BODY_WORDS) < rank(s[bi], SGB_BODY_WORDS))) bi = j;
      if (role === 'self' && (si < 0 || rank(h, SGB_SELF_WORDS) < rank(s[si], SGB_SELF_WORDS))) si = j;
    });
    const xi = s.map((h, j) => j).filter(j => ![gi, ci, ni, nmi, bi, si].includes(j) && sgbRole(s[j]) !== 'skip');
    const rowsOut = [], byClass = {};
    for (const r0 of rows.slice(hd.i + 1)){
      const r = r0 || [];
      const g = parseInt(r[gi], 10), c = parseInt(r[ci], 10), n = parseInt(r[ni], 10);
      if (!(g >= 1 && g <= 3) || !(c >= 1) || !(n >= 1)) continue;
      const b = bi >= 0 ? sgbText(r[bi]) : '';
      const sv = si >= 0 ? sgbText(r[si]) : '';
      const x = xi.map(j => sgbText(r[j]));
      if (!b && !sv && !x.some(Boolean)) continue;
      const nm = nmi >= 0 ? sgbText(r[nmi]) : '';
      const item = { a: id };
      if (b) item.b = b;
      if (sv) item.s = sv;
      if (x.some(Boolean)) item.x = x;
      rowsOut.push({ g, c, n, nm, ...item, i: rowsOut.length });   // i: 시트 안 줄 차례(내려받을 때 원본 순서)
      const ck = g + '-' + c;
      byClass[ck] = (byClass[ck] || 0) + 1;
    }
    actRows.set(id, rowsOut);
    const a = { ...base, body: bi >= 0 ? labels[bi] : '', self: si >= 0 ? labels[si] : '',
      extra: xi.map(j => labels[j] || ''), count: rowsOut.length, byClass };
    // 다시 올렸을 때 '바뀐 시트' 를 가르는 지문 — 학생 줄과 안내 칸까지
    a.hash = sgbHash(JSON.stringify([a.title, a.dept, a.area, a.path, a.note, a.tags, a.body, a.self, a.extra, rowsOut])) + '.' + rowsOut.length;
    activities.push(a);
  }
  return { activities, schedules, skipped, students: sgbStudents(activities, actRows), actRows };
}

// 올리기 전에 눈으로 볼 시트 — 칸을 못 읽었거나(칸 이름이 뜻밖), 표준 양식의 「예)」 예시 글이 남은 시트.
// 봉사 누가기록은 기재 문안 칸이 원래 없다.
function sgbOddSheets(activities){
  const left = a => ['dept', 'title', 'area', 'path', 'note'].some(k => /^\s*예\s*\)/.test(a[k] || ''));
  return activities.map(a => ({ a, why: !a.count ? '학생 줄을 못 읽음'
      : !a.body && !sgbIsVolunteer(a) ? '기재 문안 칸 없음'
      : left(a) ? '위쪽 안내 칸에 「예)」 예시 글이 남아 있음' : '' })).filter(x => x.why);
}

// ── 봉사활동 누가기록 — 나이스 입력창처럼 한 표로 ──
// 입력 영역에 '봉사' 가 든 누가기록 활동(봉사 시트·프로젝트 봉사 시트)을 칸 이름으로 맞춰 한 표에 모은다.
// 한 칸에 회차가 줄바꿈으로 든 것(프로젝트 봉사)은 회차마다 한 줄. 시작일자 차례, 시간 누계를 붙인다.
const SGB_VOL_COLS = ['시작일자', '종료일자', '영역구분', '봉사활동내용', '학교/개인 구분', '장소 또는 주관 기관명', '시간', '시간 누계'];
const sgbIsVolunteer = a => !!a && (a.tags || []).includes('누') && /봉사/.test((a.area || '') + (a.title || ''));
function sgbVolField(label){
  const l = sgbNorm(label);
  if (l === '시작일자') return 'start';
  if (l === '종료일자') return 'end';
  if (l.includes('영역')) return 'area';
  if (l === '봉사활동내용' || l === '활동내용') return 'content';
  if (l.includes('학교/개인') || l === '학교개인') return 'type';
  if (l.includes('장소') || l.includes('기관')) return 'place';
  if (l === '시간') return 'hours';
  return '';
}
function sgbDateKey(v){
  const m = String(v || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '9999';
}
function sgbVolunteerRows(items, actOf){
  const out = [];
  for (const it of items || []){
    const a = actOf(it.a);
    if (!sgbIsVolunteer(a)) continue;
    const f = {};
    (a.extra || []).forEach((label, j) => { const k = sgbVolField(label); if (k && !(k in f)) f[k] = j; });
    const val = k => f[k] == null ? '' : String((it.x || [])[f[k]] || '');
    // 회차 수 — 시작일자·내용·시간 칸 가운데 가장 많은 줄 수
    const n = Math.max(1, ...['start', 'content', 'hours'].map(k => val(k) ? val(k).split('\n').length : 1));
    const pick = (k, i) => { const parts = val(k).split('\n'); return (parts.length === n ? parts[i] : (i === 0 || parts.length === 1 ? parts[0] : '')).trim(); };
    for (let i = 0; i < n; i++)
      out.push({ start: pick('start', i), end: pick('end', i), area: pick('area', i), content: pick('content', i),
        type: pick('type', i), place: pick('place', i), hours: pick('hours', i), src: a.title, srcId: a.id, k: out.length,
        // 학번·이름이 편성표와 어긋난 줄이면 표에도 경고를 달 수 있게(학생별 화면이 붙인 _mis)
        ...(it._mis ? { mis: it._mis, borrow: !!it._borrow } : {}) });
  }
  out.sort((x, y) => sgbDateKey(x.start).localeCompare(sgbDateKey(y.start)) || x.k - y.k);
  let sum = 0;
  for (const r of out){ const h = parseFloat(r.hours); if (!isNaN(h)) sum += h; r.total = Math.round(sum * 10) / 10; }
  return out;
}

// ── 창체 일정 거르기 — 자율(자율·자치) · 진로 · 동아리 ──
// 줄마다 '활동 영역' 칸으로 가르고, 그 칸이 비면 자율·동아리·진로 시간 칸에 값이 있는지로 가른다.
// 소계·누계 줄은 어느 영역도 아니다.
const SGB_SCH_KINDS = [['ja', '자율·자치', '자율'], ['jin', '진로', '진로'], ['club', '동아리', '동아리']];
function sgbSchKind(cols, v){
  const at = name => (cols || []).findIndex(c => sgbNorm(c) === name);
  const first = (v || [])[0] || '';
  if (/계/.test(first)) return '';
  const area = sgbNorm((v || [])[at('활동영역')] || '');
  for (const [k, , word] of SGB_SCH_KINDS) if (area.includes(word)) return k;
  for (const [k, , word] of SGB_SCH_KINDS){ const j = at(word); if (j >= 0 && String((v || [])[j] || '').trim()) return k; }
  return '';
}
// 활동 내용이 빈 줄(소계·누계·빈 칸)은 화면에서 없는 줄로 본다. 엑셀로 받을 때는 원본 그대로.
function sgbSchFilter(sc, kind){
  const ci = (sc.cols || []).findIndex(c => sgbNorm(c) === '활동내용');
  // 소계·누계 줄도 활동이 아니다(활동 내용 칸에 메모가 적힌 소계 줄이 있다)
  const rows = (sc.rows || []).filter(r => !/소계|누계|합계/.test((r.v || [])[0] || '')
    && (ci >= 0 ? String((r.v || [])[ci] || '').trim() : (r.v || []).some(Boolean)));
  if (!kind) return { rows, hours: null };
  const hi = (sc.cols || []).findIndex(c => sgbNorm(c) === '이수시간');
  const out = rows.filter(r => sgbSchKind(sc.cols, r.v) === kind);
  const hours = out.reduce((s, r) => s + (parseFloat((r.v || [])[hi]) || 0), 0);
  return { rows: out, hours: hi >= 0 ? hours : null };
}

// ── 반·번호·이름 맞추기 ──
// 학교 명렬(students/main: grade·room·num·name)과 맞대 본다. 명렬이 없으면 시트끼리(같은 학번의 가장 많은 이름).
// 이름이 다르면 그 이름이 명렬에서 실제로 어디 있는지(hint)도 알려 준다 — 반·번호를 잘못 적은 경우가 많다.
// changed: 편성표에서 반·번호가 빈 학생(students/changed — 학년·이름·구분·날짜). 명렬에 그 학년 같은 이름이
// 없고 떠난 학생 목록에 있으면 오류가 아니라 '학적 변동'(moved) — 떠나기 전 학번으로 남은 기록이다.
function sgbMismatches(activities, actRows, roster, changed = []){
  // 이름 비교는 띄어쓰기·괄호를 뺀다 — 떠난 학생은 '(홍길동)' 처럼 괄호에 싸여 적힌다
  const nn = v => String(v || '').replace(/[\s()（）]+/g, '');
  const paren = v => /^\s*[(（].*[)）]\s*$/.test(String(v || ''));
  const gone = new Map();
  for (const x of changed || []){ const g = parseInt(x.grade, 10); if (g && x.name) gone.set(`${g}|${nn(x.name)}`, x); }
  const book = new Map(), byName = new Map();
  for (const x of roster || []){
    const g = parseInt(x.grade, 10), c = parseInt(x.room, 10), n = parseInt(x.num, 10), nm = String(x.name || '').trim();
    if (!(g && c && n) || !nm) continue;
    book.set(`${g}-${c}-${n}`, nm);
    (byName.get(nn(nm)) || byName.set(nn(nm), []).get(nn(nm))).push(`${g}-${c}-${n}`);
  }
  const out = [];
  const each = fn => { for (const a of activities || []) for (const r of actRows.get(a.id) || []) fn(a, r); };
  if (book.size){
    each((a, r) => {
      const k = `${r.g}-${r.c}-${r.n}`, exp = book.get(k);
      const base = { sheet: a.sheet, a: a.id, g: r.g, c: r.c, n: r.n, nm: r.nm || '' };
      const left = gone.get(`${r.g}|${nn(r.nm)}`);
      const stillHere = (byName.get(nn(r.nm)) || []).some(k => k.split('-')[0] === String(r.g));
      // 떠난 학생 목록에 있거나, 이름이 괄호에 싸여 있으면(떠난 학생 표시) — 그 학년 명렬에 그 이름이 더 없을 때
      if ((exp == null || nn(exp) !== nn(r.nm)) && (left || paren(r.nm)) && !stillHere){
        out.push({ ...base, expect: exp || '', why: '학적 변동', moved: true, kind: left?.kind || '', date: left?.date || '' });
        return;
      }
      if (exp == null) out.push({ ...base, expect: '', why: '명렬에 없는 학번', hint: (byName.get(nn(r.nm)) || []).join(', ') });
      else if (r.nm && nn(exp) !== nn(r.nm)) out.push({ ...base, expect: exp, why: '이름이 명렬과 다름', hint: (byName.get(nn(r.nm)) || []).join(', ') });
    });
  } else {
    const names = new Map();
    each((a, r) => { if (!r.nm) return; const k = `${r.g}-${r.c}-${r.n}`; const m = names.get(k) || names.set(k, new Map()).get(k); m.set(nn(r.nm), (m.get(nn(r.nm)) || 0) + 1); });
    const top = k => [...(names.get(k) || new Map())].sort((p, q) => q[1] - p[1])[0]?.[0];
    each((a, r) => {
      const k = `${r.g}-${r.c}-${r.n}`;
      if (r.nm && (names.get(k)?.size || 0) > 1 && nn(r.nm) !== top(k))
        out.push({ sheet: a.sheet, a: a.id, g: r.g, c: r.c, n: r.n, nm: r.nm, expect: '', why: '시트마다 이름이 다름', hint: '' });
    });
  }
  return out.slice(0, 1000);
}

// 학생별 명단 — 학교 명렬(편성표를 올리면 students/main: grade·room·num·name)이 기준.
// 시트에서 모은 명단(meta.roster)만 쓰면 자료가 없는 학생이 빠지고 반 인원도 틀린다.
// 자료 건수(k)는 같은 번호에서 가져온다(학생 문서가 학년-반-번호로 저장되니 이름이 달라도 그 번호의 자료다).
// 편성표에 없는 번호·반(떠난 학생 등)은 시트 이름 그대로 그 반 맨 뒤에(extra). 명렬을 못 읽으면 시트 명단 그대로.
// 반·번호·이름이 어긋난 줄(mismatch, 학적 변동 빼고) — 한 학생 화면에 무엇을 더 보일지.
// own: 이 번호로 적힌 줄(자기 자료로 보이되 경고). borrow: 이 학생 이름이 적혔는데 번호가 다른 줄(그 번호 문서에서 빌려 온다).
// 빌려 주는 것은 같은 학년의 같은 이름만 — 학년 기록이라 다른 학년의 동명이인은 아니다.
const sgbMisKey = m => `${m.g}-${m.c}-${m.n}`;
const sgbHintKeys = m => String(m.hint || '').split(/,\s*/).filter(k => k && k.split('-')[0] === String(m.g));
function sgbMisFor(mismatch, key){
  const own = [], borrow = [], seen = new Set();
  for (const m of mismatch || []){
    if (m.moved) continue;
    if (sgbMisKey(m) === key) own.push(m);
    else if (sgbHintKeys(m).includes(key) && !seen.has(sgbMisKey(m) + '|' + m.a)){ seen.add(sgbMisKey(m) + '|' + m.a); borrow.push(m); }
  }
  return { own, borrow };
}
function sgbRosterView(book, sheetRoster, mismatch = []){
  const out = {};
  for (const x of book || []){
    const g = parseInt(x.grade, 10), c = parseInt(x.room, 10), n = parseInt(x.num, 10), nm = String(x.name || '').trim();
    if (!(g && c && n) || !nm) continue;
    (out[`${g}-${c}`] = out[`${g}-${c}`] || []).push({ n, nm, k: 0 });
  }
  if (!Object.keys(out).length) return sheetRoster || {};
  for (const list of Object.values(out)) list.sort((p, q) => p.n - q.n);
  for (const [key, list] of Object.entries(sheetRoster || {})){
    const cl = out[key] = out[key] || [];
    for (const r of list){
      const hit = cl.find(x => !x.extra && x.n === parseInt(r.n, 10));
      if (hit) hit.k = r.k; else cl.push({ ...r, extra: true });
    }
  }
  // 어긋난 줄 — 적힌 번호의 학생과 이름이 같은 학생 모두 ⚠, 이름이 같은 학생은 건수에도 센다
  const at = key => { const [g, c, n] = key.split('-').map(Number), cl = out[`${g}-${c}`] || [];
    return cl.find(x => !x.extra && x.n === n) || cl.find(x => parseInt(x.n, 10) === n); };
  for (const m of mismatch || []){
    if (m.moved) continue;
    const me = at(sgbMisKey(m)); if (me) me.warn = true;
    for (const k of sgbHintKeys(m)){ const o = at(k); if (o){ o.warn = true; o.k = (o.k || 0) + 1; } }
  }
  return out;
}

// 활동별 줄 → 학생별 묶음. 활동 순서대로 쌓는다.
function sgbStudents(activities, actRows){
  const stu = new Map();
  for (const a of activities) for (const r of actRows.get(a.id) || []){
    const key = r.g + '-' + r.c + '-' + r.n;
    if (!stu.has(key)) stu.set(key, { g: r.g, c: r.c, n: r.n, nm: r.nm || '', items: [] });
    const st = stu.get(key);
    if (!st.nm && r.nm) st.nm = r.nm;
    const it = { a: r.a };
    if (r.b) it.b = r.b;
    if (r.s) it.s = r.s;
    if (r.x) it.x = r.x;
    st.items.push(it);
  }
  return [...stu.values()].sort((a, b) => a.g - b.g || a.c - b.c || a.n - b.n);
}

// 이번 파일과 이미 올라가 있는 것(saenggibu/meta)을 시트 단위로 맞대 본다.
// 같은 시트 = 같은 시트 이름(id). 지문이 없는 옛 기록은 '바뀜' 으로 본다.
// 올라가 있는 것과 이 파일을 활동마다 짝지어 본다 — 차수 뗀 이름(sgbActKey)으로, 안 되면 시트 이름 그대로.
// clash: 이 파일 안에서 차수를 떼면 이름이 같아지는 시트들(하나로 묶지 않고 따로 올리되 알려 준다)
function sgbCompare(oldMeta, parsed){
  const out = { added: [], changed: [], same: [], missing: [], clash: [], old: oldMeta };
  const sides = [['act', oldMeta?.activities, parsed.activities], ['sch', oldMeta?.schedules, parsed.schedules]];
  for (const [kind, olds0, curs0] of sides){
    const olds = olds0 || [], curs = curs0 || [];
    const ok = sgbMatchKeys(olds), ck = sgbMatchKeys(curs);
    const groups = new Map();
    curs.forEach((a, i) => { if (!ck[i].startsWith('=')) return;
      const k = a.key || sgbActKey(a.sheet); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a.sheet); });
    for (const sheets of groups.values()) out.clash.push({ kind, sheets });
    const byKey = new Map(), byName = new Map(), used = new Set();
    // 시트 이름으로 잇는 것은 마지막 수단 — 양식 그대로(○○)인 이름(label)은 여러 부서가 같이 쓰니 잇지 않는다
    olds.forEach((o, i) => { if (!byKey.has(ok[i])) byKey.set(ok[i], o); if (!o.label) byName.set(sgbNorm(o.sheet), o); });
    curs.forEach((cur, i) => {
      let old = byKey.get(ck[i]);
      if ((!old || used.has(old)) && !cur.label) old = byName.get(sgbNorm(cur.sheet));
      if (old && used.has(old)) old = null;
      if (old) used.add(old);
      if (!old) out.added.push({ kind, cur });
      else if (old.hash && old.hash === cur.hash) out.same.push({ kind, cur, old });
      else out.changed.push({ kind, cur, old });
    });
    for (const o of olds) if (!used.has(o)) out.missing.push({ kind, old: o });
  }
  return out;
}

// 올린 사람·날짜 — 새로 들어온 것은 지금, 바뀐 것은 처음 날짜는 두고 바뀐 날짜만 지금, 그대로인 것은 옛 기록.
// 「추가」「수정」 꼬리표가 이걸 본다(since === upd 면 추가). Firestore 는 undefined 를 못 담아 있는 값만 옮긴다.
function sgbStamp(cmp, who, now){
  const copy = (to, from, keys) => { for (const k of keys) if (from?.[k] != null) to[k] = from[k]; };
  for (const x of cmp.added) Object.assign(x.cur, { by: who, since: now, upd: now });
  for (const x of cmp.changed){ copy(x.cur, x.old, ['since', 'fix']); Object.assign(x.cur, { by: who, upd: now }); }
  for (const x of cmp.same) copy(x.cur, x.old, ['by', 'since', 'upd', 'fix']);
}

// ── 추가·수정 꼬리표 ── 부서가 바로 올리니 '뭐가 새로 들어왔나' 를 앱이 알려 준다(예전엔 시트 이름의 차수로).
// 올린 지 7일은 모두에게, 그 뒤에는 아직 안 본 선생님에게 볼 때까지. seen: 이 선생님이 본 활동 { id: 그때의 upd }.
// 처음 날짜 = 바뀐 날짜면 추가, 아니면 수정. 날짜가 없는 옛 기록은 꼬리표 없음.
const SGB_FRESH_DAYS = 7;
function sgbFresh(a, seen = {}, now = Date.now()){
  if (!a?.upd) return '';
  const recent = now - Date.parse(a.upd) < SGB_FRESH_DAYS * 864e5;
  if (!recent && seen[a.id] === a.upd) return '';
  return a.since && a.since === a.upd ? 'new' : 'mod';
}

// ── 관리자가 앱에서 고친 값 ── 활동의 fix 에 따로 둔다(원본 칸은 그대로). 그래야 부서가 틀린 이름 그대로
// 같은 파일을 다시 올려도 고친 값이 유지된다(sgbStamp 가 fix 를 옮긴다). 읽을 때 덮어 보이고, 원래 값은 orig 에.
const SGB_FIX_KEYS = ['dept', 'title', 'area', 'path', 'note', 'tags'];
function sgbApplyFix(meta){
  if (!meta) return meta;
  const ap = a => {
    if (!a?.fix || !Object.keys(a.fix).length) return a;
    const orig = {};
    for (const k of SGB_FIX_KEYS) if (k in a.fix) orig[k] = a[k];
    return { ...a, ...a.fix, orig };
  };
  return { ...meta, activities: (meta.activities || []).map(ap), schedules: (meta.schedules || []).map(ap) };
}
// 내려받기 — 원본 양식의 위쪽 안내 칸은 올릴 때 떠 둔 글자 그대로라, 원래 값과 같은 칸을 고친 값으로 바꾼다
function sgbFixForm(form, a){
  if (!a?.orig || !form) return form;
  const f = sgbClone(form);
  const swaps = Object.entries(a.orig).filter(([k, v]) => k !== 'tags' && v && String(a[k] ?? '') !== String(v));
  for (const row of f.rows || []){
    if (row.r > (f.h || 0)) continue;
    for (const c of row.cells || []){
      const hit = swaps.find(([, v]) => sgbText(c.t) === sgbText(v));
      if (hit) c.t = a[hit[0]] ?? '';
    }
  }
  return f;
}

// 새로 들어온 시트 가운데 ⊙ 활동명이 짝 없는 기존 활동과 같은 것 — 이름을 바꿔 낸 새 판일 수 있다.
// 학급 임원 시트에 '학생회 임원' 이 복사돼 온 실제 사례가 있어, 짐작만 하고 바꿀지는 묻는다(기본은 따로 추가).
function sgbLookalikes(cmp){
  const free = cmp.missing.filter(x => x.kind === 'act');
  const out = [], taken = new Set();
  for (const x of cmp.added){
    if (x.kind !== 'act') continue;
    const t = sgbNorm(x.cur.title);
    const m = t && free.find(y => !taken.has(y.old) && sgbNorm(y.old.title) === t);
    if (m){ taken.add(m.old); out.push({ cur: x.cur, old: m.old }); }
  }
  return out;
}

// 이번 파일 + 남기기로 한 옛 활동(줄은 saenggibuAct 에서 읽어 온 것)·옛 창체 일정 → 하나로.
// 순서는 이미 올라가 있던 순서(order: 옛 목록의 id 차례)를 지키고 새 시트는 뒤에 —
// 그래야 다시 올릴 때 화면 순서가 흔들리지 않고, 안 바뀐 학생 문서를 다시 쓰지 않는다.
function sgbMerge(parsed, keepActs, keepScheds, order = []){
  let activities = [...parsed.activities];
  const actRows = new Map(parsed.actRows);
  for (const { a, rows } of keepActs){
    const { parts, ...rest } = a;
    activities.push(rest);
    actRows.set(a.id, rows);
  }
  const rank = new Map(order.map((id, i) => [id, i]));
  const byOrder = list => list.map((x, i) => [x, rank.has(x.id) ? rank.get(x.id) : order.length + i])
    .sort((p, q) => p[1] - q[1]).map(p => p[0]);
  activities = byOrder(activities);
  const schedules = byOrder([...parsed.schedules, ...keepScheds]);
  // 활동·창체 일정을 섞은 시트 차례 — 이미 있던 것은 옛 차례, 새 시트는 파일 안 차례로 뒤에
  const all = byOrder([...activities, ...schedules].sort((p, q) => (p.pos ?? 999) - (q.pos ?? 999)));
  return { ...parsed, activities, schedules, actRows, order: all.map(x => x.id), students: sgbStudents(activities, actRows) };
}

// ── 원본 양식 ── 올릴 때 시트마다 위쪽 안내 칸·머리줄·병합·열 너비·인쇄 설정과 본문 칸 서식을
// 떠 둔다(saenggibu/fmt-{id}). 내려받을 때 그 틀에 문안을 다시 채운다. 본문 글꼴만은 하나로
// 맞춘다 — 여러 사람이 손대 시트마다 글꼴·크기가 섞여 있다(돋움 10 이 원래 양식의 기본).
const SGB_BODY_FONT = { name: '돋움', size: 10 };
const SGB_BLUE = 'FF0066FF';            // 원래 양식의 머리줄 파랑
const sgbClone = o => o == null ? null : JSON.parse(JSON.stringify(o));
function sgbCellText(v){
  if (v == null) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'object'){
    if (Array.isArray(v.richText)) return v.richText.map(t => t.text || '').join('');
    if ('result' in v) return sgbCellText(v.result);
    if ('text' in v) return String(v.text ?? '');
    return '';
  }
  return String(v);
}
// 머리 줄 칸 이름 → 그 칸에 들어갈 값의 이름. 활동: g c n nm seq key b s x{j}, 창체 일정: v{j}
function sgbRoles(labels, a, kind){
  const used = new Set();
  const take = r => { if (used.has(r)) return ''; used.add(r); return r; };
  return labels.map(l => {
    if (!l) return '';
    if (kind === 'sch'){ const j = (a.cols || []).findIndex((c, k) => sgbNorm(c) === l && !used.has('v' + k)); return j >= 0 ? take('v' + j) : ''; }
    const k = sgbColKey(l);
    if (k) return take(k);
    if (a.body && l === sgbNorm(a.body) && !used.has('b')) return take('b');
    if (a.self && l === sgbNorm(a.self) && !used.has('s')) return take('s');
    const j = (a.extra || []).findIndex((x, k) => sgbNorm(x) === l && !used.has('x' + k));
    return j >= 0 ? take('x' + j) : '';
  });
}
// ws: ExcelJS 시트. 머리 줄을 못 찾으면 null(그 시트는 단순 표로 나간다)
function sgbFormOf(ws, a, kind){
  const maxCol = Math.min(Math.max(ws.columnCount || 0, 1), 40);
  const labelsOf = r => { const out = [''];
    for (let c = 1; c <= maxCol; c++) out.push(sgbNorm(sgbCellText(ws.getRow(r).getCell(c).value))); return out; };
  let h = 0, hk = '';
  for (let r = 1; r <= Math.min(ws.rowCount || 0, SGB_HEAD_ROWS) && !h; r++){ hk = sgbHeadKind(labelsOf(r)); if (hk) h = r; }
  if (!h) return null;
  // 두 줄 머리 — 해석과 똑같이 합친다. 그러려면 SheetJS 가 읽는 모양(병합 나머지 칸은 빈 칸)으로 봐야 한다
  let headLabels = labelsOf(h);
  if (hk === 'student'){
    const plainOf = r => { const out = [];
      for (let c = 1; c <= maxCol; c++){ const C = ws.getRow(r).getCell(c);
        out.push(C.isMerged && C.master && C.master.address !== C.address ? '' : sgbCellText(C.value)); }
      return out; };
    const { labels, sub } = sgbHeadLabels(h > 1 ? plainOf(h - 1) : null, plainOf(h), plainOf(h + 1));
    if (sub) h++;                          // 갈래 줄까지가 머리 — 자료는 그 다음 줄부터
    headLabels = [''].concat(labels.map(sgbNorm));
  }
  const rows = [];
  for (let r = 1; r <= h; r++){
    const R = ws.getRow(r), cells = [];
    for (let c = 1; c <= maxCol; c++){
      const C = R.getCell(c);
      // 병합된 칸의 나머지 칸은 값이 으뜸 칸 것으로 읽힌다 — 값은 버리고 테두리 같은 서식만
      const slave = C.isMerged && C.master && C.master.address !== C.address;
      const t = slave ? '' : sgbCellText(C.value);
      const st = sgbClone(C.style) || {};
      if (!t && !st.border && !st.fill && !st.font) continue;
      cells.push({ c, t, s: st });
    }
    rows.push({ r, ht: R.height || null, cells });
  }
  const merges = (ws.model?.merges || []).filter(m => +(String(m).match(/^[A-Z]+(\d+)/) || [])[1] <= h);
  const cols = [null];
  // 너비 0 은 숨긴 열(원본의 학번 열) — 0 을 빈 값으로 보면 다시 드러난다
  for (let c = 1; c <= maxCol; c++){ const C = ws.getColumn(c); cols.push({ w: C.width ?? null, hidden: !!C.hidden || C.width === 0 }); }
  const roles = sgbRoles(headLabels, a, kind);
  // 이름 없는 머리 칸 — 값이 학번(30101)이면 key, 요일이면 그 활동의 '요일' 칸.
  // 학생 줄만 본다(표 아래 빈 줄의 수식이 '0000' 같은 값을 내는 시트가 있다)
  const gcol = roles.indexOf('g');
  for (let c = 1; c <= maxCol; c++){
    if (roles[c]) continue;
    const vals = [];
    for (let r = h + 1; r <= Math.min(ws.rowCount || 0, h + 40); r++){
      if (gcol > 0 && !/^[1-3]$/.test(sgbCellText(ws.getRow(r).getCell(gcol).value).trim())) continue;
      const t = sgbCellText(ws.getRow(r).getCell(c).value).trim();
      if (t) vals.push(t);
    }
    if (!vals.length) continue;
    if (kind !== 'sch' && !roles.includes('key') && vals.every(v => /^[1-3]\d{4}$/.test(v))) roles[c] = 'key';
    else if (kind !== 'sch' && vals.every(v => SGB_WEEKDAY.test(v))){
      const j = (a.extra || []).indexOf('요일');
      if (j >= 0 && !roles.includes('x' + j)) roles[c] = 'x' + j;
    }
  }
  // 본문 칸 서식은 첫 자료 줄에서 — 글꼴은 버린다(나중에 하나로)
  const data = [null];
  let d = 0;
  for (let r = h + 1; r <= Math.min(ws.rowCount || 0, h + 40) && !d; r++){
    const vals = labelsOf(r);
    if (kind === 'sch' ? vals.some(Boolean) : /^[1-3]$/.test(vals[roles.indexOf('g')] || '')) d = r;
  }
  // 칸마다 원본 값의 형식 — 숫자로 적혀 있던 칸은 숫자로, 글자였던 칸은 글자로 되돌린다
  const types = [''];
  for (let c = 1; c <= maxCol; c++){
    const st = d ? sgbClone(ws.getRow(d).getCell(c).style) || {} : {};
    delete st.font;
    data.push(st);
    // 그 열의 값들로 정한다(첫 줄이 빈 칸이거나 한두 칸만 글자로 적힌 열이 있다): 숫자가 많으면 숫자,
    // 앞에 0 을 붙여 적은 값(반 '01')이 하나라도 있으면 'z', 아니면 글자
    let nNum = 0, nStr = 0, zero = false;
    for (let r = h + 1; r <= Math.min(ws.rowCount || 0, h + 60); r++){
      if (gcol > 0 && !/^[1-3]$/.test(sgbCellText(ws.getRow(r).getCell(gcol).value).trim())) continue;   // 학생 줄만
      let v = ws.getRow(r).getCell(c).value;
      if (v && typeof v === 'object' && 'result' in v) v = v.result;
      if (typeof v === 'number') nNum++;
      else if (typeof v === 'string' && v.trim()){ nStr++; if (/^0\d$/.test(v.trim())) zero = true; }
    }
    types.push(zero ? 'z' : nNum && nNum >= nStr ? 'n' : nStr ? 's' : '');
  }
  const page = sgbClone(ws.pageSetup) || {};
  delete page.printArea;
  // 원본 줄 높이 — 학생(같은 학생이 여러 줄이면 몇 번째인지)으로, 창체 일정은 자료 줄 차례로.
  // 내려받을 때 원본에 있던 줄은 원본 높이를 그대로 쓴다.
  const hts = {};
  const gi = roles.indexOf('g'), ci = roles.indexOf('c'), ni = roles.indexOf('n');
  const content = roles.map((r, k) => /^(b|s|x\d+|v\d+)$/.test(r) ? k : -1).filter(k => k > 0);
  const seen = {};
  for (let r = h + 1; r <= (ws.rowCount || 0); r++){
    const R = ws.getRow(r);
    const t = k => sgbCellText(R.getCell(k).value).trim();
    if (!content.some(k => t(k))) continue;
    let key;
    if (kind === 'sch') key = String(r - h - 1);       // 창체 일정은 빈 줄까지 원본 줄 자리 그대로
    else {
      const g = parseInt(t(gi), 10), c = parseInt(t(ci), 10), n = parseInt(t(ni), 10);
      if (!(g >= 1 && g <= 3) || !(c >= 1) || !(n >= 1)) continue;
      const b = `${g}-${c}-${n}`;
      key = `${b}#${seen[b] = (seen[b] ?? -1) + 1}`;
    }
    if (R.height) hts[key] = R.height;
  }
  const tab = sgbClone(ws.properties?.tabColor);
  return { v: 1, h, rows, merges, cols, roles, data, types, page, views: sgbClone(ws.views) || [], hts,
    tab: tab && (tab.argb || tab.theme != null) ? tab : null,
    defH: ws.properties?.defaultRowHeight || null, hf: sgbClone(ws.headerFooter) || null };
}
// 양식이 없을 때(못 읽었거나 옛 기록) 쓰는 단순한 틀 — 원래 양식과 같은 파랑 머리줄
function sgbPlainForm(a, kind){
  const thin = { style: 'thin', color: { argb: 'FF999999' } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const info = [['부서', a.dept], ['활동명', a.title], ['입력 영역', a.area], ['입력 경로', a.path], ['유의 사항', a.note]]
    .filter(([, v]) => v);
  const labels = kind === 'sch' ? (a.cols || [])
    : ['학년', '반', '번호', '성명', ...(a.extra || []), ...(a.self ? [a.self] : []), ...(a.body ? [a.body] : [])];
  const rows = info.map(([k, v], i) => ({ r: i + 1, ht: null, cells: [
    { c: 1, t: k, s: { font: { name: '돋움', size: 10, bold: true } } },
    { c: 2, t: v, s: { font: { name: i === 1 ? 'HY헤드라인M' : '돋움', size: i === 1 ? 14 : 10 }, alignment: { wrapText: true, vertical: 'top' } } }] }));
  const h = info.length + 2;
  rows.push({ r: h, ht: null, cells: labels.map((t, k) => ({ c: k + 1, t, s: {
    font: { name: '돋움', size: 10, bold: true, color: { argb: 'FFFFFFFF' } },
    fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: SGB_BLUE } },
    alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }, border: box } })) });
  const merges = info.map((_, i) => `B${i + 1}:${String.fromCharCode(64 + Math.max(2, labels.length))}${i + 1}`);
  const roles = [''].concat(sgbRoles(labels.map(sgbNorm), a, kind));
  const cols = [null].concat(labels.map((l, k) => ({ w: kind === 'sch' ? (k >= labels.length - 2 ? 30 : 7)
    : k < 3 ? 5 : k === 3 ? 9 : /^(b|s)$/.test(roles[k + 1]) ? 70 : 16, hidden: false })));
  const data = [null].concat(labels.map(() => ({ border: box, alignment: { vertical: 'top', wrapText: true } })));
  return { v: 1, h, rows, merges: labels.length > 1 ? merges : [], cols, roles, data,
    page: { orientation: kind === 'sch' ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 },
    views: [{ state: 'frozen', ySplit: h }] };
}
// 줄바꿈 — 기재 문안·학생 글 칸은 늘, 나머지는 원본 칸이 줄바꿈이었을 때만(봉사 시트처럼 한 줄로 쓰는 표가 있다)
function sgbWraps(form, col){
  const role = (form.roles || [])[col] || '';
  return role === 'b' || role === 's' || !!(((form.data || [])[col] || {}).alignment || {}).wrapText;
}
// 줄 높이 — 긴 문안이 잘려 보이지 않게 미리 잰다(엑셀이 열 때 늘려 준다고 믿지 않는다).
// 한글 한 자는 숫자 1.6칸쯤, 돋움 10 한 줄은 12.75pt — 원본 시트의 높이에 맞춰 잡은 값
function sgbRowHeight(form, vals){
  let lines = 1;
  vals.forEach((v, col) => {
    if (!col || v === '' || v == null || !sgbWraps(form, col)) return;
    const c = (form.cols || [])[col];
    if (c && (c.hidden || c.w === 0)) return;
    const w = Math.max(4, (c && c.w ? c.w : 9) - 1);
    let n = 0;
    for (const para of String(v).split('\n')){
      let u = 0;
      for (const ch of para) u += ch.charCodeAt(0) > 0x2e80 ? 1.6 : 1;
      n += Math.max(1, Math.ceil(u / w));
    }
    lines = Math.max(lines, n);
  });

// 내부결재용 내려받기 — 목차 + 활동마다 시트 하나(원래 시트 이름) + 창체 일정.
// rowsById: 활동 id → 저장된 줄들, forms: id → 양식(없으면 단순한 틀).

function sgbExportPlan(meta, rowsById, forms = {}){
  const used = new Set();
  const sheetName = raw => {
    const base = String(raw || '시트').replace(/[:\\/?*\[\]]/g, '_').trim().slice(0, 31) || '시트';
    let name = base, k = 2;
    while (used.has(name.toLowerCase())){ const tail = `~${k++}`; name = base.slice(0, 31 - tail.length) + tail; }
    used.add(name.toLowerCase());
    return name;
  };
  const toc = [];
  const out = [];
  const byId = new Map([...(meta.activities || []).map(a => [a.id, ['act', a]]), ...(meta.schedules || []).map(x => [x.id, ['sch', x]])]);
  const ids = [...(meta.order || []).filter(id => byId.has(id)), ...[...byId.keys()].filter(id => !(meta.order || []).includes(id))];
  for (const id of ids){
    const [kind, a] = byId.get(id);
    // 받을 때 시트 이름의 꼬리표 — 관리자가 고쳤거나(orig.tags) 꼬리표 없이 올라온 시트(tagGuess)는 지금 꼬리표로 붙인다
    // 양식 그대로(○○)인 이름으로 올라온 시트는 부서(활동명)으로(label)
    const name = sheetName((a.orig?.tags || a.tagGuess || a.label) && (a.tags || []).length
      ? `<${a.tags.join('or')}>` + (a.label || String(a.sheet).replace(/^\s*<[^>]*>\s*/, '')) : a.sheet);

    const list = kind === 'sch' ? (a.rows || []) : [...(rowsById[a.id] || [])].sort((x, y) =>
      (x.i != null && y.i != null) ? x.i - y.i : (x.g - y.g || x.c - y.c || x.n - y.n));
    const seen = {};
    const heights = list.map((r, k) => {
      if (kind === 'sch') return (form.hts || {})[String(k)] || null;
      const b = `${r.g}-${r.c}-${r.n}`;
      return (form.hts || {})[`${b}#${seen[b] = (seen[b] ?? -1) + 1}`] || null;
    });
    out.push({ name, form, rows: list.map((r, k) => sgbRowValues(form.roles, r, k)), heights, styled: !!forms[a.id] });
    const cnt = kind === 'sch' ? list.filter(r => (r.v || []).some(Boolean)).length : list.length;

  }

  const tocForm = sgbPlainForm({ title: '생기부 보조자료 — 목차', cols: ['구분', '활동명', '부서', '입력 영역', '건수', '시트', '파일'] }, 'sch');
  tocForm.cols = [null, ...[14, 40, 14, 30, 7, 34, 26].map(w => ({ w, hidden: false }))];
  // 목차는 맨 뒤 — 원본 시트 차례를 흐트러뜨리지 않게
  return [...out, { name: tocName, form: tocForm, rows: toc.map(v => ['', ...v]), heights: [], styled: false }];
}

// 저장할 문서들. 학생 하나 = 문서 하나(학생별 보기 = 읽기 1번),
// 활동 하나 × 학년 = 문서 하나(활동별 보기 = 학년마다 읽기 1번) — 크면 여러 조각으로.

  const activities = parsed.activities.map(a => {
    const byG = {};
    for (const r of parsed.actRows.get(a.id) || []) (byG[r.g] = byG[r.g] || []).push(r);
    const parts = {};
    for (const [g, list] of Object.entries(byG)){
      let chunk = [], bytes = 0, k = 0;
      const flush = () => { docs.set(`saenggibuAct/${a.id}-${g}-${k}`, { a: a.id, g: +g, k, rows: chunk }); k++; chunk = []; bytes = 0; };
      for (const r of list){
        const sz = size(r);
        if (chunk.length && bytes + sz > partBytes) flush();

  for (const st of parsed.students) (roster[st.g + '-' + st.c] = roster[st.g + '-' + st.c] || []).push({ n: st.n, nm: st.nm, k: st.items.length });
  // 시트 차례(활동·창체 일정 섞어서) — 합친 것이면 sgbMerge 가 정한 것, 아니면 파일 안 차례
  const order = parsed.order || [...parsed.activities, ...parsed.schedules]
    .map((x, i) => [x.id, (x.pos ?? 999) + i / 1e4]).sort((p, q) => p[1] - q[1]).map(p => p[0]);

}

  if (end && !/[.!?。…"'”’」』)\]]$/.test(end)) add(end.length, end.length, 'b', '마침표', '끝에 마침표가 없음', '', '.');
  // 같은 문장이 두 번 — 띄어쓰기는 보지 않고, 열 글자 이상만. 뒤에 나온 것을 가리킨다
  const seen = new Map();
  for (const [a, b] of sents){
    const k = s.slice(a, b).replace(/\s+/g, '');
    if (k.length < 10) continue;
    if (seen.has(k)){ const lead = s.slice(a, b).match(/^\s*/)[0].length; add(a + lead, b, 'b', '같은 문장', '같은 문장이 두 번 들어감'); }
    else seen.set(k, a);
  }
  // 겹치면 높은 단계 · 긴 쪽만(🔵 형식은 따로 남긴다), 앞에서부터
  hits.sort((x, y) => SGB_CK_LV[y.lv] - SGB_CK_LV[x.lv] || (y.e - y.s) - (x.e - x.s) || x.s - y.s);
  const kept = [];
  for (const h of hits){
    const clash = kept.some(k => k.lv !== 'b' && h.lv !== 'b' && h.s < k.e && k.s < h.e);
    const dup = kept.some(k => k.s === h.s && k.e === h.e && k.cat === h.cat);
    if (!clash && !dup) kept.push(h);
  }
  return kept.sort((x, y) => x.s - y.s || SGB_CK_LV[y.lv] - SGB_CK_LV[x.lv]);
}

  const a = actById(id);
  return (a && sgbIsVolunteer(a) && out.querySelector('.card.vol'))
    || [...out.querySelectorAll('.card[data-a]')].find(c => c.dataset.a === id && !c.closest('.vol-split'));
}
// 좁은 칸 위쪽 줄 — 학생 머리(사진·이름·활동 목록)가 위로 지나가면 나타난다. 위쪽 이동 줄(☰ · ◀ ▶)이 있으면 그 아래에.
// 활동은 잘리지 않게 다 보인다(많으면 줄바꿈, 폰은 한 줄로 옆으로) — 카드로 건너뛸 때 그 높이만큼 아래로(--miniH).
// 노트북은 칸(out)이, 폰은 화면(#body)이 스크롤된다 — 둘 다 듣는다
function miniWire(out, goAct){
  const mini = $('sMini'), head = out.querySelector('.s-head'), nav = $('mNav'), bar = mini?.firstElementChild, sc = $('body');
  if (!mini || !head) return;
  const navH = () => nav && nav.offsetParent ? nav.offsetHeight : 0;
  const line = () => nav && nav.offsetParent ? nav.getBoundingClientRect().bottom : out.getBoundingClientRect().top;
  const sync = () => {
    if (!mini.isConnected) return;               // 다른 화면으로 옮긴 뒤 남은 듣기
    out.style.setProperty('--navH', navH() + 'px');
    out.style.setProperty('--miniH', (bar?.offsetHeight || 44) + 'px');
    mini.classList.toggle('on', getComputedStyle(mini).display !== 'none' && head.getBoundingClientRect().bottom < line() + 6);
  };
  out.onscroll = sync;
  if (sc._miniSync) sc.removeEventListener('scroll', sc._miniSync);
  sc._miniSync = sync; sc.addEventListener('scroll', sync, { passive: true });
  out._miniRO?.disconnect();
  if (window.ResizeObserver){ out._miniRO = new ResizeObserver(sync); out._miniRO.observe(out); if (nav) out._miniRO.observe(nav); if (bar) out._miniRO.observe(bar); }
  mini.onclick = goAct;
  sync();
}
// 반·명단 숨기기(「« 숨기기」, 기억) — 학생을 연 동안만. 숨기면 위쪽 줄(☰ 반 · ◀ 이전 · 다음 ▶)로 넘긴다
function listApply(){ const panes = $('stuPanes'); if (panes) panes.classList.toggle('list-off', !!st.listOff && !!st.n && !SOLO); }
// 작성 칸 넓이 — 사이 막대를 끌어서(30%~70%), ← → 키로, 두 번 누르면 반반. 기억한다
const drFracOf = v => Math.min(.7, Math.max(.3, +v || .5));
function drFracApply(){
  const panes = $('stuPanes'); if (!panes) return;
  const f = drFracOf(st.drFrac);
  panes.style.setProperty('--drL', String(1 - f)); panes.style.setProperty('--drR', String(f));
}
function drSplitWire(){
  const sp = $('drSplit'); if (!sp) return;
  sp.onpointerdown = e => {
    e.preventDefault(); sp.setPointerCapture?.(e.pointerId); sp.classList.add('drag');
    const move = ev => { const d = $('stuOut').getBoundingClientRect(), p = $('drPane').getBoundingClientRect();
      st.drFrac = drFracOf((p.right - ev.clientX) / (p.right - d.left)); drFracApply(); };
    const up = () => { sp.classList.remove('drag'); sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); save(); };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
  };
  sp.ondblclick = () => { st.drFrac = .5; drFracApply(); save(); };
  sp.onkeydown = e => {
    const d = e.key === 'ArrowLeft' ? .02 : e.key === 'ArrowRight' ? -.02 : 0;
    if (!d) return;
    e.preventDefault(); st.drFrac = drFracOf(drFracOf(st.drFrac) + d); drFracApply(); save();
  };
}

// ── 활동별: 활동 목록 | 활동 ──
function actListHtml(){
  const acts = [...(META.activities || [])].sort((x, y) => groupRank(x) - groupRank(y) || (x.pos ?? 0) - (y.pos ?? 0));
  const q = (st.q || '').trim();
  const shown = acts.filter(a => (!q || (a.title + a.dept + a.sheet).includes(q)) && (!st.fresh || sgbFresh(a, SEEN)));
  let last = null, html = '';
  for (const x of shown){
    const k = groupKey(x);
    if (k !== last){ html += `<div class="acts-grp">${tagHtml(x.tags)}</div>`; last = k; }
    html += `<button type="button" class="act${x.id === st.act ? ' on' : ''}" data-id="${x.id}">
      <span class="t">${titleHtml(x)}${freshHtml(x)}<small>${esc(x.dept)}${roundTxt(x) ? ' · ' + roundTxt(x) : ''}</small></span><span class="n">${x.count}</span></button>`;
  }
  return html || `<div class="empty">${st.fresh ? '추가되거나 바뀐 활동이 없습니다.' : '맞는 활동이 없습니다.'}</div>`;
}
async function renderAct(){
  const body = $('body');
  const acts = META.activities || [];
  if (!acts.some(a => a.id === st.act)) st.act = [...acts].sort((x, y) => groupRank(x) - groupRank(y))[0]?.id || '';
  const nFresh = acts.filter(a => sgbFresh(a, SEEN)).length;
  if (!nFresh) st.fresh = false;
  save();
  body.innerHTML = `<div class="pane3">
    <section class="p-acts" aria-label="활동 목록">
      <div class="acts-q"><input type="search" id="actQ" placeholder="활동·부서 찾기" value="${esc(st.q || '')}" aria-label="활동 찾기">
        ${nFresh ? `<button type="button" class="fresh-tg${st.fresh ? ' on' : ''}" id="freshTg" aria-pressed="${!!st.fresh}">추가·수정만 ${nFresh}</button>` : ''}</div>
      <div id="acts">${actListHtml()}</div></section>
    <section class="p-detail" id="actOut"></section>
  </div>`;
  $('actQ').oninput = e => { st.q = e.target.value; save(); $('acts').innerHTML = actListHtml(); };
  if ($('freshTg')) $('freshTg').onclick = () => { st.fresh = !st.fresh; save(); $('freshTg').classList.toggle('on', st.fresh);
    $('freshTg').setAttribute('aria-pressed', String(st.fresh)); $('acts').innerHTML = actListHtml(); };
  $('acts').onclick = e => {
    const b = e.target.closest('.act'); if (!b) return;
    st.act = b.dataset.id; st.ac = ''; st.ag = ''; save();
    document.querySelectorAll('#acts .act').forEach(x => x.classList.toggle('on', x === b));
    // 본 것으로 치는 건 목록에서 직접 눌러 열었을 때만 — 탭에 들어올 때 저절로 열리는 첫 활동은 아직 안 읽은 것
    renderActOut().then(() => markSeen([actById(b.dataset.id)]));
    if (matchMedia('(max-width:900px)').matches) $('actOut').scrollIntoView({ block: 'start' });
  };
  await renderActOut();
}
// 봉사 활동은 활동별에서도 학생별처럼 나이스 칸 차례 표로 — 맨 앞에 학번·이름. 학생마다 회차를 한 줄씩 풀고
// (프로젝트 봉사는 한 칸에 회차가 줄바꿈으로 든다) 학번·이름은 그 학생 첫 줄에만 걸친다. 시간 누계는 없다(학생별 표에만).
function volActTable(a, list, mm){
  const keys = ['start', 'end', 'area', 'content', 'type', 'place', 'hours'];
  const body = list.map(r => {
    const vr = sgbVolunteerRows([r], () => a);
    if (!vr.length) return '';
    const mis = mm.get(misKey(a.id, r));
    const hak = `${r.g}${String(r.c).padStart(2, '0')}${String(r.n).padStart(2, '0')}`;
    const tag = mis ? (mis.moved ? ` <span class="moved-tag">${esc(mis.kind || '학적 변동')}</span>`
      : ` <span class="mis" title="${esc(mis.why)}${mis.expect ? ' · 명렬: ' + esc(mis.expect) : ''}">⚠</span>`) : '';
    return vr.map((v, i) => `<tr${i === 0 ? ' class="who-first"' : ''}>${i === 0 ? `<td class="c-hak" rowspan="${vr.length}" data-cp="${hak}">${hak}</td>
        <td class="c-nm" rowspan="${vr.length}"${r.nm ? ` data-cp="${esc(r.nm)}"` : ''}>${esc(r.nm)}${tag}</td>` : ''}${keys.map(k =>
        `<td class="c-${k}"${v[k] ? ` data-cp="${esc(v[k])}"` : ''}>${esc(v[k])}</td>`).join('')}</tr>`).join('');
  }).join('');
  // 시간 누계는 뺀다 — 한 활동 안의 누계라 학생의 실제 누계가 아니다(선생님 요청 2026-10-28). 누계는 학생별 표에만
  return `<div class="where">나이스 봉사활동 누가기록과 같은 칸 차례입니다. 칸을 누르면 그 내용이 복사됩니다.</div>
    <div class="neis-wrap"><table class="neis with-who"><colgroup>${['hak', 'nm', ...keys].map(k => `<col class="c-${k}">`).join('')}</colgroup>
    <thead><tr><th>학번</th><th>이름</th>${SGB_VOL_COLS.slice(0, keys.length).map((c, i) => `<th${i >= 6 ? ' class="r"' : ''}>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
}
async function renderActOut(){
  const out = $('actOut');
  const a = actById(st.act);
  if (!a){ out.innerHTML = '<div class="empty">왼쪽에서 활동을 고르세요.</div>'; return; }
  const grades = Object.keys(a.parts || {}).sort();
  // 「전체」 — 업무 담당자가 모든 학년을 한 번에 본다(학년이 둘 이상일 때만 탭이 있다)
  const all = st.ag === 'all' && grades.length > 1;
  if (!all && !grades.includes(st.ag)) st.ag = grades[0] || '';
  const counts = all ? [] : Object.entries(a.byClass || {}).filter(([k]) => k.split('-')[0] === st.ag)
    .sort((x, y) => +x[0].split('-')[1] - +y[0].split('-')[1]);
  const total = all ? Object.values(a.byClass || {}).reduce((s, n) => s + n, 0) : counts.reduce((s, [, n]) => s + n, 0);
  out.innerHTML = `<div class="sheet">
    <div class="card-h">${tagHtml(a.tags)}<span class="t" style="font-size:21px;">${titleHtml(a)}${freshHtml(a)}</span><span class="d">${esc(a.dept)}${roundTxt(a) ? ' · ' + roundTxt(a) : ''}</span></div>
    ${a.area || a.path ? `<div class="where">${esc(a.area)}${a.path ? '<br>' + esc(a.path) : ''}</div>` : ''}
    ${noteHtml(a)}
    <div class="where">시트: ${esc(a.sheet)}${a.file ? ' · 파일: ' + esc(a.file) : ''}</div>
    <div class="bar">${grades.length > 1 ? `<div class="seg" id="selAG"><button type="button" data-g="all" class="${all ? 'on' : ''}">전체</button>${grades.map(g => `<button type="button" data-g="${g}" class="${g === st.ag ? 'on' : ''}">${g}학년</button>`).join('')}</div>` : ''}</div>
    <div class="counts" id="actChips"><button type="button" class="chip${!st.ac || all ? ' on' : ''}" data-c="">${all ? '전체 학년' : esc(st.ag) + '학년 전체'} <b>${total}</b></button>${counts.map(([k, n]) =>
      `<button type="button" class="chip${k.split('-')[1] === st.ac ? ' on' : ''}" data-c="${esc(k.split('-')[1])}">${esc(k.split('-')[1])}반 <b>${n}</b></button>`).join('')}</div>
    <div id="actRows"><div class="empty">불러오는 중…</div></div>
  </div>`;
  if ($('selAG')) $('selAG').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.ag = b.dataset.g; st.ac = ''; save(); renderActOut(); };
  let rows;
  const drawRows = () => {
    const list = rows.filter(r => all || !st.ac || String(r.c) === st.ac).sort((x, y) => x.g - y.g || x.c - y.c || x.n - y.n);
    const mm = misMap();
    if (!list.length){ $('actRows').innerHTML = '<div class="empty">이 반에는 없습니다.</div>'; return; }
    $('actRows').innerHTML = sgbIsVolunteer(a) ? volActTable(a, list, mm)
      : list.map(r => itemCard(a, r, { who: r, mis: mm.get(misKey(a.id, r)) })).join('');
  };
  $('actChips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    st.ac = b.dataset.c; save();
    document.querySelectorAll('#actChips .chip').forEach(x => x.classList.toggle('on', x === b));
    if (rows) drawRows();
  };
  try { rows = all ? (await Promise.all(grades.map(g => loadActGrade(a, g)))).flat() : await loadActGrade(a, st.ag); }
  catch (e) { $('actRows').innerHTML = `<div class="empty err">불러오지 못했습니다: ${esc(e.message || e)}</div>`; return; }
  drawRows();
}

// ── 확인 필요 — 반·번호·이름이 명렬과 어긋난 줄, 시트(부서)별로 ──
function misKey(aId, r){ return `${aId}|${r.g}-${r.c}-${r.n}|${String(r.nm || '').replace(/\s+/g, '')}`; }
function misMap(){
  const m = new Map();
  for (const x of META?.mismatch || []) m.set(misKey(x.a, x), x);
  return m;
}
function renderChk(){
  const all = META.mismatch || [];

  for (const m of list) (bySheet.get(m.sheet) || bySheet.set(m.sheet, []).get(m.sheet)).push(m);

    ${[...bySheet].map(([sheet, ms]) => `<div class="grp">${esc(sheet)}<span>${ms.length}건</span></div>
      <div class="tblwrap" style="margin-top:0;"><table class="sch chk"><thead><tr><th>학년-반-번호</th><th class="long">엑셀의 이름</th><th class="long">명렬의 이름</th><th class="long">내용</th></tr></thead>
      <tbody>${ms.map(m => `<tr><td>${m.g}-${m.c}-${m.n}</td><td class="long"><b>${esc(m.nm)}</b></td><td class="long">${esc(m.expect || '—')}</td>
        <td class="long">${esc(m.why)}${m.hint ? ` · 명렬에서 「${esc(m.nm)}」은 ${esc(m.hint)}` : ''}</td></tr>`).join('')}</tbody></table></div>`).join('')}
    ${moved.length ? `<div class="grp">학적 변동(전출·자퇴) — 확인할 필요 없음<span>${new Set(moved.map(m => m.g + '|' + m.nm)).size}명 · ${moved.length}건</span></div>
      <div class="where moved-list">${[...new Map(moved.map(m => [m.g + '|' + m.nm, m])).values()].map(m =>
        `${m.g}-${m.c}-${m.n} ${esc(m.nm)}${m.kind ? ' · ' + esc(m.kind) : ''}${m.date ? ' ' + esc(m.date) : ''}`).join('<br>')}</div>` : ''}
  </div></div>`;
}

// ── 창체 일정 ──
function renderSch(){
  const body = $('body');
  const list = [...(META.schedules || [])].sort((x, y) => x.grade - y.grade);
  if (!list.length){ body.innerHTML = '<div class="empty">창체 일정 시트가 없습니다.</div>'; return; }
  if (!list.some(s => s.id === st.sg)) st.sg = list[0].id;
  save();
  const s = list.find(x => x.id === st.sg);
  if (!['', ...SGB_SCH_KINDS.map(k => k[0])].includes(st.sf || '')) st.sf = '';
  const { rows, hours } = sgbSchFilter(s, st.sf || '');
  const cnt = k => sgbSchFilter(s, k).rows.length;
  // 글 칸(활동 영역·활동 내용)은 길이가 제각각이라 늘 왼쪽 정렬 — 위아래로 훑어 읽기 쉽게. 숫자·날짜 칸은 가운데
  const textCols = new Set((s.cols || []).map((c, j) => /활동(영역|내용)/.test(sgbNorm(c)) ? j : -1).filter(j => j >= 0));
  body.innerHTML = `<div class="sch-wrap">
    <div class="bar" style="margin-top:0;">
      <div class="seg" id="schTabs">${list.map(x => `<button type="button" data-id="${x.id}" class="${x.id === st.sg ? 'on' : ''}">${x.grade ? x.grade + '학년' : esc(x.title)}</button>`).join('')}</div>
      <div class="counts" id="schKinds" style="margin:0;">${[['', '전체']].concat(SGB_SCH_KINDS.map(k => [k[0], k[1]])).map(([k, label]) =>
        `<button type="button" class="chip${(st.sf || '') === k ? ' on' : ''}" data-k="${k}">${label}${k ? ` <b>${cnt(k)}</b>` : ''}</button>`).join('')}</div>
      ${st.sf ? `<span class="sch-sum">${rows.length}건${hours != null ? ` · 이수 ${Math.round(hours * 10) / 10}시간` : ''}</span>` : ''}
    </div>
    <div class="sheet" style="margin-top:14px;">
      <div class="card-h">${tagHtml(s.tags)}<span class="t" style="font-size:20px;">${esc(s.title)}${freshHtml(s)}</span><span class="d">${esc(s.dept)}</span></div>
      ${s.area ? `<div class="where">${esc(s.area)}</div>` : ''}
      ${s.path ? `<details><summary>입력 경로·안내 보기</summary><div class="txt">${esc(s.path)}</div></details>` : ''}
      ${noteHtml(s)}
      <div class="tblwrap"><table class="sch"><thead><tr>${(s.cols || []).map((c, j) => `<th${textCols.has(j) ? ' class="long"' : ''}>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${(r.v || []).map((v, j) => `<td${textCols.has(j) ? ' class="long"' : ''}>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    </div></div>`;
  $('schTabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.sg = b.dataset.id; renderSch(); };
  $('schKinds').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; st.sf = b.dataset.k; renderSch(); };
  markSeen([s]);
}

// ── 생기부 작성(담임) ── 나이스에 넣을 최종안을 학생마다 쓴다(엑셀 「학생 생활기록부 입력」 도구를 웹으로).
// 학생별 화면에서 「✏️ 작성」 으로 오른쪽에 띄우고, 보조자료 카드의 「→ 자율」 로 붙여 줄이고 고친다.
// 그 반 담임과 앱 관리자만 — 규칙(saenggibuDraft·saenggibuDraftHist)이 막으므로 다른 반은 조회도 안 된다.
// 담임 판정은 학부모 상담·자리 배치와 같은 acl/gradeRoles.homerooms.
// saenggibuDraft/{학년-반-번호} = { ja, jin, gae, haeng, hold: {영역: 빼 둔 내용}, memo, nm, upd, by }
// saenggibuDraftHist/{학년-반-번호} = { 영역: [{ t, at, by }…최근 10판] } — 학생을 열 때 같이 받지 않게 따로 둔다
const DR_AREAS = [['ja', '자율', '자'], ['jin', '진로', '진'], ['gae', '개세특', '개'], ['haeng', '행특', '행']];
const DR_NAME = Object.fromEntries(DR_AREAS.map(([k, nm]) => [k, nm]));
const DR_FULL = { ja: '자율·자치활동 특기사항', jin: '진로활동 특기사항', gae: '개인별 세부능력 및 특기사항', haeng: '행동특성 및 종합의견' };
const DR_TAG_AREA = { '자': 'ja', '진': 'jin', '개': 'gae', '행': 'haeng' };   // 보조자료 꼬리표 → 붙일 칸
// 되돌리기 기록 — 학생을 열고 처음 고칠 때, 5분마다, 30자 넘게 지울 때 그 전 글을 남긴다(영역마다 최근 10판)
const DR_HIST_MAX = 10, DR_HIST_GAP = 5 * 60 * 1000, DR_HIST_CUT = 30;

// 「이 창 글로 저장」 — 그 글은 되돌리기 기록에(메모·빼 둔 내용은 복사해 둔다)
async function drConfKeep(f){

}

// 참여한 활동(보조자료) — 기재안에 들어갔는지 ✓ 들어감 · ◐ 일부 · □ 아직(선생님 요청 2026-10-30). 봉사활동 기록은 뺀다.

async function prActsOf(key){
  let d = null; try { d = await loadStudent(key); } catch (e) {}
  const items = [...(d?.items || [])];
  for (const m of sgbMisFor(META?.mismatch, key).borrow){
    let src = null; try { src = await loadStudent(sgbMisKey(m)); } catch (e) {}
    for (const it of src?.items || []) if (it.a === m.a) items.push(it);
  }
  const by = new Map();
  for (const it of items){ const a = actById(it.a); if (!a || sgbIsVolunteer(a)) continue; if (!by.has(a)) by.set(a, []); by.get(a).push(it.b || ''); }
  return [...by].map(([a, texts]) => ({ a, texts }));

function prActsHtml(acts, d, noH){
  const ks = DR_AREAS.map(([k]) => k).filter(k => !(noH && k === 'haeng'));
  const onlyH = a => (a.tags || []).length > 0 && a.tags.every(t => t === '행');
  const list = acts.filter(({ a }) => !(noH && onlyH(a))).map(({ a, texts }) => {
    const ts = texts.filter(t => t.trim()), best = {};
    for (const k of ks){ const v = d[k] || ''; if (v.trim() && ts.length) best[k] = Math.max(...ts.map(t => sgbUsed(t, v))); }
    const full = ks.filter(k => best[k] >= DR_USED_FULL), part = ks.filter(k => best[k] >= DR_USED_PART).sort((x, y) => best[y] - best[x]);
    const st = !ts.length ? 'nob' : full.length ? 'full' : part.length ? 'part' : 'none';
    const where = st === 'full' ? full.map(k => DR_NAME[k]).join('·') : st === 'part' ? `${DR_NAME[part[0]]} 일부` : st === 'nob' ? '문안 없음'
      : (a.tags || []).map(t => SGB_TAGS[t] || t).join('·');
    return { a, st, where };

    <div class="pr-ash"><b>참여한 활동</b><span>${list.length}개 · 들어감 ${n('full')} · 일부 ${n('part')} · 아직 ${n('none')}</span></div>

    <div class="pr-legend">✓ 기재안에 들어감 · ◐ 일부 들어감 · □ 아직 — 보조자료 기준, 봉사활동 기록은 뺌</div></td></tr>`;
}

  if (st.view === 'cls') return renderCls();   // 보조자료가 없어도 열린다(담임 작성 칸만 본다)
  if (!META){
    $('body').innerHTML = `<div class="empty">아직 올라온 자료가 없습니다.<br>위의 「📤 엑셀 올리기」로 엑셀을 올려 주세요.</div>`;
    return;
  }
  if (SOLO && !drCanWrite(st.g, st.c)){       // 단독 창은 작성하는 창 — 주소를 바꿔도 다른 반 학생은 안 연다
    $('body').innerHTML = `<div class="empty">${SOLO_ONLY}.<br>다른 반 학생의 보조자료는 본 창의 「학생별」 에서 봅니다.</div>`;
    return;
  }
  const nMis = (META.mismatch || []).filter(m => !m.moved).length;
  $('chkTab').style.display = nMis ? '' : 'none';
  $('chkTab').textContent = `⚠ 확인 필요 ${nMis}`;
  if (st.view === 'chk' && !nMis) st.view = 'stu';
  if (st.view === 'act') return renderAct();
  if (st.view === 'sch') return renderSch();
  if (st.view === 'chk') return renderChk();
  return renderStu();
}

// 위쪽 찾기 — 학번 다섯 자리면 Enter 로 바로 그 학생, 글자면 이름으로 명단을 거른다(목록만 쓰므로 읽기 없음)
$('hakbun').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !META) return;
  const m = e.target.value.trim().match(/^([1-3])(\d{2})(\d{2})$/);
  if (!m){ if (SOLO && e.target.value.trim()) soloFind(e.target.value.trim()); return; }
  if (SOLO && !drCanWrite(m[1], m[2])){ toast(SOLO_ONLY); return; }
  st.view = 'stu'; st.g = m[1]; st.c = String(+m[2]); st.n = String(+m[3]); st.find = '';
  e.target.value = '';
  render();
});
$('hakbun').addEventListener('input', e => {
  if (!META || SOLO) return;
  const v = e.target.value.trim();
  if (/^\d+$/.test(v)) return;           // 학번을 치는 중
  st.find = v; st.view = 'stu';
  render();
});
// 단독 창 — 이름으로 찾기(명단이 없으니 맞는 첫 학생을 바로 연다). 담임 반 학생만(관리자는 모두)
const SOLO_ONLY = '새 창에서는 담임 반 학생만 찾고 열 수 있습니다';
function soloFind(q){
  const rv = rosterView(), hits = [];
  for (const k of classes()) if (drCanWrite(...k.split('-'))) for (const r of rv[k] || []) if (!r.extra && (r.nm || '').includes(q)) hits.push([k, r]);
  if (!hits.length){ toast(classes().some(k => (rv[k] || []).some(r => (r.nm || '').includes(q))) ? SOLO_ONLY : '맞는 학생이 없습니다'); return; }
  const [k, r] = hits[0];
  $('hakbun').value = ''; [st.g, st.c] = k.split('-'); st.n = String(r.n); save(); render();
  if (hits.length > 1) toast(`${hits.length}명 가운데 첫 학생입니다 — 학번으로 찾으면 정확합니다`);
}

const isAdmin = () => fbAuth.currentUser?.email === ADMIN_EMAIL;
function loadScript(src){
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => { s.remove(); no(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function loadExcelJS(){
  for (const src of EXCELJS_SRC){
    if (window.ExcelJS) break;
    try { await loadScript(src); } catch (e) {}
  }
  if (!window.ExcelJS) throw new Error('서식 도구(ExcelJS)를 못 받았습니다');
  return window.ExcelJS;
}
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = XLSX_SRC; s.onload = () => ok(window.XLSX); s.onerror = () => no(new Error('엑셀 읽기 도구를 못 받았습니다'));
    document.head.appendChild(s);
  });
}

          : `원본 양식 ${nForms}/${nAll}개 시트 함께 저장 (내려받을 때 그 틀에 채웁니다)`}</li>

          <div class="acts-sum">${mis.slice(0, 50).map(m => `<div>${esc(m.sheet)} · <b>${m.g}-${m.c}-${m.n}</b> ${esc(m.nm)}

// ── 엑셀로 받기 (관리자) ── 활동 문서를 전부 읽어(조각 수만큼) 원본 양식에 채워 한 파일로
async function buildWorkbook(EJ, plan){
  const wb = new EJ.Workbook();
  wb.creator = '영남고 교사 대시보드';
  for (const sh of plan){
    const f = sh.form;
    const props = {};
    if (f.tab) props.tabColor = f.tab;                     // 아래 시트 탭 색
    if (f.defH) props.defaultRowHeight = f.defH;
    const ws = wb.addWorksheet(sh.name, { views: f.views || [], pageSetup: f.page || {}, properties: props,
      ...(f.hf ? { headerFooter: f.hf } : {}) });
    (f.cols || []).forEach((c, i) => {
      if (!i || !c) return;
      const col = ws.getColumn(i);
      if (c.w) col.width = c.w;
      if (c.hidden || c.w === 0) col.hidden = true;
    });
    for (const row of f.rows || []){
      const R = ws.getRow(row.r);
      if (row.ht) R.height = row.ht;
      for (const cell of row.cells || []){
        const C = R.getCell(cell.c);
        if (cell.t !== '') C.value = cell.t;
        if (cell.s) C.style = sgbClone(cell.s);
      }
    }
    for (const m of f.merges || []) { try { ws.mergeCells(m); } catch (e) {} }
    sh.rows.forEach((vals, i) => {
      const R = ws.getRow(f.h + 1 + i);
      R.height = (sh.heights || [])[i] || sgbRowHeight(f, vals);   // 원본에 있던 줄은 원본 높이
      for (let col = 1; col < vals.length; col++){
        if (!(f.roles || [])[col] && !(f.data || [])[col]) continue;
        const C = R.getCell(col);
        if (vals[col] !== '' && vals[col] != null) C.value = sgbTyped(f, col, vals[col]);
        C.style = sgbDataStyle(f, col);
      }
    });
  }
  return wb.xlsx.writeBuffer();
}
