// 남기기로 한 옛 활동의 줄을 저장된 조각에서 모은다. 하나라도 못 읽으면 멈춘다 —
// 그대로 올리면 그 활동이 조용히 비어 버린다.
async function loadAllRows(a){
  const rows = [];
  for (const [g, n] of Object.entries(a.parts || {})) for (let k = 0; k < n; k++){
    const snap = await getDoc(doc(fbDb, 'saenggibuAct', `${a.id}-${g}-${k}`));
    if (!snap.exists()) throw new Error(`남길 자료(${a.title})의 일부를 못 읽었습니다`);
    rows.push(...(snap.data().rows || []));
  }
  return rows;
}

// ── 바로 반영 ── 모든 교사가 올린다. 학생 문서 하나에 여러 부서 문안이 함께 들어 있어, 두 사람이 동시에 쓰면
// 나중 사람이 앞사람 것을 지운다. 그래서 쓰는 동안 잠그고(saenggibu/lock), 잠근 뒤에는 미리보기 때 본 목록이
// 그대로인지 다시 본다(그 사이 누가 올렸으면 다시 미리보기).
const LOCK_MS = 5 * 60 * 1000;              // 이보다 오래된 잠금은 버려진 것(창을 닫았거나 끊겼다)
const lockRef = () => doc(fbDb, 'saenggibu', 'lock');
async function lockTake(){
  const mine = me();
  await runTransaction(fbDb, async tx => {
    const s = await tx.get(lockRef());
    const d = s.exists() ? s.data() : null;
    if (d && d.by !== mine && Date.now() - Date.parse(d.at || 0) < LOCK_MS)
      throw new Error(`${whoTxt(d.by)} 선생님이 올리는 중입니다 — 잠시 뒤 다시 눌러 주세요`);
    tx.set(lockRef(), { by: mine, at: new Date().toISOString() });
  });
}
async function lockDrop(){ try { await deleteDoc(lockRef()); } catch (e) {} }

// 이 파일 + 남길 기존 자료를 합쳐 다시 짠 뒤, 바뀐 문서만 쓰고 이제 없는 문서는 지운다(올리기·지우기가 같이 쓴다).
// 무엇을 썼는지는 saenggibu/manifest 에 문서마다 지문으로, 누가 무엇을 했는지는 saenggibu/log 에(최근 200).
// plan: { parsed, keep: [{ kind, old }], forms, order, metaAt, file?, roster?, changed?, log }
async function sgbCommit(plan, say = () => {}){
  await lockTake();
  try {
    const metaNow = (await getDoc(doc(fbDb, 'saenggibu', 'meta'))).data() || null;
    if ((metaNow?.at || null) !== (plan.metaAt || null))
      throw Object.assign(new Error('그 사이 다른 선생님이 올렸습니다 — 다시 미리보기를 하세요'), { stale: true });
    say(plan.keep.some(x => x.kind === 'act') ? '남길 자료 읽는 중…' : '이전 기록 확인 중…');
    const keepActs = [];
    for (const x of plan.keep.filter(x => x.kind === 'act')) keepActs.push({ a: x.old, rows: await loadAllRows(x.old) });
    const merged = sgbMerge(plan.parsed, keepActs, plan.keep.filter(x => x.kind === 'sch').map(x => x.old), plan.order || []);
    const built = sgbBuildDocs(merged);
    // 양식 문서 — 이번 파일 시트는 새로 뜬 것, 남긴 시트는 저장돼 있던 것을 그대로(안 넣으면 지워진다)
    for (const [id, fm] of Object.entries(plan.forms || {})) built.docs.set(`saenggibu/fmt-${id}`, fm);
    for (const x of plan.keep){
      const snap = await getDoc(doc(fbDb, 'saenggibu', `fmt-${x.old.id}`));
      if (snap.exists()) built.docs.set(`saenggibu/fmt-${x.old.id}`, snap.data());
    }
    const metaBytes = new TextEncoder().encode(JSON.stringify(built.meta)).length;
    if (metaBytes > 900000) throw new Error(`목록 문서가 너무 큽니다(${Math.round(metaBytes / 1024)}KB) — 나눠 저장하도록 고쳐야 합니다`);
    const old = (await getDoc(doc(fbDb, 'saenggibu', 'manifest'))).data()?.h || {};
    const now = {};
    const writes = [];
    for (const [path, data] of built.docs){
      const json = JSON.stringify(data);
      const key = path.replace('/', ':');
      now[key] = sgbHash(json) + '.' + json.length;
      if (old[key] !== now[key]) writes.push([path, data, json.length]);
    }
    const dels = Object.keys(old).filter(k => !(k in now));
    let done = 0, batch = writeBatch(fbDb), ops = 0, bytes = 0;
    const flush = async () => { if (!ops) return; await batch.commit(); batch = writeBatch(fbDb); ops = 0; bytes = 0; };
    for (const [path, data, len] of writes){
      if (ops >= 200 || bytes + len > 3000000) await flush();
      const [c, id] = path.split('/');
      batch.set(doc(fbDb, c, id), data); ops++; bytes += len; done++;
      if (done % 50 === 0) say(`쓰는 중… ${done}/${writes.length}`);
    }
    for (const k of dels){
      if (ops >= 200) await flush();
      const [c, id] = k.split(':');
      batch.delete(doc(fbDb, c, id)); ops++;
    }
    await flush();
    say('목록 저장 중…');
    let { roster, changed } = plan;
    if (!roster){ roster = []; try { const rs = await getDoc(doc(fbDb, 'students', 'main')); roster = rs.exists() ? (rs.data().students || []) : []; } catch (e) {} }
    if (!changed){ changed = []; try { const rc = await getDoc(doc(fbDb, 'students', 'changed')); changed = rc.exists() ? (rc.data().students || []) : []; } catch (e) {} }
    const mismatch = sgbMismatches(merged.activities, merged.actRows, roster, changed);
    const at = new Date().toISOString(), by = me();
    await setDoc(doc(fbDb, 'saenggibu', 'meta'), { ...built.meta, mismatch, file: plan.file || metaNow?.file || '', at, by });
    await setDoc(doc(fbDb, 'saenggibu', 'manifest'), { h: now });
    try {
      const lg = (await getDoc(doc(fbDb, 'saenggibu', 'log'))).data()?.items || [];
      await setDoc(doc(fbDb, 'saenggibu', 'log'), { items: [{ at, by, ...plan.log }, ...lg].slice(0, 200) });
    } catch (e) {}
    return { writes: writes.length, dels: dels.length };
  } finally { await lockDrop(); }
}

async function doUpload(){
  if (!_pending) return;
  const { parsed, cmp, look, file, forms, roster, changed, metaAt } = _pending;
  const msg = $('upMsg'), go = $('upGo'), panel = $('upPanel');
  const pick = {};
  panel.querySelectorAll('select[data-pick]').forEach(sel => { pick[sel.dataset.pick] = sel.value; });
  const rep = isAdmin() && panel.querySelector('input[name="upMode"]:checked')?.value === 'replace';
  const skip = cmp.changed.filter(x => pick[`chg:${x.kind}:${x.cur.id}`] === 'skip');          // 남의 활동 — 그대로 둠
  const swap = look.filter(l => pick[`like:${l.cur.id}`] === 'swap');                          // 이름 바꿔 낸 새 판
  const gone = rep ? cmp.missing.filter(x => pick[`miss:${x.kind}:${x.old.id}`] !== 'keep') : [];   // 전체 바꾸기에서 지울 것
  if (gone.length && !confirm(`이 파일에 없는 기존 시트 ${gone.length}개를 지웁니다.\n(${gone.slice(0, 5).map(x => x.old.title).join(', ')}${gone.length > 5 ? ' …' : ''})\n계속할까요?`)) return;
  go.disabled = true;
  try {
    const skipCur = new Set(skip.map(x => x.cur)), swapCur = new Set(swap.map(l => l.cur));
    const swapOld = new Set(swap.map(l => l.old)), goneOld = new Set(gone.map(x => x.old));
    const p2 = { ...parsed, activities: parsed.activities.filter(a => !skipCur.has(a)), schedules: parsed.schedules.filter(a => !skipCur.has(a)) };
    const keep = [...skip.map(x => ({ kind: x.kind, old: x.old })), ...cmp.missing.filter(x => !swapOld.has(x.old) && !goneOld.has(x.old))];
    // 올린 사람·날짜 — 새 판으로 바꾼 것은 '바뀜'(처음 날짜는 옛것)
    const c2 = { added: cmp.added.filter(x => !swapCur.has(x.cur)), same: cmp.same,
      changed: [...cmp.changed.filter(x => !skipCur.has(x.cur)), ...swap.map(l => ({ kind: 'act', cur: l.cur, old: l.old }))] };
    sgbStamp(c2, me(), new Date().toISOString());
    // 차례 — 이름이 바뀐 짝은 옛 자리에(목록 끝으로 밀리지 않게)
    const ren = new Map([...c2.changed, ...c2.same].filter(x => x.old.id !== x.cur.id).map(x => [x.old.id, x.cur.id]));
    const order = (cmp.old?.order || [...(cmp.old?.activities || []), ...(cmp.old?.schedules || [])].map(a => a.id)).map(id => ren.get(id) || id);
    const skipIds = new Set(skip.map(x => x.cur.id));
    const forms2 = Object.fromEntries(Object.entries(forms || {}).filter(([id]) => !skipIds.has(id)));
    const t = a => a.title || a.sheet;
    const res = await sgbCommit({ parsed: p2, keep, forms: forms2, order, file, roster, changed, metaAt,
      log: { file, added: c2.added.map(x => t(x.cur)), changed: c2.changed.map(x => t(x.cur)), removed: gone.map(x => t(x.old)), skipped: skip.map(x => t(x.cur)) } },
      txt => { msg.textContent = txt; });
    _pending = null;
    panel.innerHTML = `✅ 올렸습니다 — 추가 ${c2.added.length} · 바뀜 ${c2.changed.length} · 남김 ${keep.length - skip.length} · 지움 ${gone.length}${skip.length ? ` · 건너뜀 ${skip.length}` : ''}
      <span style="color:var(--ink-soft)">(문서 ${res.writes}개 쓰고 ${res.dels}개 지움)</span>
      <button type="button" class="btn" onclick="this.parentNode.style.display='none'">닫기</button>`;
    await loadMeta();
    render();
  } catch (err) {
    const stale = !!err.stale;
    msg.innerHTML = `<span class="err">실패: ${esc(err.message || err)}</span>${stale ? ' <button type="button" class="btn" id="upRetry">다시 미리보기</button>' : ''}`;
    if (stale) $('upRetry').onclick = () => previewFile(_pending.f);
    go.disabled = false;
  }
}

// ── 관리(관리자만) ── 잘못 올라간 활동·창체 일정을 통째로 지우고, 부서·활동명 같은 안내를 앱에서 바로 고친다.
// 화면만 관리자에게 보인다(쓰기 규칙은 교사 전체 — 학생 문서를 부서별로 가를 수 없어서). 누가 했는지는 log 에.
$('admBtn').onclick = () => { if ($('admPanel').style.display === 'block'){ $('admPanel').style.display = 'none'; return; } renderAdmin(); };
const logLine = x => {
  const parts = [x.added?.length && `추가 ${x.added.join(', ')}`, x.changed?.length && `바뀜 ${x.changed.join(', ')}`,
    x.removed?.length && `지움 ${x.removed.join(', ')}`, x.skipped?.length && `건너뜀 ${x.skipped.join(', ')}`, x.fixed && `고침 ${x.fixed}`].filter(Boolean);
  return `<div>${fmtAt(x.at)} · <b>${esc(whoTxt(x.by))}</b>${x.file ? ' · ' + esc(x.file) : ''} — ${esc(parts.join(' / ') || '바뀐 것 없음')}</div>`;
};
async function renderAdmin(){
  const p = $('admPanel'); p.style.display = 'block'; p.innerHTML = '불러오는 중…';
  try {
    const raw = (await getDoc(doc(fbDb, 'saenggibu', 'meta'))).data() || null;
    const lg = (await getDoc(doc(fbDb, 'saenggibu', 'log'))).data()?.items || [];
    if (!raw){ p.innerHTML = '아직 올라온 자료가 없습니다. <button type="button" class="btn" id="admClose">닫기</button>'; $('admClose').onclick = () => { p.style.display = 'none'; }; return; }
    const eff = sgbApplyFix(raw);
    const rank = new Map((eff.order || []).map((id, i) => [id, i]));
    const items = [...eff.activities.map(a => ['act', a]), ...eff.schedules.map(x => ['sch', x])]
      .sort((x, y) => (rank.get(x[1].id) ?? 1e9) - (rank.get(y[1].id) ?? 1e9));
    const row = ([kind, a]) => `<tr data-id="${esc(a.id)}">
      <td><input type="checkbox" class="adm-ck" data-id="${esc(a.id)}" aria-label="${esc(a.title)} 고르기"></td>
      <td>${kind === 'sch' ? '<span class="d">창체 일정</span>' : tagHtml(a.tags)}</td>
      <td>${esc(a.title)}${a.orig ? ' <span class="fixed" title="앱에서 고침">✏</span>' : ''}</td>
      <td>${esc(a.dept || '')}</td><td class="d">${esc(a.sheet)}</td>
      <td>${esc(whoTxt(a.by) || '-')}</td><td class="d">${a.upd ? fmtAt(a.upd) : ''}</td><td class="n">${cntOf(a)}</td>
      <td><button type="button" class="btn adm-ed" data-id="${esc(a.id)}">✏ 고치기</button></td></tr>`;
    p.innerHTML = `<h3>⚙ 관리 <span class="d">— 선생님에게만 보입니다</span></h3>
      <div class="sec">잘못 올라간 것은 골라서 지우고, 부서·활동명 같은 안내는 바로 고칩니다(엑셀을 다시 올리지 않아도 됩니다).
        고친 값은 부서가 같은 파일을 다시 올려도 남습니다.</div>
      <div class="adm-wrap"><table class="adm-tb"><thead><tr><th><input type="checkbox" id="admAll" aria-label="모두 고르기"></th>
        <th>구분</th><th>활동명</th><th>부서</th><th>시트</th><th>올린 사람</th><th>날짜</th><th>건수</th><th></th></tr></thead>
        <tbody>${items.map(row).join('')}</tbody></table></div>
      <div class="row"><button type="button" class="btn" id="admDel" disabled>🗑 고른 것 지우기</button>
        <button type="button" class="btn" id="admClose">닫기</button><span id="admMsg"></span></div>
      <div class="sec"><b>최근 올린 기록</b>${lg.length ? `<div class="acts-sum" id="admLog">${lg.slice(0, 50).map(logLine).join('')}</div>` : ' <span class="d">아직 없습니다</span>'}</div>`;
    const cks = () => [...p.querySelectorAll('.adm-ck')];
    const sync = () => { $('admDel').disabled = !cks().some(c => c.checked); };
    cks().forEach(c => { c.onchange = sync; });
    $('admAll').onchange = e => { cks().forEach(c => { c.checked = e.target.checked; }); sync(); };
    $('admClose').onclick = () => { p.style.display = 'none'; };
    $('admDel').onclick = () => adminDelete(cks().filter(c => c.checked).map(c => c.dataset.id), raw);
    p.querySelectorAll('.adm-ed').forEach(b => { b.onclick = () => adminEditOpen(b.dataset.id, eff); });
  } catch (err) { p.innerHTML = `<span class="err">불러오지 못했습니다: ${esc(err.message || err)}</span>`; }
}
// 통째로 지우기 — 나머지를 남기고 다시 짜서 쓴다(올리기와 같은 길, 같은 잠금)
async function adminDelete(ids, raw){
  const del = new Set(ids);
  const all = [...(raw.activities || []).map(a => ['act', a]), ...(raw.schedules || []).map(x => ['sch', x])];
  const eff = sgbApplyFix(raw);
  const titleOf = id => [...eff.activities, ...eff.schedules].find(a => a.id === id)?.title || id;
  const names = all.filter(([, a]) => del.has(a.id)).map(([, a]) => titleOf(a.id));
  if (!names.length || !confirm(`고른 ${names.length}개를 지웁니다 — 학생별 화면에서도 빠집니다.\n(${names.slice(0, 5).join(', ')}${names.length > 5 ? ' …' : ''})\n계속할까요?`)) return;
  $('admDel').disabled = true;
  try {
    const keep = all.filter(([, a]) => !del.has(a.id)).map(([kind, old]) => ({ kind, old }));
    const res = await sgbCommit({ parsed: { activities: [], schedules: [], actRows: new Map(), students: [], skipped: [] },
      keep, forms: {}, order: raw.order || [], metaAt: raw.at || null, log: { removed: names } }, t => { $('admMsg').textContent = t; });
    await loadMeta(); render();
    await renderAdmin();
    $('admMsg').textContent = `✅ ${names.length}개를 지웠습니다(문서 ${res.writes}개 쓰고 ${res.dels}개 지움)`;
  } catch (err) {
    if (err.stale){ await renderAdmin(); $('admMsg').textContent = '그 사이 다른 선생님이 올려 목록을 다시 불러왔습니다 — 다시 골라 주세요'; return; }
    $('admMsg').innerHTML = `<span class="err">실패: ${esc(err.message || err)}</span>`; $('admDel').disabled = false;
  }
}
// 바로 고치기 — 목록 문서(meta)의 그 활동에 fix 만 쓴다(학생·활동 문서는 그대로)
function adminEditOpen(id, eff){
  const p = $('admPanel');
  p.querySelectorAll('tr.adm-edit').forEach(r => r.remove());
  const a = [...eff.activities, ...eff.schedules].find(x => x.id === id);
  const tr = p.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
  if (!a || !tr) return;
  const o = a.orig || {};
  const field = (k, label, long) => `<label><span>${label}</span>${long
      ? `<textarea data-f="${k}" rows="2">${esc(a[k] || '')}</textarea>` : `<input data-f="${k}" value="${esc(a[k] || '')}">`}
    ${k in o ? `<em class="d">원래: ${esc(o[k] || '(비어 있음)')}</em>` : ''}</label>`;
  const isAct = eff.activities.includes(a);
  const ed = document.createElement('tr');
  ed.className = 'adm-edit';
  ed.innerHTML = `<td colspan="9"><div class="adm-form">
    ${field('dept', '부서')}${field('title', '활동명')}${field('area', '입력 영역')}${field('path', '입력 경로')}${field('note', '유의 사항', true)}
    ${isAct ? `<div class="adm-tags"><span>꼬리표</span>${Object.entries(SGB_TAGS).map(([t, nm]) =>
      `<label><input type="checkbox" data-tag="${t}"${(a.tags || []).includes(t) ? ' checked' : ''}> ${esc(nm)}</label>`).join('')}
      ${'tags' in o ? `<em class="d">원래: ${esc((o.tags || []).map(t => SGB_TAGS[t] || t).join(' 또는 '))}</em>` : ''}</div>` : ''}
    <div class="row"><button type="button" class="btn pri" id="admSave">저장</button>
      ${a.orig ? '<button type="button" class="btn" id="admReset">원래대로</button>' : ''}
      <button type="button" class="btn" id="admEdCancel">취소</button><span id="admEdMsg"></span></div></div></td>`;
  tr.after(ed);
  $('admEdCancel').onclick = () => ed.remove();
  $('admSave').onclick = () => adminEditSave(a, ed, false);
  if ($('admReset')) $('admReset').onclick = () => adminEditSave(a, ed, true);
}
async function adminEditSave(a, ed, reset){
  const msg = $('admEdMsg');
  const val = {};
  ed.querySelectorAll('[data-f]').forEach(el => { val[el.dataset.f] = el.value.trim(); });
  const tagEls = [...ed.querySelectorAll('[data-tag]')];
  if (tagEls.length) val.tags = tagEls.filter(c => c.checked).map(c => c.dataset.tag);
  if (!reset && tagEls.length && !val.tags.length){ msg.innerHTML = '<span class="err">꼬리표를 하나 이상 고르세요</span>'; return; }
  if (!reset && !val.title){ msg.innerHTML = '<span class="err">활동명은 비울 수 없습니다</span>'; return; }
  try {
    msg.textContent = '저장 중…';
    await metaPatch(m => {
      const t = [...(m.activities || []), ...(m.schedules || [])].find(x => x.id === a.id);
      if (!t) throw new Error('그 사이 지워진 활동입니다');
      if (reset){ delete t.fix; return; }
      const fix = {};
      for (const [k, v] of Object.entries(val)){
        const same = k === 'tags' ? (t.tags || []).join() === v.join() : String(t[k] ?? '') === v;
        if (!same) fix[k] = v;                 // 원본과 다른 칸만 — 원본과 같게 되돌린 칸은 고침에서 빠진다
      }
      if (Object.keys(fix).length) t.fix = fix; else delete t.fix;
    }, { fixed: `${a.orig?.title || a.title}${reset ? ' (원래대로)' : ''}` });
    await loadMeta(); render();
    await renderAdmin();
    $('admMsg').textContent = reset ? '✅ 원래대로 돌렸습니다' : '✅ 고쳤습니다';
  } catch (err) { msg.innerHTML = `<span class="err">실패: ${esc(err.message || err)}</span>`; }
}
// 목록 문서만 고친다 — 올리기와 같은 잠금 안에서 새로 읽어 고쳐 쓴다(그 사이 올린 것을 덮지 않게)
async function metaPatch(fn, log){
  await lockTake();
  try {
    const ref = doc(fbDb, 'saenggibu', 'meta');
    const m = (await getDoc(ref)).data();
    if (!m) throw new Error('목록이 없습니다');
    fn(m);
    const at = new Date().toISOString(), by = me();
    await setDoc(ref, { ...m, at });
    try {
      const lg = (await getDoc(doc(fbDb, 'saenggibu', 'log'))).data()?.items || [];
      await setDoc(doc(fbDb, 'saenggibu', 'log'), { items: [{ at, by, ...log }, ...lg].slice(0, 200) });
    } catch (e) {}
  } finally { await lockDrop(); }
}

// ── 시작 ──
if (SOLO){
  document.querySelector('.top .ttl').textContent = '📑 개인별 조회';
  document.title = '개인별 조회 — 생기부 보조자료';
  $('hakbun').placeholder = '🔍 학번(30101) 또는 이름 + Enter';
}
$('loginBtn').onclick = () => signInWithPopup(fbAuth, new GoogleAuthProvider())
  .catch(e => { $('gateErr').textContent = e.message || String(e); });
onAuthStateChanged(fbAuth, async user => {
  const gate = $('gate');
  if (!user){ gate.style.display = 'flex'; return; }
  if (!/@yeungnam\.hs\.kr$/.test(user.email || '') || /^\d{7}@/.test(user.email || '')){
    $('gateErr').textContent = '학교 교사 계정이 아닙니다.\n현재: ' + (user.email || '알 수 없음');
    gate.style.display = 'flex';
    return;
  }
  gate.style.display = 'none';
  $('upBtn').style.display = '';                 // 부서·교과가 바로 올린다(모든 교사)
  $('formDl').style.display = '';
  // 전교생 문안이 한 파일에 담긴다 — 받기는 지금은 관리자만
  $('dlBtn').style.display = isAdmin() ? '' : 'none';
  $('admBtn').style.display = isAdmin() ? '' : 'none';
  try { await loadMeta(); }
  catch (e) { $('body').innerHTML = `<div class="empty err">불러오지 못했습니다: ${esc(e.message || e)}</div>`; return; }
  if (EMBED) return renderEmbed();
  try { const b = await getDoc(doc(fbDb, 'students', 'main')); BOOK = b.exists() ? (b.data().students || []) : []; } catch (e) { BOOK = []; }
  await loadRole();                             // 담임·관리자면 학생별에 「✏️ 작성」
  render();
  // 앱 안의 생기부 탭 — 다 떴다고 앱에 알린다(종합검색의 「✏️ 작성하러 가기」 가 그다음에 학생을 보낸다)
  if (!SOLO && window.parent !== window) try { window.parent.postMessage({ type: 'sgb-ready' }, location.origin); } catch (e) {}
});

// ── 한 학생만 보기(종합검색 안) — 상세만 그리고, 높이를 앱에 알려 iframe 을 늘리게 한다 ──
function postHeight(){
  try { parent.postMessage({ type: 'sgb-height', h: Math.ceil(document.documentElement.scrollHeight) }, location.origin); } catch (e) {}
}
async function renderEmbed(){
  const m = String(new URLSearchParams(location.search).get('k') || '').match(/^(\d)-(\d+)-(\d+)$/);
  if (!META || !m){ $('body').innerHTML = `<div class="empty">${META ? '학생을 찾지 못했습니다.' : '아직 올라온 생기부 보조자료가 없습니다.'}</div>`; postHeight(); return; }
  [, st.g, st.c, st.n] = m;
  _curList = [];
  $('body').innerHTML = '<section class="embed-out" id="stuOut"></section>';
  await renderStuOut();
  if ($('stuOut').querySelector('.empty')) $('stuOut').innerHTML = '<div class="empty">이 학생의 생기부 보조자료가 없습니다.</div>';
  postHeight();
  // 종합검색 위쪽 줄(이름·학년 반 번호·활동 칩)에 쓸 활동 목록 — 이 창은 스크롤이 없어(높이를 다 늘린다) 바깥 앱이 줄을 붙인다
  try { parent.postMessage({ type: 'sgb-acts', k: `${+st.g}-${+st.c}-${+st.n}`, acts: $('stuOut')._acts || [] }, location.origin); } catch (e) {}
  try { new ResizeObserver(postHeight).observe(document.body); } catch (e) {}
}
// 종합검색 위쪽 줄의 활동 칩 — 그 카드가 이 창의 어디에 있는지 알려 주면 바깥 앱이 스크롤한다(이 창은 스크롤이 없다)
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== window.parent || e.data?.type !== 'sgb-go' || !EMBED) return;
  const card = actCard($('stuOut'), String(e.data.id || ''));
  if (!card) return;
  card.classList.add('hit'); setTimeout(() => card.classList.remove('hit'), 1200);
  try { parent.postMessage({ type: 'sgb-go-at', y: Math.round(card.getBoundingClientRect().top + scrollY) }, location.origin); } catch (e2) {}
});
// 종합검색의 「✏️ 작성하러 가기」 — 그 학생을 학생별로 열고 작성 칸을 띄운다(쓸 수 있는 학생일 때만 — drCanWrite)
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== window.parent || e.data?.type !== 'sgb-open' || EMBED || SOLO) return;
  const m = String(e.data.k || '').match(/^(\d)-(\d+)-(\d+)$/);
  if (!m) return;
  drFlush();
  [, st.g, st.c, st.n] = m; st.view = 'stu'; st.find = ''; mList = false;
  if (e.data.dr && drCanWrite(st.g, st.c)) st.drOpen = true;
  save(); render();
});
// ── 사용설명서 · 전체화면 ── 앱 안에서는 앱(index.html)에 맡긴다 — 앱 모달로 설명서, 앱 머리·메뉴 자리까지 덮는 전체화면(F11 아님).
// 단독으로 연 창은 설명서를 새 탭으로, 전체화면 단추는 없다(덮을 앱 머리가 없다). 설명서는 담임(·관리자)이면 담임 탭, 아니면 부서·교과 탭
const IN_APP = document.documentElement.classList.contains('in-app') && window.parent !== window;
let FULL_ON = false;
const manTab = () => ROLE.home || ROLE.master ? 'write' : 'upload';
function paintFull(on){
  FULL_ON = !!on;
  const b = $('fullBtn'), t = FULL_ON ? '원래 크기' : '전체화면';
  b.setAttribute('aria-pressed', String(FULL_ON));
  b.title = t; b.setAttribute('aria-label', t); b.querySelector('.tl').textContent = t;
}
// 앱(index.html)이 알아듣는지 — 지금 앱은 이 화면이 다 뜨면(sgb-ready) 전체화면 상태(sgb-full-state)를 보내 준다.
// 그걸 못 받았으면 예전 앱일 수 있다(배포 뒤에도 앱을 켜 둔 채 쓰면 앱만 예전 판으로 남고, 이 화면은 새로 뜬다).
// 그때만 0.6초 대답을 기다려, 없으면 설명서는 새 탭으로 열고 전체화면은 새로고침하라고 알린다(조용히 안 되는 일이 없게)
let appOk = false, manAck = 0, fullAck = 0;
const openManTab = () => window.open(`saenggibu-manual.html#${manTab()}`, '_blank', 'noopener');
$('manBtn').onclick = () => {
  if (!IN_APP) return openManTab();
  const t = ++manAck;
  try { parent.postMessage({ type: 'sgb-manual', tab: manTab() }, location.origin); } catch (e) { return openManTab(); }
  if (!appOk) setTimeout(() => { if (manAck === t) openManTab(); }, 600);
};
$('fullBtn').onclick = () => {
  const t = ++fullAck;
  try { parent.postMessage({ type: 'sgb-full', on: !FULL_ON }, location.origin); } catch (e) {}
  if (!appOk) setTimeout(() => { if (fullAck === t) toast('앱이 예전 판이라 전체화면이 안 됩니다 — 앱을 새로고침해 주세요(폰은 껐다 켜기)', 5000); }, 600);
};
if (!IN_APP) $('fullBtn').style.display = 'none';
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== window.parent) return;
  if (e.data?.type === 'sgb-full-state'){ appOk = true; fullAck++; paintFull(e.data.on); }
  else if (e.data?.type === 'sgb-manual-open'){ appOk = true; manAck++; }
});
// 앱 안 전체화면을 Esc 로 끈다(사진 크게 보기가 열려 있으면 그것만 닫힌다)
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !IN_APP || !FULL_ON || $('zoom').classList.contains('open')) return;
  try { parent.postMessage({ type: 'sgb-full', on: false }, location.origin); } catch (err) {}
}, true);
// ── 글자 크기 ── 조회창(보기 화면)과 작성창(쓰는 칸)을 따로 — 학생 이름 옆 · 행특 가리기 옆 「가− 가+」(선생님 2026-10-29).
// 이 기기에 남기고, 본 창·새 창·종합검색 탭이 같이 쓴다(다른 창에서 바꾸면 바로 따라감)
const FS_KEY = 'ynhs-sgb-fs', FS_STEPS = [0.85, 1, 1.15, 1.3, 1.5, 1.7];
let FS = { v: 1, d: 1 };
function fsLoad(){
  try { const o = JSON.parse(localStorage.getItem(FS_KEY) || '{}') || {};
    FS = { v: FS_STEPS.includes(+o.v) ? +o.v : 1, d: FS_STEPS.includes(+o.d) ? +o.d : 1 }; } catch (e) { FS = { v: 1, d: 1 }; }
}
// 「가− 가+」 단추 — 학생 화면·작성 칸을 그릴 때 그 자리에서 지금 크기로 만든다(v 조회창, d 작성창)
function fsCtl(k){
  const i = FS_STEPS.indexOf(FS[k]), n = Math.round(FS[k] * 100), nm = k === 'v' ? '조회창' : '작성창';
  return `<span class="fs-ctl" data-fs="${k}" title="${nm} 글자 크기"><button type="button" data-fs-d="-1" aria-label="${nm} 글자 작게"${i <= 0 ? ' disabled' : ''}>가−</button>`
    + `<button type="button" class="fs-n" data-fs-reset title="${nm} 글자 처음 크기로"${n === 100 ? ' hidden' : ''}>${n}%</button>`
    + `<button type="button" data-fs-d="1" aria-label="${nm} 글자 크게"${i >= FS_STEPS.length - 1 ? ' disabled' : ''}>가+</button></span>`;
}
function fsApply(){
  const r = document.documentElement.style;
  r.setProperty('--fs-view', FS.v); r.setProperty('--fs-draft', FS.d);
  document.querySelectorAll('.fs-ctl').forEach(c => {           // 다시 그리지 않고 그 자리에서(누른 단추에 초점이 남게)
    const k = c.dataset.fs, i = FS_STEPS.indexOf(FS[k]), n = Math.round(FS[k] * 100), nb = c.querySelector('.fs-n');
    c.querySelector('[data-fs-d="-1"]').disabled = i <= 0;
    c.querySelector('[data-fs-d="1"]').disabled = i >= FS_STEPS.length - 1;
    nb.textContent = n + '%'; nb.hidden = n === 100;
  });
  document.querySelectorAll('#drPane textarea[data-f]').forEach(ta => { if (!ta.hidden) drGrow(ta); });   // 글자가 커지면 칸도 따라 늘린다
}
document.addEventListener('click', e => {
  const b = e.target.closest('.fs-ctl [data-fs-d], .fs-ctl [data-fs-reset]'); if (!b) return;
  const k = b.closest('.fs-ctl').dataset.fs;
  if (b.hasAttribute('data-fs-reset')) FS[k] = 1;
  else { const i = FS_STEPS.indexOf(FS[k]) + +b.dataset.fsD; FS[k] = FS_STEPS[Math.max(0, Math.min(FS_STEPS.length - 1, i))]; }
  try { localStorage.setItem(FS_KEY, JSON.stringify(FS)); } catch (err) {}
  fsApply();
});
window.addEventListener('storage', e => {
  if (e.key === FS_KEY){ fsLoad(); fsApply(); }
  if (e.key === CK_OK_KEY){ try { ckOk = JSON.parse(e.newValue || '{}') || {}; } catch (err) { ckOk = {}; } DR_AREAS.forEach(([k]) => drCkRun(k)); }
});
fsLoad(); fsApply();
// 앱이 탭에 다시 들어올 때 보내는 신호 — 그사이 새로 올라왔을 수 있다
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.type !== 'sgb-refresh' || !fbAuth.currentUser) return;
  loadMeta().then(changed => { if (changed) render(); }).catch(() => {});
});
</script>
</body>
</html>
