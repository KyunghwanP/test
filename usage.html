<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사용 현황 — 영남고 교사 대시보드</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  // 앱이 기억해 둔 다크모드를 그대로 따른다(날씨 헤더 5연타로 켜는 그것).
  // 앱 안 iframe 으로 뜨는데 여기만 밝으면 눈에 띈다. FOUC 를 막으려고 head 에서.
  try{ if(localStorage.getItem('ynhs-dark')==='1') document.documentElement.classList.add('dark'); }catch(e){}
</script>
<style>
  /* 이 화면은 관리자 혼자 본다. index.html 에 두면 코드와 껍데기가 전 교사에게
     내려간다 — 자료는 규칙이 막지만, 굳이 내려보낼 이유가 없어 따로 뺐다.
     자료를 지키는 것은 여전히 규칙이다(usage 읽기 = 관리자). */
  /* 색은 앱(index.html)과 같은 값을 쓴다. 앱 안 iframe 으로 뜨므로
     다른 팔레트를 쓰면 그 부분만 이질적으로 보인다. 다크모드도 같이 따른다
     — 앱이 html.dark 를 localStorage('ynhs-dark')에 기억해 둔다. */
  :root{
    --bg-base:#F1F5F9; --paper:#FFFFFF; --paper-soft:#F8FAFC;
    --ink:#0F172A; --ink-soft:#64748B; --rule:#E2E8F0;
    --warn:#EF4444; --accent:#3B82F6; --today-tint:#EFF6FF;
  }
  html.dark{
    --bg-base:#0B1220; --paper:#151F33; --paper-soft:#1D2A44;
    --ink:#E2E8F0; --ink-soft:#8FA3BD; --rule:#26354F;
    --warn:#F87171; --accent:#60A5FA; --today-tint:#16263F;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;background:var(--bg-base);
    font-family:'Noto Sans KR',sans-serif;color:var(--ink);}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 16px;background:var(--paper);border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:20;}
  .head .ttl{font-size:14px;font-weight:800;}
  .btn{background:var(--paper-soft);border:1px solid var(--rule);border-radius:9px;
    padding:6px 11px;font-size:12.5px;font-family:inherit;color:var(--ink);cursor:pointer;}
  .btn:hover{background:var(--rule);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.warn{border-color:var(--warn);color:var(--warn);font-weight:700;}
  input[type=month]{font-size:13px;font-family:inherit;padding:5px 8px;
    border:1px solid var(--rule);border-radius:9px;background:var(--paper);
    color:var(--ink);}
  #usageNote{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}
  #usageBody{padding:16px;}
  /* 앱 안에서 열리면 바깥에 이미 제목줄이 있다 — 여기 제목은 접는다 */
  body.in-app .head .ttl{display:none;}
  body.in-app .head{padding:9px 14px;}

  /* 로그인 게이트 */
  .gate{position:fixed;inset:0;background:var(--bg-base);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50;}
  .gate .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    max-width:380px;width:100%;text-align:center;}
  .gate h1{font-size:19px;margin-bottom:9px;}
  .gate p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:18px;}
  .gate button{background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:11px 20px;font-size:13.5px;font-family:inherit;font-weight:700;cursor:pointer;}
  .gate .err{color:var(--warn);font-size:12.5px;margin-top:14px;line-height:1.6;}

  /* 📊 사용 현황 */
  .ug-chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
  .ug-chip{background:var(--paper,#fff);border:1px solid var(--rule);border-radius:11px;
    padding:9px 15px;display:flex;flex-direction:column;gap:2px;min-width:104px;}
  .ug-chip span{font-size:11px;color:var(--ink-soft);letter-spacing:.02em;}
  .ug-chip b{font-size:19px;font-weight:800;line-height:1.15;}
  .ug-chip b small{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .ug-card{background:var(--paper,#fff);border:1px solid var(--rule);border-radius:13px;
    padding:15px 17px;margin-bottom:13px;min-width:0;}
  .ug-h{font-size:13px;font-weight:800;margin-bottom:12px;}
  .ug-h small{font-weight:600;color:var(--ink-soft);font-size:11.5px;margin-left:5px;}
  .ug-two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:13px;align-items:start;}
  @media (max-width:900px){ .ug-two{grid-template-columns:1fr;} }

  /* 날짜별 — 막대가 곧 그래프다. 라이브러리 없이 CSS 로만 그린다. */
  .ug-bars{display:flex;gap:2px;align-items:flex-end;height:104px;}
  .ug-bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
    justify-content:flex-end;align-items:center;gap:3px;position:relative;}
  .ug-bar-fill{width:78%;background:var(--accent,#2F5D62);border-radius:3px 3px 0 0;min-height:0;}
  .ug-bar.today .ug-bar-fill{background:var(--warn);}
  .ug-bar.zero .ug-bar-fill{background:var(--rule);height:2px !important;min-height:2px;}
  .ug-bar-lab{font-size:8.5px;color:var(--ink-soft);line-height:1;}
  .ug-bar-lab.wk{color:var(--warn);}

  /* 기능별 — 이름 · 막대 · 숫자 */
  .ug-trow{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:9px;
    align-items:center;padding:3.5px 0;font-size:12px;}
  .ug-tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ug-tbar{background:var(--rule);border-radius:4px;height:9px;overflow:hidden;}
  .ug-tbar i{display:block;height:100%;background:var(--accent,#2F5D62);border-radius:4px;}
  .ug-tnum{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
  .ug-tnum em{font-style:normal;font-weight:600;color:var(--ink-soft);font-size:10.5px;margin-left:4px;}

  .ug-tblwrap{overflow-x:auto;}
  .ug-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  .ug-tbl th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:11px;
    border-bottom:1px solid var(--rule);padding:5px 7px;white-space:nowrap;}
  .ug-tbl td{padding:4.5px 7px;border-bottom:1px solid rgba(0,0,0,.05);white-space:nowrap;}
  .ug-tbl td.nm{font-weight:700;}
  .ug-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .ug-tbl td.dim{color:var(--ink-soft);}
  /* 옛 화면을 쓰는 사람 — 이 칸 하나 보려고 버전을 남긴다 */
  .ug-tbl td.old{color:var(--warn);font-weight:700;}
  .ug-idle{margin-top:11px;padding-top:10px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--ink-soft);line-height:1.75;}
  .ug-empty{font-size:12.5px;color:var(--ink-soft);padding:10px 0;}
  .ug-foot{font-size:11.5px;color:var(--ink-soft);line-height:1.7;padding:2px 2px 18px;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h1>📊 사용 현황</h1>
    <p>누가 앱을 얼마나 쓰는지 봅니다.<br>관리자 계정으로만 열립니다.</p>
    <button id="loginBtn" type="button">구글 계정으로 로그인</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="head">
  <span class="ttl">📊 사용 현황</span>
  <input type="month" id="usageMonth">
  <button class="btn" id="usageReloadBtn">↻ 새로고침</button>
  <button class="btn warn" id="usageReloadAllBtn"
          title="열려 있는 모든 선생님 화면을 새로고침합니다">📣 모두 새로고침</button>
  <button class="btn" id="homeBtn">← 대시보드</button>
  <span id="usageNote"></span>
</div>
<div id="usageBody"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
         setPersistence, browserLocalPersistence, indexedDBLocalPersistence }
  from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrYCGksB-Nv8LNIv1kZc_a8d6bIL_5CvA",
  authDomain: "ynhs-7b5ba.firebaseapp.com",
  projectId: "ynhs-7b5ba",
  storageBucket: "ynhs-7b5ba.firebasestorage.app",
  messagingSenderId: "1031618043470",
  appId: "1:1031618043470:web:edb5b8d1f98db029916d1f",
  measurementId: "G-MTXQWT10P1"
};
const ADMIN_EMAIL = 'pkh910518@yeungnam.hs.kr';
const APP_VER = 'ver6.97';

const fbApp  = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
setPersistence(fbAuth, indexedDBLocalPersistence)
  .catch(() => setPersistence(fbAuth, browserLocalPersistence)).catch(() => {});
const fbDb = getFirestore(fbApp);

const escapeHtml = v => v == null ? '' : String(v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const usageKst  = () => new Date(Date.now() + 9 * 3600 * 1000);
const usageDate = () => usageKst().toISOString().slice(0, 10);
// 시간표(TEACHERS)는 이 페이지에 없다. 명단은 acl/emailByName 하나로 충분하다 —
// 수업 없는 교장·교감까지 그 문서에 들어 있다.
const TEACHERS = [];

const USAGE_TABS = {
  home:'🏠 현황판', weekly:'📋 주간교육활동', schedule:'📆 학사일정',
  mytask:'📌 업무캘린더', grades:'🎓 진로진학 상담', search:'🔍 학생 종합검색',
  timetable:'📅 시간표', points:'📝 상벌점', pass:'🎫 외출증',
  consult:'🗓️ 학부모상담', room:'🚪 특별실 예약', docs:'📋 업무자료',
  contacts:'📞 교원연락망', students:'🎒 학생연락망', meal:'🍱 식단표',
  seat:'🪑 자리 배치', usage:'📊 사용 현황',
};

async function usagePeople(){
  const byEmail = new Map();
  TEACHERS.forEach(t => { if(t && t.email) byEmail.set(t.email, t.name || t.email); });
  try {
    const snap = await getDoc(doc(fbDb, 'acl', 'emailByName'));
    if(snap.exists()) Object.entries(snap.data() || {}).forEach(([n, e]) => {
      if(typeof e === 'string' && e.includes('@') && !byEmail.has(e)) byEmail.set(e, n);
    });
  } catch(e){}
  return [...byEmail].map(([email, name]) => ({ email, name }));
}

let _usageBusy = false;
async function loadUsage(){
  if(_usageBusy) return;
  _usageBusy = true;
  const body = document.getElementById('usageBody');
  const note = document.getElementById('usageNote');
  const ym   = document.getElementById('usageMonth').value || usageDate().slice(0, 7);
  body.innerHTML = '<div style="padding:24px;color:var(--ink-soft);font-size:13px;">불러오는 중…</div>';
  try {
    const people = await usagePeople();
    // 사람마다 문서 하나. 60명이면 읽기 60번 — 하루 한도(5만)에 견주면 무시할 수준이다.
    const rows = await Promise.all(people.map(async p => {
      let days = {};
      try {
        const snap = await getDoc(doc(fbDb, 'usage', p.email, 'm', ym));
        if(snap.exists()) days = snap.data().days || {};
      } catch(e){}
      return { ...p, days };
    }));
    note.textContent = `${ym} · 교직원 ${rows.length}명`;
    renderUsage(rows, ym);
  } catch(e){
    body.innerHTML = `<div style="padding:24px;color:var(--warn);font-size:13px;">불러오기 실패: ${escapeHtml(e.message)}</div>`;
  } finally { _usageBusy = false; }
}

function renderUsage(rows, ym){
  const [y, mo] = ym.split('-').map(Number);
  const nDays = new Date(y, mo, 0).getDate();
  const dstr  = d => `${ym}-${String(d).padStart(2,'0')}`;

  // ── 집계 ───────────────────────────────────────────────────────────────
  const perDay = Array.from({length:nDays}, () => ({ users:0, opens:0 }));
  const tabTot = {};
  let opensAll = 0, usersAll = 0;
  const people = rows.map(r => {
    let opens = 0, used = 0, last = '', tabs = {}, ver = '';
    for(let d = 1; d <= nDays; d++){
      const row = r.days[dstr(d)];
      if(!row) continue;
      const o = Number(row.opens) || 0;
      opens += o; used++;
      if(row.ver) ver = row.ver;                 // 마지막으로 쓴 화면 버전
      perDay[d-1].users++; perDay[d-1].opens += o;
      if(row.date || row.last) last = `${dstr(d).slice(5)} ${row.last || ''}`.trim();
      Object.entries(row.tabs || {}).forEach(([k, v]) => {
        tabs[k] = (tabs[k] || 0) + (Number(v) || 0);
        tabTot[k] = (tabTot[k] || 0) + (Number(v) || 0);
      });
    }
    opensAll += opens;
    if(used) usersAll++;
    const top = Object.entries(tabs).sort((a,b) => b[1]-a[1]).slice(0,3);
    return { ...r, opens, used, last, tabs, top, ver, clicks: Object.values(tabs).reduce((a,b)=>a+b,0) };
  }).sort((a,b) => b.opens - a.opens || b.used - a.used || a.name.localeCompare(b.name,'ko'));

  const daysWithUse = perDay.filter(d => d.users).length;
  const avgUsers = daysWithUse ? (perDay.reduce((a,d)=>a+d.users,0) / daysWithUse) : 0;
  const tabRank = Object.entries(tabTot).sort((a,b) => b[1]-a[1]);
  const tabMax  = tabRank.length ? tabRank[0][1] : 0;
  const dayMax  = Math.max(1, ...perDay.map(d => d.users));
  const clickAll = tabRank.reduce((a,t) => a + t[1], 0);

  const chip = (l, v) => `<div class="ug-chip"><span>${l}</span><b>${v}</b></div>`;
  const pct  = (n, d) => d ? Math.round(n / d * 100) : 0;

  // ── 일자별 막대 ────────────────────────────────────────────────────────
  const today = usageDate();
  const bars = perDay.map((d, i) => {
    const ds = dstr(i+1);
    const dow = new Date(y, mo-1, i+1).getDay();
    const h = Math.round(d.users / dayMax * 100);
    return `<div class="ug-bar${d.users ? '' : ' zero'}${ds === today ? ' today' : ''}"
                 title="${ds} · ${d.users}명 · ${d.opens}회">
      <div class="ug-bar-fill" style="height:${d.users ? Math.max(4, h) : 0}%"></div>
      <span class="ug-bar-lab${dow === 0 || dow === 6 ? ' wk' : ''}">${i+1}</span>
    </div>`;
  }).join('');

  // ── 탭별 막대 ──────────────────────────────────────────────────────────
  const tabBars = tabRank.length ? tabRank.map(([k, v]) => `
    <div class="ug-trow">
      <span class="ug-tname">${escapeHtml(USAGE_TABS[k] || k)}</span>
      <span class="ug-tbar"><i style="width:${Math.max(2, Math.round(v/tabMax*100))}%"></i></span>
      <span class="ug-tnum">${v.toLocaleString()}<em>${pct(v, clickAll)}%</em></span>
    </div>`).join('')
    : '<div class="ug-empty">아직 기록이 없습니다.</div>';

  // ── 사람별 표 ──────────────────────────────────────────────────────────
  const used = people.filter(p => p.used), idle = people.filter(p => !p.used);
  const rowHtml = p => `<tr>
    <td class="nm">${escapeHtml(p.name)}</td>
    <td class="num">${p.opens || ''}</td>
    <td class="num">${p.used || ''}</td>
    <td class="num">${p.clicks || ''}</td>
    <td class="dim">${escapeHtml(p.last)}</td>
    <td class="${p.ver && p.ver !== APP_VER ? 'old' : 'dim'}">${escapeHtml(p.ver)}</td>
    <td class="dim">${p.top.map(t => `${escapeHtml(USAGE_TABS[t[0]] || t[0])} ${t[1]}`).join(' · ')}</td>
  </tr>`;

  document.getElementById('usageBody').innerHTML = `
    <div class="ug-chips">
      ${chip('쓴 사람', `${usersAll}<small> / ${people.length}명</small>`)}
      ${chip('앱 연 횟수', opensAll.toLocaleString())}
      ${chip('탭 이동', clickAll.toLocaleString())}
      ${chip('사용한 날', `${daysWithUse}일`)}
      ${chip('하루 평균', `${avgUsers.toFixed(1)}명`)}
      ${(() => { const old_ = people.filter(p => p.ver && p.ver !== APP_VER).length;
                 return chip('옛 버전', old_ ? `<span style="color:var(--warn)">${old_}명</span>` : '없음'); })()}
    </div>

    <div class="ug-card">
      <div class="ug-h">날짜별 사용자</div>
      <div class="ug-bars">${bars}</div>
    </div>

    <div class="ug-two">
      <div class="ug-card">
        <div class="ug-h">기능별 사용량 <small>탭을 연 횟수</small></div>
        ${tabBars}
      </div>
      <div class="ug-card">
        <div class="ug-h">사람별</div>
        <div class="ug-tblwrap"><table class="ug-tbl">
          <thead><tr><th>이름</th><th>연 횟수</th><th>쓴 날</th><th>탭 이동</th><th>마지막</th><th>버전</th><th>많이 쓴 기능</th></tr></thead>
          <tbody>${used.map(rowHtml).join('') || '<tr><td colspan="7" class="dim">기록 없음</td></tr>'}</tbody>
        </table></div>
        ${idle.length ? `<div class="ug-idle"><b>이 달에 안 쓴 ${idle.length}명</b>
          <div>${idle.map(p => escapeHtml(p.name)).join(' · ')}</div></div>` : ''}
      </div>
    </div>

    <div class="ug-foot">기록은 <b>앱을 연 횟수</b>와 <b>탭 이름·횟수</b>뿐입니다.
      무엇을 검색했는지·누구를 조회했는지 같은 내용은 담지 않습니다.
      (연락처 조회는 법에 따라 따로 남습니다.)</div>`;
}

// ── 모두 새로고침 ──────────────────────────────────────────────────────
// 배포해도 탭을 켜 둔 사람은 옛 화면을 계속 쓴다. 번호를 올리면 열려 있는
// 화면들이 스냅샷으로 받아 조용히 새로고침한다(적는 중인 사람은 빼고).
async function broadcastReload(){
  const btn = document.getElementById('usageReloadAllBtn');
  const ref = doc(fbDb, 'appNotice', 'reload');
  try {
    btn.disabled = true;
    const snap = await getDoc(ref);
    const n = (Number(snap.exists() ? snap.data().n : 0) || 0) + 1;
    await setDoc(ref, { n, at: new Date().toISOString(),
                        by: fbAuth.currentUser.email, ver: APP_VER });
    document.getElementById('usageNote').textContent =
      `열려 있는 화면에 새로고침을 보냈습니다 (#${n}).`;
  } catch(e) {
    document.getElementById('usageNote').textContent = '보내기 실패: ' + (e.message || e);
  } finally { btn.disabled = false; }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  document.getElementById('gateErr').textContent = '';
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ hd: 'yeungnam.hs.kr', prompt: 'select_account' });
  try { await signInWithPopup(fbAuth, provider); }
  catch(e) { document.getElementById('gateErr').textContent = '로그인 실패: ' + e.message; }
});
// 앱 안에서 iframe 으로 열렸을 때(?in=1)는 '대시보드' 버튼을 숨긴다.
// 그대로 두면 프레임 안이 앱으로 바뀌어 앱 속에 앱이 뜬다. 나가는 것은
// 바깥의 '← 돌아가기' 가 한다.
const IN_APP = new URLSearchParams(location.search).get('in') === '1' || window.top !== window.self;
if (IN_APP) { document.getElementById('homeBtn').hidden = true; document.body.classList.add('in-app'); }
document.getElementById('homeBtn').addEventListener('click', () => { location.href = 'index.html'; });
document.getElementById('usageReloadBtn').addEventListener('click', () => loadUsage());
document.getElementById('usageMonth').addEventListener('change', () => loadUsage());
document.getElementById('usageReloadAllBtn').addEventListener('click', () => {
  if (confirm('열려 있는 모든 선생님 화면을 새로고침합니다.\n\n'
    + '뭔가 적고 있는 분은 새로고침하지 않고 안내만 뜹니다.\n계속할까요?')) broadcastReload();
});

onAuthStateChanged(fbAuth, user => {
  const gate = document.getElementById('gate');
  if (!user) { gate.style.display = 'flex'; return; }
  if (user.email !== ADMIN_EMAIL) {
    // 자료는 규칙이 막지만, 왜 안 보이는지는 말해 주는 게 낫다.
    document.getElementById('gateErr').textContent =
      '관리자 계정이 아닙니다.\n현재: ' + (user.email || '알 수 없음');
    gate.style.display = 'flex';
    return;
  }
  gate.style.display = 'none';
  const m = document.getElementById('usageMonth');
  if (!m.value) m.value = usageDate().slice(0, 7);
  loadUsage();
});
</script>
</body>
</html>
