<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사용 현황 — 영남고 교사 대시보드</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  // 앱이 기억해 둔 다크모드를 그대로 따른다(날씨 헤더 5연타로 켜는 그것).
  // 앱 안 iframe 으로 뜨는데 여기만 밝으면 눈에 띈다. FOUC 를 막으려고 head 에서.
  try{ if(localStorage.getItem('ynhs-dark')==='1') document.documentElement.classList.add('dark'); }catch(e){}
</script>
<style>
  /* 이 화면은 관리자 혼자 본다. index.html 에 두면 코드와 껍데기가 전 교사에게
     내려간다 — 자료는 규칙이 막지만, 굳이 내려보낼 이유가 없어 따로 뺐다.
     자료를 지키는 것은 여전히 규칙이다(usage 읽기 = 관리자). */
  /* 색은 앱(index.html)과 같은 값을 쓴다. 앱 안 iframe 으로 뜨므로
     다른 팔레트를 쓰면 그 부분만 이질적으로 보인다. 다크모드도 같이 따른다
     — 앱이 html.dark 를 localStorage('ynhs-dark')에 기억해 둔다. */
  :root{
    --bg-base:#F1F5F9; --paper:#FFFFFF; --paper-soft:#F8FAFC;
    --ink:#0F172A; --ink-soft:#64748B; --rule:#E2E8F0;
    --warn:#EF4444; --accent:#3B82F6; --today-tint:#EFF6FF;
  }
  html.dark{
    --bg-base:#0B1220; --paper:#151F33; --paper-soft:#1D2A44;
    --ink:#E2E8F0; --ink-soft:#8FA3BD; --rule:#26354F;
    --warn:#F87171; --accent:#60A5FA; --today-tint:#16263F;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;background:var(--bg-base);
    font-family:'Noto Sans KR',sans-serif;color:var(--ink);}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 16px;background:var(--paper);border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:20;}
  .head .ttl{font-size:14px;font-weight:800;}
  .btn{background:var(--paper-soft);border:1px solid var(--rule);border-radius:9px;
    padding:6px 11px;font-size:12.5px;font-family:inherit;color:var(--ink);cursor:pointer;}
  .btn:hover{background:var(--rule);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.warn{border-color:var(--warn);color:var(--warn);font-weight:700;}
  input[type=month]{font-size:13px;font-family:inherit;padding:5px 8px;
    border:1px solid var(--rule);border-radius:9px;background:var(--paper);
    color:var(--ink);}
  #usageNote{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}
  #usageBody{padding:16px;}
  /* 앱 안에서 열리면 바깥에 이미 제목줄이 있다 — 여기 제목은 접는다 */
  body.in-app .head .ttl{display:none;}
  body.in-app .head{padding:9px 14px;}

  /* 로그인 게이트 */
  .gate{position:fixed;inset:0;background:var(--bg-base);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50;}
  .gate .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    max-width:380px;width:100%;text-align:center;}
  .gate h1{font-size:19px;margin-bottom:9px;}
  .gate p{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:18px;}
  .gate button{background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:11px 20px;font-size:13.5px;font-family:inherit;font-weight:700;cursor:pointer;}
  .gate .err{color:var(--warn);font-size:12.5px;margin-top:14px;line-height:1.6;}

  /* 📊 사용 현황 */
  .ug-views{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--rule);
    border-radius:10px;overflow:hidden;width:max-content;}
  .ug-view{background:var(--paper,#fff);border:0;border-right:1px solid var(--rule);
    padding:7px 16px;font:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .ug-view:last-child{border-right:0;}
  .ug-view.on{background:var(--mon,#3B82F6);color:#fff;}
  /* 접속 기록 — 날짜가 같은 줄끼리 묶여 보이게 첫 줄만 날짜를 적는다 */
  .ug-log-date{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .ug-log-date.same{color:transparent;}
  .ug-log-wk{color:var(--warn,#b45309);}
  .ug-chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
  .ug-chip{background:var(--paper,#fff);border:1px solid var(--rule);border-radius:11px;
    padding:9px 15px;display:flex;flex-direction:column;gap:2px;min-width:104px;}
  .ug-chip span{font-size:11px;color:var(--ink-soft);letter-spacing:.02em;}
  .ug-chip b{font-size:19px;font-weight:800;line-height:1.15;}
  .ug-chip b small{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .ug-card{background:var(--paper,#fff);border:1px solid var(--rule);border-radius:13px;
    padding:15px 17px;margin-bottom:13px;min-width:0;}
  .ug-h{font-size:13px;font-weight:800;margin-bottom:12px;}
  .ug-h small{font-weight:600;color:var(--ink-soft);font-size:11.5px;margin-left:5px;}
  .ug-two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:13px;align-items:start;}
  @media (max-width:900px){ .ug-two{grid-template-columns:1fr;} }

  /* 날짜별 — 막대가 곧 그래프다. 라이브러리 없이 CSS 로만 그린다. */
  .ug-bars{display:flex;gap:2px;align-items:flex-end;height:104px;}
  .ug-bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
    justify-content:flex-end;align-items:center;gap:3px;position:relative;}
  .ug-bar-fill{width:78%;background:var(--accent,#2F5D62);border-radius:3px 3px 0 0;min-height:0;}
  .ug-bar.today .ug-bar-fill{background:var(--warn);}
  .ug-bar.zero .ug-bar-fill{background:var(--rule);height:2px !important;min-height:2px;}
  .ug-bar-lab{font-size:8.5px;color:var(--ink-soft);line-height:1;}
  .ug-bar-lab.wk{color:var(--warn);}

  /* 기능별 — 이름 · 막대 · 숫자 */
  .ug-trow{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:9px;
    align-items:center;padding:3.5px 0;font-size:12px;}
  .ug-tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ug-tbar{background:var(--rule);border-radius:4px;height:9px;overflow:hidden;}
  .ug-tbar i{display:block;height:100%;background:var(--accent,#2F5D62);border-radius:4px;}
  .ug-tnum{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
  .ug-tnum em{font-style:normal;font-weight:600;color:var(--ink-soft);font-size:10.5px;margin-left:4px;}

  /* 표 위 도구 줄 — 검색 · 옛 버전만 · 몇 명 */
  .ug-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 7px;font-size:12px;}
  .ug-tools input[type=search]{flex:1;min-width:110px;font:inherit;padding:5px 9px;
    border:1px solid var(--rule);border-radius:8px;background:var(--paper,#fff);color:inherit;}
  .ug-tools label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  /* 기능별 머리글의 '내 사용량 빼기' */
  .ug-mine{float:right;font-size:11px;font-weight:600;color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:4px;}
  /* 정렬 가능한 머리글 */
  .ug-tbl th[data-sort]{cursor:pointer;user-select:none;}
  .ug-tbl th[data-sort]:hover{color:var(--ink);}
  .ug-tbl th[data-sort].on{color:var(--ink);}
  .ug-tbl th[data-sort].on::after{content:' ▾';font-size:9px;}
  .ug-tbl th[data-sort].on[data-dir="asc"]::after{content:' ▴';}
  .ug-tblwrap{overflow-x:auto;}
  .ug-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  .ug-tbl th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:11px;
    border-bottom:1px solid var(--rule);padding:5px 7px;white-space:nowrap;}
  .ug-tbl td{padding:4.5px 7px;border-bottom:1px solid rgba(0,0,0,.05);white-space:nowrap;}
  .ug-tbl td.nm{font-weight:700;}
  .ug-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .ug-tbl td.dim{color:var(--ink-soft);}
  /* 오늘 쓴 기능 — 달 전체와 나란히 있으니 어느 쪽이 오늘인지 보이게 */
  .ug-tbl td.today{color:var(--ink);}
  .ug-tbl td.today .dim{color:var(--ink-soft);}
  .ug-tbl th small{font-weight:600;opacity:.7;}
  /* 옛 화면을 쓰는 사람 — 이 칸 하나 보려고 버전을 남긴다 */
  .ug-tbl td.old{color:var(--warn);font-weight:700;}
  /* 사람별 표에서 이름을 체크해 특정 사람에게만 새로고침을 보낸다 */
  .ug-tbl td.nm label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .ug-tbl tr.ug-prow.sel{background:var(--today-tint);}
  .ug-idle{margin-top:11px;padding-top:10px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--ink-soft);line-height:1.75;}
  .ug-idle label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;
    margin-right:2px;}
  #ugSelBar{display:none;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--today-tint);border:1px solid var(--accent);border-radius:10px;
    padding:8px 12px;margin-bottom:11px;font-size:12.5px;}
  #ugSelBar b{font-weight:800;}
  .ug-empty{font-size:12.5px;color:var(--ink-soft);padding:10px 0;}
  .ug-foot{font-size:11.5px;color:var(--ink-soft);line-height:1.7;padding:2px 2px 18px;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h1>📊 사용 현황</h1>
    <p>누가 앱을 얼마나 쓰는지 봅니다.<br>관리자 계정으로만 열립니다.</p>
    <button id="loginBtn" type="button">구글 계정으로 로그인</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="head">
  <span class="ttl">📊 사용 현황</span>
  <input type="month" id="usageMonth">
  <button class="btn" id="usageReloadBtn">↻ 새로고침</button>
  <button class="btn warn" id="usageReloadAllBtn"
          title="열려 있는 모든 선생님 화면을 새로고침합니다">📣 모두 새로고침</button>
  <button class="btn" id="homeBtn">← 대시보드</button>
  <span id="usageNote"></span>
</div>
<div class="ug-views" id="usageViews">
  <button type="button" class="ug-view on"  data-view="summary">요약</button>
  <button type="button" class="ug-view"     data-view="log">접속 기록</button>
  <button type="button" class="ug-view"     data-view="priv">🔒 개인정보 열람</button>
</div>
<div id="usageBody"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
         setPersistence, browserLocalPersistence, indexedDBLocalPersistence }
  from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrYCGksB-Nv8LNIv1kZc_a8d6bIL_5CvA",
  authDomain: "ynhs-7b5ba.firebaseapp.com",
  projectId: "ynhs-7b5ba",
  storageBucket: "ynhs-7b5ba.firebasestorage.app",
  messagingSenderId: "1031618043470",
  appId: "1:1031618043470:web:edb5b8d1f98db029916d1f",
  measurementId: "G-MTXQWT10P1"
};
const ADMIN_EMAIL = 'pkh910518@yeungnam.hs.kr';
const APP_VER = 'ver7.40';

const fbApp  = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
setPersistence(fbAuth, indexedDBLocalPersistence)
  .catch(() => setPersistence(fbAuth, browserLocalPersistence)).catch(() => {});
const fbDb = getFirestore(fbApp);

const escapeHtml = v => v == null ? '' : String(v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const usageKst  = () => new Date(Date.now() + 9 * 3600 * 1000);
const usageDate = () => usageKst().toISOString().slice(0, 10);
// 시간표(TEACHERS)는 이 페이지에 없다. 명단은 acl/emailByName 하나로 충분하다 —
// 수업 없는 교장·교감까지 그 문서에 들어 있다.
const TEACHERS = [];

const USAGE_TABS = {
  home:'🏠 현황판', weekly:'📋 주간교육활동', schedule:'📆 학사일정',
  mytask:'📌 업무캘린더', grades:'🎓 진로진학 상담', search:'🔍 학생 종합검색',
  timetable:'📅 시간표', points:'📝 상벌점', pass:'🎫 외출증',
  consult:'🗓️ 학부모상담', room:'🚪 특별실 예약', docs:'📋 업무자료',
  contacts:'📞 교원연락망', students:'🎒 학생연락망', meal:'🍱 식단표',
  seat:'🪑 자리 배치', usage:'📊 사용 현황',
};

// 새로고침을 특정 사람에게만 보내려고 고른 이메일들. 달을 바꿔 다시 그려도
// (renderUsage 가 매번 innerHTML 을 통째로 새로 만든다) 고른 것이 풀리면
// 안 되니 화면 밖(모듈 스코프)에 둔다.
const _selEmails = new Set();

// 표의 검색·정렬·필터도 같은 이유로 화면 밖에 둔다(달을 바꿔도 풀리지 않게).
// 기능별 사용량에서 내 것을 빼는 것도 여기 — 오류를 잡느라 이리저리 돌아다니면
// 실사용이 뻥튀기된다.
// 보고 있는 화면(요약 / 접속 기록). 달을 바꿔도 보던 화면에 그대로 있어야 한다.
let _ugView      = 'summary';
let _ugLogQuery  = '';
let _ugLogHideMe = false;
let _ugLastRows  = [], _ugLastYm = '';
let _ugLogAll    = [];     // 이 달의 모든 줄 (거르기 전)
// 개인정보(연락처) 열람 기록. 달마다 한 번만 읽어 둔다.
let _privRows = null, _privYm = '', _privBusy = false, _privErr = '';
let _privQuery = '', _privKind = 'all';
let _ugExcludeMe = true;
let _ugQuery     = '';
let _ugOnlyOld   = false;
let _ugSort      = { key: 'opens', dir: 'desc' };
let _ugPeople    = [];

async function usagePeople(){
  const byEmail = new Map();
  TEACHERS.forEach(t => { if(t && t.email) byEmail.set(t.email, t.name || t.email); });
  try {
    const snap = await getDoc(doc(fbDb, 'acl', 'emailByName'));
    if(snap.exists()) Object.entries(snap.data() || {}).forEach(([n, e]) => {
      if(typeof e === 'string' && e.includes('@') && !byEmail.has(e)) byEmail.set(e, n);
    });
  } catch(e){}
  // 위 둘(시간표·교원 명렬)에 없는 선생님은 기록이 쌓여도 안 뜬다. 앱을 연 사람이
  // 스스로 여기에 이름을 올려 두므로(index.html usageRegisterMe) 그것도 본다.
  try {
    const snap = await getDoc(doc(fbDb, 'appdata', 'usageRoster'));
    if(snap.exists()) Object.entries(snap.data() || {}).forEach(([e, n]) => {
      if(typeof e === 'string' && e.includes('@') && !byEmail.has(e)) byEmail.set(e, n || e);
    });
  } catch(e){}
  return [...byEmail].map(([email, name]) => ({ email, name }));
}

let _usageBusy = false;
async function loadUsage(){
  if(_usageBusy) return;
  _usageBusy = true;
  const body = document.getElementById('usageBody');
  const note = document.getElementById('usageNote');
  const ym   = document.getElementById('usageMonth').value || usageDate().slice(0, 7);
  body.innerHTML = '<div style="padding:24px;color:var(--ink-soft);font-size:13px;">불러오는 중…</div>';
  try {
    const people = await usagePeople();
    // 사람마다 문서 하나. 60명이면 읽기 60번 — 하루 한도(5만)에 견주면 무시할 수준이다.
    const rows = await Promise.all(people.map(async p => {
      let days = {};
      try {
        const snap = await getDoc(doc(fbDb, 'usage', p.email, 'm', ym));
        if(snap.exists()) days = snap.data().days || {};
      } catch(e){}
      return { ...p, days };
    }));
    note.textContent = `${ym} · 교직원 ${rows.length}명`;
    _ugLastRows = rows; _ugLastYm = ym;
    renderView();
  } catch(e){
    body.innerHTML = `<div style="padding:24px;color:var(--warn);font-size:13px;">불러오기 실패: ${escapeHtml(e.message)}</div>`;
  } finally { _usageBusy = false; }
}

// 어느 화면을 그릴지 고른다. 달을 다시 읽지 않고 갈아 끼우기만 한다 —
// 사람마다 문서 하나씩 읽으므로 탭을 누를 때마다 다시 읽으면 아깝다.
function renderView(){
  document.querySelectorAll('#usageViews .ug-view').forEach(b =>
    b.classList.toggle('on', b.dataset.view === _ugView));
  if (!_ugLastYm) return;
  if      (_ugView === 'log')  renderUsageLog(_ugLastRows, _ugLastYm);
  else if (_ugView === 'priv') renderPrivacyLog(_ugLastYm);
  else                         renderUsage(_ugLastRows, _ugLastYm);
}
document.getElementById('usageViews')?.addEventListener('click', e => {
  const b = e.target.closest('.ug-view');
  if (!b || b.dataset.view === _ugView) return;
  _ugView = b.dataset.view;
  renderView();
});

// ── 개인정보(연락처) 열람 기록 ───────────────────────────────────────────────
// 개인정보 보호법 제29조가 요구하는 접속기록이다. 앱이 남기는 것이 아니라
// 워커(서비스 계정)가 accessLogs 에 남긴다 — 교사가 자기 기록을 지우거나 고칠
// 수 없어야 하기 때문이다. 규칙도 '쓰기 금지 · 읽기는 관리자만' 이다.
//
//   accessLogs/{이메일}_{날짜} = {
//     email, date,
//     count   그날 조회 횟수
//     people  서로 다른 대상 수 (하루 상한 100명의 기준)
//     items   [{ t:'HH:MM', target:'S 2-3-7' | 'T 홍길동' }]  최대 500개
//   }
//
// 문서가 사람×날짜라 한 달치를 다 읽으려면 이름을 하나씩 맞춰 볼 수가 없다.
// date 로 범위를 걸어 컬렉션을 훑는다(기본 색인으로 된다).
const PRIV_DAILY_LIMIT = 100;   // 워커의 CONTACT_DAILY_LIMIT 과 같은 값
const PRIV_MAX_ITEMS   = 500;   // 워커의 LOG_MAX_ITEMS — 넘으면 상세가 안 쌓인다

async function loadPrivacy(ym){
  if (_privBusy) return;
  _privBusy = true; _privErr = '';
  try {
    const snap = await getDocs(query(collection(fbDb, 'accessLogs'),
      where('date', '>=', ym + '-01'), where('date', '<=', ym + '-31')));
    _privRows = snap.docs.map(d => d.data());
    _privYm = ym;
  } catch(e){
    _privRows = []; _privErr = e.message || String(e);
  } finally { _privBusy = false; }
}

// 사람 이름을 알아야 읽을 만하다. 이 달 명단(_ugLastRows)에 이메일→이름이 있다.
function privName(email){
  const hit = (_ugLastRows || []).find(r => r.email === email);
  return (hit && hit.name) || String(email || '').split('@')[0];
}
// 'S 2-3-7' → 학생 2학년 3반 7번 / 'T 홍길동' → 교직원 홍길동
function privTarget(t){
  const s = String(t || '');
  if (s.startsWith('S ')) return { kind:'student', label:'학생 ' + s.slice(2) };
  if (s.startsWith('T ')) return { kind:'staff',   label:'교직원 ' + s.slice(2) };
  return { kind:'etc', label:s };
}

async function renderPrivacyLog(ym){
  const body = document.getElementById('usageBody');
  if (_privYm !== ym || _privRows === null) {
    body.innerHTML = '<div style="padding:24px;color:var(--ink-soft);font-size:13px;">열람 기록을 불러오는 중…</div>';
    await loadPrivacy(ym);
    if (_ugView !== 'priv') return;          // 그 사이 다른 탭으로 갔다
  }
  if (_privErr) {
    body.innerHTML = `<div style="padding:24px;color:var(--warn);font-size:13px;">
      열람 기록을 불러오지 못했습니다: ${escapeHtml(_privErr)}</div>`;
    return;
  }

  // 한 줄에 한 건. 시각이 있는 것은 items 에서, 없는 것(500개 넘어 상세가
  // 안 쌓인 날)은 '건수만' 으로 따로 알린다.
  const rows = [];
  let overflow = 0;
  for (const r of (_privRows || [])) {
    const items = Array.isArray(r.items) ? r.items : [];
    for (const it of items) {
      const t = privTarget(it && it.target);
      rows.push({ date: r.date, time: (it && it.t) || '', email: r.email,
                  name: privName(r.email), target: t.label, kind: t.kind });
    }
    const cnt = Number(r.count) || 0;
    if (cnt > items.length) overflow += cnt - items.length;
  }

  const q = _privQuery.trim().toLowerCase();
  const shown = rows.filter(x =>
    (_privKind === 'all' || x.kind === _privKind) &&
    (!q || x.name.toLowerCase().includes(q)
        || x.target.toLowerCase().includes(q)
        || String(x.email).toLowerCase().includes(q)));
  shown.sort((a, b) => b.date.localeCompare(a.date)
                    || String(b.time).localeCompare(String(a.time))
                    || String(a.name).localeCompare(String(b.name), 'ko'));

  const chip = (l, v) => `<div class="ug-chip"><span>${l}</span><b>${v}</b></div>`;
  const whoCnt = new Set(shown.map(x => x.email)).size;
  const tgtCnt = new Set(shown.map(x => x.target)).size;
  // 하루 상한에 가까운 사람 — 많이 본 날이 있으면 짚어 준다
  const near = (_privRows || []).filter(r => (Number(r.people) || 0) >= PRIV_DAILY_LIMIT * 0.8);

  let prev = '';
  const tbody = shown.map(x => {
    const same = x.date === prev; prev = x.date;
    const w = new Date(x.date + 'T00:00:00').getDay();
    return `<tr>
      <td class="ug-log-date${same ? ' same' : ''}">${escapeHtml(x.date.slice(5))}
        <span class="${w === 0 || w === 6 ? 'ug-log-wk' : 'dim'}">${UG_DOW[w]}</span></td>
      <td class="dim">${escapeHtml(x.time)}</td>
      <td class="nm">${escapeHtml(x.name)}</td>
      <td>${escapeHtml(x.target)}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `
    <div class="ug-chips">
      ${chip('열람 건수', shown.length.toLocaleString())}
      ${chip('열람한 사람', `${whoCnt}명`)}
      ${chip('열람 대상', `${tgtCnt}명`)}
      ${chip('하루 상한 근접', near.length
        ? `<span style="color:var(--warn)">${near.length}건</span>` : '없음')}
    </div>
    ${near.length ? `<div class="ug-card" style="border-color:var(--warn);">
      <div class="ug-h">하루 ${PRIV_DAILY_LIMIT}명 상한에 가까운 날</div>
      <div style="font-size:12.5px;line-height:1.8;">${near
        .sort((a,b) => (b.people||0) - (a.people||0))
        .map(r => `${escapeHtml(r.date)} · <b>${escapeHtml(privName(r.email))}</b> ${r.people}명`)
        .join(' &nbsp;/&nbsp; ')}</div></div>` : ''}
    <div class="ug-card">
      <div class="ug-h">연락처 열람 기록 <small>누가 · 언제 · 누구를 조회했는지</small></div>
      <div class="ug-tools">
        <input type="search" id="ugPrivSearch" placeholder="교사 이름 · 대상으로 찾기" value="${escapeHtml(_privQuery)}">
        <label><input type="radio" name="privKind" value="all"     ${_privKind==='all'?'checked':''}> 전체</label>
        <label><input type="radio" name="privKind" value="student" ${_privKind==='student'?'checked':''}> 학생</label>
        <label><input type="radio" name="privKind" value="staff"   ${_privKind==='staff'?'checked':''}> 교직원</label>
        <span class="dim">${shown.length.toLocaleString()} / ${rows.length.toLocaleString()}건</span>
      </div>
      <div class="ug-tblwrap"><table class="ug-tbl">
        <thead><tr><th>날짜</th><th>시각</th><th>조회한 사람</th><th>대상</th></tr></thead>
        <tbody>${tbody || '<tr><td colspan="4" class="dim" style="padding:18px;">이 달에는 열람 기록이 없습니다.</td></tr>'}</tbody>
      </table></div>
      ${overflow ? `<div class="ug-idle">하루 ${PRIV_MAX_ITEMS}건이 넘어 상세가 안 남은 조회가
        <b>${overflow.toLocaleString()}건</b> 있습니다 (건수는 셉니다).</div>` : ''}
    </div>
    <div class="ug-foot">개인정보 보호법 제29조에 따른 접속기록입니다.
      앱이 아니라 <b>워커(서비스 계정)</b>가 남기며, 교사는 고치거나 지울 수 없습니다.
      400일 뒤 자동으로 지워집니다.</div>`;

  const qi = document.getElementById('ugPrivSearch');
  qi?.addEventListener('input', () => { _privQuery = qi.value; renderPrivacyLog(ym);
    const el = document.getElementById('ugPrivSearch');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
  document.querySelectorAll('input[name=privKind]').forEach(r =>
    r.addEventListener('change', () => { _privKind = r.value; renderPrivacyLog(ym); }));
}

// ── 접속 기록 ────────────────────────────────────────────────────────────────
// 요약은 '이 달에 누가 얼마나' 를 보지만, 가끔 궁금한 것은 '며칠에 누가 들어왔나'
// 다. 그건 이미 쌓여 있다 — usage/{이메일}/m/{연-월} 의 days 가 날짜별이다.
// 새로 남길 것 없이 그 자료를 날짜순으로 펴서 보여 주기만 하면 된다.
//
// 시각은 '마지막으로 쓴 때' 하나뿐이다. 들어온 시각은 안 남긴다 — 남기려면
// 하루 첫 기록인지를 알아야 하는데, 이 문서는 규칙상 본인이 못 읽는다.
const UG_DOW = ['일','월','화','수','목','금','토'];

// 지금 검색·필터에 맞는 줄만. 최근 날이 위로, 같은 날이면 늦게까지 쓴 사람이 위로.
function ugLogFiltered(){
  const q = _ugLogQuery.trim().toLowerCase();
  return _ugLogAll.filter(l =>
      (!_ugLogHideMe || l.email !== ADMIN_EMAIL) &&
      (!q || String(l.name || '').toLowerCase().includes(q)
          || String(l.email || '').toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date)
                 || String(b.last).localeCompare(String(a.last))
                 || String(a.name).localeCompare(String(b.name), 'ko'));
}

// 같은 날이 이어지면 날짜를 한 번만 적는다 — 날짜 덩어리가 눈에 잡히게.
function ugLogRowsHtml(shown){
  let prev = '';
  return shown.map(l => {
    const w = new Date(l.date + 'T00:00:00').getDay();
    const same = l.date === prev; prev = l.date;
    return `<tr>
      <td class="ug-log-date${same ? ' same' : ''}">${escapeHtml(l.date.slice(5))}
        <span class="${w === 0 || w === 6 ? 'ug-log-wk' : 'dim'}">${UG_DOW[w]}</span></td>
      <td class="nm">${escapeHtml(l.name)}</td>
      <td class="num">${l.opens || ''}</td>
      <td class="dim">${escapeHtml(l.last)}</td>
      <td class="num">${l.stu ? `${l.stu}<span class="dim"> / ${l.hit || l.stu}회</span>` : ''}</td>
      <td class="num">${l.clicks || ''}</td>
      <td class="dim">${l.top.map(t => `${escapeHtml(USAGE_TABS[t[0]] || t[0])} ${t[1]}`).join(' · ')}</td>
      <td class="${l.ver && l.ver !== APP_VER ? 'old' : 'dim'}">${escapeHtml(l.ver)}</td>
    </tr>`;
  }).join('');
}

// 검색어를 칠 때는 본문만 갈아 끼운다. 화면을 통째로 다시 만들면 입력칸이 글자를
// 칠 때마다 새로 생겨 포커스가 튄다 — 사람별 표가 같은 이유로 그렇게 한다.
function ugLogRefresh(){
  const shown = ugLogFiltered();
  const tb = document.getElementById('ugLogBody');
  if (tb) tb.innerHTML = ugLogRowsHtml(shown)
    || '<tr><td colspan="8" class="dim" style="padding:18px;">기록이 없습니다.</td></tr>';
  const cnt = document.getElementById('ugLogCount');
  if (cnt) cnt.textContent = `${shown.length.toLocaleString()} / ${_ugLogAll.length.toLocaleString()}줄`;
}

function renderUsageLog(rows, ym){
  const nameOf = new Map(rows.map(r => [r.email, r.name]));
  const logs = [];
  for (const r of rows) {
    for (const [date, row] of Object.entries(r.days || {})) {
      if (!row) continue;
      const tabs = row.tabs || {};
      logs.push({
        date, email: r.email, name: r.name,
        opens:  Number(row.opens) || 0,
        last:   row.last || '',
        ver:    row.ver  || '',
        stu:    Number((row.counts || {}).stu)    || 0,   // 본 학생 수
        hit:    Number((row.counts || {}).stuHit) || 0,   // 조회 건수
        clicks: Object.values(tabs).reduce((a, b) => a + (Number(b) || 0), 0),
        top:    Object.entries(tabs).sort((a,b) => b[1]-a[1]).slice(0, 3),
      });
    }
  }
  _ugLogAll = logs;
  const shown = ugLogFiltered();

  const chip = (l, v) => `<div class="ug-chip"><span>${l}</span><b>${v}</b></div>`;
  const stuAll   = shown.reduce((a, l) => a + l.stu, 0);
  const hitAll   = shown.reduce((a, l) => a + (l.hit || l.stu), 0);
  const opensAll = shown.reduce((a, l) => a + l.opens, 0);
  const dayCnt   = new Set(shown.map(l => l.date)).size;
  const whoCnt   = new Set(shown.map(l => l.email)).size;

  const body = ugLogRowsHtml(shown);

  document.getElementById('usageBody').innerHTML = `
    <div class="ug-chips">
      ${chip('기록', `${shown.length.toLocaleString()}줄`)}
      ${chip('사람', `${whoCnt}명`)}
      ${chip('날', `${dayCnt}일`)}
      ${chip('앱 연 횟수', opensAll.toLocaleString())}
      ${chip('학생 조회', `${stuAll.toLocaleString()}명<small> / ${hitAll.toLocaleString()}회</small>`)}
    </div>
    <div class="ug-card">
      <div class="ug-h">접속 기록 <small>하루에 한 줄씩 · 최근이 위</small></div>
      <div class="ug-tools">
        <input type="search" id="ugLogSearch" placeholder="이름으로 찾기" value="${escapeHtml(_ugLogQuery)}">
        <label><input type="checkbox" id="ugLogHideMe" ${_ugLogHideMe ? 'checked' : ''}> 내 기록 빼기</label>
        <span class="dim" id="ugLogCount">${shown.length.toLocaleString()} / ${logs.length.toLocaleString()}줄</span>
      </div>
      <div class="ug-tblwrap"><table class="ug-tbl">
        <thead><tr><th>날짜</th><th>이름</th><th>연 횟수</th><th>마지막</th>
          <th title="본 학생 수 / 조회 건수 · 누구인지는 기록하지 않습니다">학생 조회</th>
          <th>탭 이동</th><th>많이 쓴 기능</th><th>버전</th></tr></thead>
        <tbody id="ugLogBody">${body || '<tr><td colspan="8" class="dim" style="padding:18px;">기록이 없습니다.</td></tr>'}</tbody>
      </table></div>
    </div>
    <div class="ug-foot">기록은 <b>앱을 연 횟수</b>와 <b>탭 이름·횟수</b>, 그리고
      <b>학생 종합검색에서 본 학생 수·조회 건수</b>뿐입니다. <b>누구를 봤는지는 담지 않습니다.</b>
      (연락처 조회는 법에 따라 따로 남습니다.)</div>`;

  const q2 = document.getElementById('ugLogSearch');
  q2?.addEventListener('input', () => { _ugLogQuery = q2.value; ugLogRefresh(); });
  // 내 것을 빼면 위 요약 숫자도 달라져야 하므로 통째로 다시 그린다
  document.getElementById('ugLogHideMe')?.addEventListener('change', e => {
    _ugLogHideMe = e.target.checked; renderUsageLog(rows, ym);
  });
}

function renderUsage(rows, ym){
  const [y, mo] = ym.split('-').map(Number);
  const nDays = new Date(y, mo, 0).getDate();
  const dstr  = d => `${ym}-${String(d).padStart(2,'0')}`;

  // ── 집계 ───────────────────────────────────────────────────────────────
  const perDay = Array.from({length:nDays}, () => ({ users:0, opens:0 }));
  const tabTot = {};
  let opensAll = 0, usersAll = 0;
  // '오늘' 은 지금 보고 있는 달이 이번 달일 때만 뜻이 있다. 지난 달을 보면서
  // 오늘 칸을 채우면 무엇을 보는지 헷갈린다.
  const _now = new Date();
  const isThisMonth = _now.getFullYear() === y && _now.getMonth() + 1 === mo;
  const todayKey = isThisMonth ? dstr(_now.getDate()) : '';

  const people = rows.map(r => {
    let opens = 0, used = 0, last = '', tabs = {}, ver = '', stu = 0, hit = 0;
    for(let d = 1; d <= nDays; d++){
      const row = r.days[dstr(d)];
      if(!row) continue;
      const o = Number(row.opens) || 0;
      opens += o; used++;
      if(row.ver) ver = row.ver;                 // 마지막으로 쓴 화면 버전
      // 학생 종합검색 — 본 학생 수와 조회 건수. 누구인지는 안 담긴다.
      stu += Number((row.counts || {}).stu)    || 0;
      hit += Number((row.counts || {}).stuHit) || 0;
      perDay[d-1].users++; perDay[d-1].opens += o;
      if(row.date || row.last) last = `${dstr(d).slice(5)} ${row.last || ''}`.trim();
      const mine = r.email === ADMIN_EMAIL;
      Object.entries(row.tabs || {}).forEach(([k, v]) => {
        tabs[k] = (tabs[k] || 0) + (Number(v) || 0);
        // 기능별 합계에서만 뺀다 — 사람별 표의 내 줄은 그대로 둔다.
        if(!(_ugExcludeMe && mine)) tabTot[k] = (tabTot[k] || 0) + (Number(v) || 0);
      });
    }
    opensAll += opens;
    if(used) usersAll++;
    const top = Object.entries(tabs).sort((a,b) => b[1]-a[1]).slice(0,3);
    // 오늘 것은 달 전체와 따로 센다 — '요즘 뭘 쓰나' 는 누적으로는 안 보인다.
    const tday = todayKey ? (r.days[todayKey] || null) : null;
    const todayTabs = tday ? Object.entries(tday.tabs || {}).sort((a,b) => b[1]-a[1]) : [];
    const todayOpens = tday ? (Number(tday.opens) || 0) : 0;
    return { ...r, opens, used, last, tabs, top, ver, todayTabs, todayOpens, stu, hit,
             clicks: Object.values(tabs).reduce((a,b)=>a+b,0) };
  }).sort((a,b) => b.opens - a.opens || b.used - a.used || a.name.localeCompare(b.name,'ko'));

  const daysWithUse = perDay.filter(d => d.users).length;
  const avgUsers = daysWithUse ? (perDay.reduce((a,d)=>a+d.users,0) / daysWithUse) : 0;
  // 주말은 대부분 0 이라 '하루 평균'을 끌어내린다. 평일만 따로 낸다.
  // 분모는 '평일 중 쓴 날' — 위 하루 평균과 같은 기준으로 맞춘다.
  const isWeekend = d => { const w = new Date(y, mo-1, d).getDay(); return w === 0 || w === 6; };
  const wdUsed = perDay.filter((d, i) => d.users && !isWeekend(i+1));
  const avgWeekday = wdUsed.length ? (wdUsed.reduce((a,d)=>a+d.users,0) / wdUsed.length) : 0;
  const tabRank = Object.entries(tabTot).sort((a,b) => b[1]-a[1]);
  const tabMax  = tabRank.length ? tabRank[0][1] : 0;
  const dayMax  = Math.max(1, ...perDay.map(d => d.users));
  const clickAll = tabRank.reduce((a,t) => a + t[1], 0);

  const chip = (l, v) => `<div class="ug-chip"><span>${l}</span><b>${v}</b></div>`;
  const pct  = (n, d) => d ? Math.round(n / d * 100) : 0;

  // ── 일자별 막대 ────────────────────────────────────────────────────────
  const today = usageDate();
  const bars = perDay.map((d, i) => {
    const ds = dstr(i+1);
    const dow = new Date(y, mo-1, i+1).getDay();
    const h = Math.round(d.users / dayMax * 100);
    return `<div class="ug-bar${d.users ? '' : ' zero'}${ds === today ? ' today' : ''}"
                 title="${ds} · ${d.users}명 · ${d.opens}회">
      <div class="ug-bar-fill" style="height:${d.users ? Math.max(4, h) : 0}%"></div>
      <span class="ug-bar-lab${dow === 0 || dow === 6 ? ' wk' : ''}">${i+1}</span>
    </div>`;
  }).join('');

  // ── 탭별 막대 ──────────────────────────────────────────────────────────
  const tabBars = tabRank.length ? tabRank.map(([k, v]) => `
    <div class="ug-trow">
      <span class="ug-tname">${escapeHtml(USAGE_TABS[k] || k)}</span>
      <span class="ug-tbar"><i style="width:${Math.max(2, Math.round(v/tabMax*100))}%"></i></span>
      <span class="ug-tnum">${v.toLocaleString()}<em>${pct(v, clickAll)}%</em></span>
    </div>`).join('')
    : '<div class="ug-empty">아직 기록이 없습니다.</div>';

  // ── 사람별 표 ──────────────────────────────────────────────────────────
  const used = people.filter(p => p.used), idle = people.filter(p => !p.used);
  // 검색·정렬은 표 본문만 다시 그린다 — 화면을 통째로 다시 만들면 입력칸이
  // 글자를 칠 때마다 새로 생겨 포커스가 튄다.
  _ugPeople = used;
  // 이름을 체크하면 그 사람만 골라 새로고침을 보낼 수 있다. 표에 없는
  // '이 달에 안 쓴' 사람도 아래에서 같은 방식으로 고를 수 있다.
  const pickBox = p => `<label><input type="checkbox" data-email="${escapeHtml(p.email)}"
      ${_selEmails.has(p.email) ? 'checked' : ''}> ${escapeHtml(p.name)}</label>`;
  const rowHtml = p => `<tr class="ug-prow${_selEmails.has(p.email) ? ' sel' : ''}">
    <td class="nm">${pickBox(p)}</td>
    <td class="num">${p.opens || ''}</td>
    <td class="num">${p.used || ''}</td>
    <td class="num">${p.clicks || ''}</td>
    <td class="num">${p.stu ? `${p.stu}<span class="dim"> / ${p.hit || p.stu}회</span>` : ''}</td>
    <td class="dim">${escapeHtml(p.last)}</td>
    <td class="${p.ver && p.ver !== APP_VER ? 'old' : 'dim'}">${escapeHtml(p.ver)}</td>
    <td class="dim">${p.top.map(t => `${escapeHtml(USAGE_TABS[t[0]] || t[0])} ${t[1]}`).join(' · ')}</td>
    ${todayKey ? `<td class="dim today">${p.todayTabs.length
        ? p.todayTabs.slice(0,3).map(t => `${escapeHtml(USAGE_TABS[t[0]] || t[0])} ${t[1]}`).join(' · ')
        : '<span class="dim">—</span>'}</td>` : ''}
  </tr>`;

  document.getElementById('usageBody').innerHTML = `
    <div class="ug-chips">
      ${chip('쓴 사람', `${usersAll}<small> / ${people.length}명</small>`)}
      ${chip('앱 연 횟수', opensAll.toLocaleString())}
      ${chip('탭 이동', clickAll.toLocaleString())}
      ${chip('학생 조회', `${people.reduce((a,p) => a + (p.stu||0), 0).toLocaleString()}명<small> / ${people.reduce((a,p) => a + (p.hit||p.stu||0), 0).toLocaleString()}회</small>`)}
      ${chip('사용한 날', `${daysWithUse}일`)}
      ${chip('하루 평균', `${avgUsers.toFixed(1)}명`)}
      ${chip('평일 평균', `${avgWeekday.toFixed(1)}명`)}
      ${(() => { const old_ = people.filter(p => p.ver && p.ver !== APP_VER).length;
                 return chip('옛 버전', old_ ? `<span style="color:var(--warn)">${old_}명</span>` : '없음'); })()}
    </div>

    <div class="ug-card">
      <div class="ug-h">날짜별 사용자</div>
      <div class="ug-bars">${bars}</div>
    </div>

    <div class="ug-two">
      <div class="ug-card">
        <div class="ug-h">기능별 사용량 <small>탭을 연 횟수</small>
          <label class="ug-mine"><input type="checkbox" id="ugExcludeMe"
            ${_ugExcludeMe ? 'checked' : ''}> 내 사용량 빼기</label></div>
        ${tabBars}
      </div>
      <div class="ug-card">
        <div class="ug-h">사람별 <small>이름을 체크하면 그 사람에게만 새로고침을 보낼 수 있습니다</small></div>
        <div id="ugSelBar">
          <span><b id="ugSelCount">0</b>명 선택됨</span>
          <button class="btn warn" id="usageReloadSelBtn" type="button">📣 선택한 사람만 새로고침</button>
          <button class="btn" id="ugSelClearBtn" type="button">선택 해제</button>
        </div>
        <div class="ug-tools">
          <input type="search" id="ugSearch" placeholder="이름으로 찾기" value="${escapeHtml(_ugQuery)}">
          <label><input type="checkbox" id="ugOnlyOld" ${_ugOnlyOld ? 'checked' : ''}> 옛 버전만</label>
          <span class="dim" id="ugCount"></span>
        </div>
        <div class="ug-tblwrap"><table class="ug-tbl">
          <thead><tr><th data-sort="name">이름</th><th data-sort="opens">연 횟수</th><th data-sort="used">쓴 날</th>
            <th data-sort="clicks">탭 이동</th>
            <th data-sort="stu" title="본 학생 수 / 조회 건수 — 누구인지는 기록하지 않습니다">학생 조회</th>
            <th data-sort="last">마지막</th><th data-sort="ver">버전</th>
            <th>많이 쓴 기능 <small>이 달</small></th>
            ${todayKey ? `<th data-sort="todayOpens">오늘 쓴 기능</th>` : ''}</tr></thead>
          <tbody id="ugTbody"></tbody>
        </table></div>
        ${idle.length ? `<div class="ug-idle"><b>이 달에 안 쓴 ${idle.length}명</b>
          <div>${idle.map(pickBox).join(' ')}</div></div>` : ''}
      </div>
    </div>

    <div class="ug-foot">기록은 <b>앱을 연 횟수</b>와 <b>탭 이름·횟수</b>, 그리고
      <b>학생 종합검색에서 본 학생 수</b>뿐입니다.
      무엇을 검색했는지·<b>누구를 조회했는지는 담지 않습니다.</b>
      (연락처 조회는 법에 따라 따로 남습니다.)</div>`;

  ugRenderRows(rowHtml);

  // 체크박스마다 듣는다. 표(사람별)와 이달에 안 쓴 목록이 같은 방식(data-email)
  // 을 쓰므로 한 번에 묶어 처리한다.
  ugBindPickBoxes();

  // 검색 — 글자를 칠 때마다 본문만 다시 그린다
  const q = document.getElementById('ugSearch');
  q?.addEventListener('input', () => { _ugQuery = q.value; ugRenderRows(rowHtml); ugBindPickBoxes(); });
  document.getElementById('ugOnlyOld')?.addEventListener('change', e => {
    _ugOnlyOld = e.target.checked; ugRenderRows(rowHtml); ugBindPickBoxes();
  });
  // 머리글을 누르면 그 열로 정렬. 같은 열을 다시 누르면 방향이 바뀐다.
  document.querySelectorAll('.ug-tbl th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if(_ugSort.key === key) _ugSort.dir = _ugSort.dir === 'desc' ? 'asc' : 'desc';
      else _ugSort = { key, dir: key === 'name' ? 'asc' : 'desc' };
      ugRenderRows(rowHtml); ugBindPickBoxes();
    });
  });
  // 기능별에서 내 것 빼기 — 집계가 달라지므로 통째로 다시 그린다
  document.getElementById('ugExcludeMe')?.addEventListener('change', e => {
    _ugExcludeMe = e.target.checked;
    renderUsage(rows, ym);
  });

  updateSelBar();
}

// 지금 상태(검색·필터·정렬)에 맞는 줄을 고른다
function ugFilteredSorted(){
  const q = _ugQuery.trim().toLowerCase();
  let list = _ugPeople.filter(p =>
    (!q || String(p.name || '').toLowerCase().includes(q)
        || String(p.email || '').toLowerCase().includes(q)) &&
    (!_ugOnlyOld || (p.ver && p.ver !== APP_VER)));

  const { key, dir } = _ugSort;
  const sign = dir === 'asc' ? 1 : -1;
  list = list.slice().sort((a, b) => {
    const av = a[key], bv = b[key];
    const cmp = (typeof av === 'number' && typeof bv === 'number')
      ? av - bv
      : String(av ?? '').localeCompare(String(bv ?? ''), 'ko');
    // 값이 같으면 이름으로 — 다시 그릴 때마다 순서가 흔들리지 않게
    return cmp !== 0 ? cmp * sign : String(a.name).localeCompare(String(b.name), 'ko');
  });
  return list;
}

function ugRenderRows(rowHtml){
  const tb = document.getElementById('ugTbody');
  if(!tb) return;
  const list = ugFilteredSorted();
  tb.innerHTML = list.map(rowHtml).join('')
    || `<tr><td colspan="8" class="dim">${_ugQuery || _ugOnlyOld ? '찾는 사람이 없습니다' : '기록 없음'}</td></tr>`;
  const cnt = document.getElementById('ugCount');
  if(cnt) cnt.textContent = list.length === _ugPeople.length
    ? `${list.length}명` : `${list.length}명 / ${_ugPeople.length}명`;
  document.querySelectorAll('.ug-tbl th[data-sort]').forEach(th => {
    th.classList.toggle('on', th.dataset.sort === _ugSort.key);
    th.dataset.dir = th.dataset.sort === _ugSort.key ? _ugSort.dir : '';
  });
}

function ugBindPickBoxes(){
  document.querySelectorAll('#usageBody input[type=checkbox][data-email]').forEach(cb => {
    if(cb.dataset.bound) return;
    cb.dataset.bound = '1';
    cb.addEventListener('change', () => {
      if (cb.checked) _selEmails.add(cb.dataset.email); else _selEmails.delete(cb.dataset.email);
      cb.closest('tr')?.classList.toggle('sel', cb.checked);
      updateSelBar();
    });
  });
}

// 선택 바를 고른 인원 수에 맞춰 보이거나 숨긴다. renderUsage 가 통째로 다시
// 그릴 때마다(달을 바꿀 때 등) 불러 상태를 맞춘다.
function updateSelBar(){
  const bar = document.getElementById('ugSelBar');
  if (!bar) return;
  bar.style.display = _selEmails.size ? 'flex' : 'none';
  const cnt = document.getElementById('ugSelCount');
  if (cnt) cnt.textContent = String(_selEmails.size);
}

// ── 모두 새로고침 ──────────────────────────────────────────────────────
// 배포해도 탭을 켜 둔 사람은 옛 화면을 계속 쓴다. 번호를 올리면 열려 있는
// 화면들이 스냅샷으로 받아 조용히 새로고침한다(적는 중인 사람은 빼고).
// to 를 안 주면 전체, 주면(이메일 배열) 그 사람들에게만. setDoc 은 문서를
// 통째로 갈아 끼우므로(merge 아님) 전체로 보낼 때 지난번 to 가 남지 않는다.
async function broadcastReload(to){
  const targeting = Array.isArray(to) && to.length > 0;
  const btn = document.getElementById(targeting ? 'usageReloadSelBtn' : 'usageReloadAllBtn');
  const ref = doc(fbDb, 'appNotice', 'reload');
  try {
    if (btn) btn.disabled = true;
    const snap = await getDoc(ref);
    const n = (Number(snap.exists() ? snap.data().n : 0) || 0) + 1;
    const payload = { n, at: new Date().toISOString(), by: fbAuth.currentUser.email, ver: APP_VER };
    if (targeting) payload.to = to;
    await setDoc(ref, payload);
    document.getElementById('usageNote').textContent = targeting
      ? `선택한 ${to.length}명에게 새로고침을 보냈습니다 (#${n}).`
      : `열려 있는 화면에 새로고침을 보냈습니다 (#${n}).`;
  } catch(e) {
    document.getElementById('usageNote').textContent = '보내기 실패: ' + (e.message || e);
  } finally { if (btn) btn.disabled = false; }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  document.getElementById('gateErr').textContent = '';
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ hd: 'yeungnam.hs.kr', prompt: 'select_account' });
  try { await signInWithPopup(fbAuth, provider); }
  catch(e) { document.getElementById('gateErr').textContent = '로그인 실패: ' + e.message; }
});
// 앱 안에서 iframe 으로 열렸을 때(?in=1)는 '대시보드' 버튼을 숨긴다.
// 그대로 두면 프레임 안이 앱으로 바뀌어 앱 속에 앱이 뜬다. 나가는 것은
// 바깥의 '← 돌아가기' 가 한다.
const IN_APP = new URLSearchParams(location.search).get('in') === '1' || window.top !== window.self;
if (IN_APP) { document.getElementById('homeBtn').hidden = true; document.body.classList.add('in-app'); }
document.getElementById('homeBtn').addEventListener('click', () => { location.href = 'index.html'; });
document.getElementById('usageReloadBtn').addEventListener('click', () => loadUsage());
document.getElementById('usageMonth').addEventListener('change', () => loadUsage());
document.getElementById('usageReloadAllBtn').addEventListener('click', () => {
  if (confirm('열려 있는 모든 선생님 화면을 새로고침합니다.\n\n'
    + '뭔가 적고 있는 분은 새로고침하지 않고 안내만 뜹니다.\n계속할까요?')) broadcastReload();
});
// 선택 바는 renderUsage 가 부를 때마다 다시 그려지므로(달을 바꿀 때 등),
// 그 안의 버튼에 직접 걸지 않고 안 바뀌는 #usageBody 에서 위임해 듣는다.
document.getElementById('usageBody').addEventListener('click', e => {
  if (e.target.closest('#usageReloadSelBtn')) {
    const to = [..._selEmails];
    if (to.length && confirm(`선택한 ${to.length}명에게만 새로고침을 보냅니다.\n\n`
      + '뭔가 적고 있으면 새로고침하지 않고 안내만 뜹니다.\n계속할까요?')) broadcastReload(to);
  } else if (e.target.closest('#ugSelClearBtn')) {
    _selEmails.clear();
    document.querySelectorAll('#usageBody input[type=checkbox][data-email]').forEach(cb => { cb.checked = false; });
    document.querySelectorAll('#usageBody tr.ug-prow.sel').forEach(tr => tr.classList.remove('sel'));
    updateSelBar();
  }
});

onAuthStateChanged(fbAuth, user => {
  const gate = document.getElementById('gate');
  if (!user) { gate.style.display = 'flex'; return; }
  if (user.email !== ADMIN_EMAIL) {
    // 자료는 규칙이 막지만, 왜 안 보이는지는 말해 주는 게 낫다.
    document.getElementById('gateErr').textContent =
      '관리자 계정이 아닙니다.\n현재: ' + (user.email || '알 수 없음');
    gate.style.display = 'flex';
    return;
  }
  gate.style.display = 'none';
  const m = document.getElementById('usageMonth');
  if (!m.value) m.value = usageDate().slice(0, 7);
  loadUsage();
});
</script>
</body>
</html>
